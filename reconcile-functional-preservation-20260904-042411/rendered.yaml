apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: shopnoltd
  name: keycloak-client-sync
  namespace: shopno-identity
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak-client-sync
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - /opt/sync/client-sync.py
        env:
        - name: KEYCLOAK_URL
          value: http://keycloak.shopno-identity.svc.cluster.local
        - name: KEYCLOAK_REALM
          value: shopnoltd
        - name: KEYCLOAK_ADMIN_USER
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
              name: keycloak-secret
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        name: sync
        resources:
          limits:
            cpu: 250m
            ephemeral-storage: 128Mi
            memory: 128Mi
          requests:
            cpu: 25m
            ephemeral-storage: 32Mi
            memory: 32Mi
        volumeMounts:
        - mountPath: /opt/sync
          name: script
          readOnly: true
      restartPolicy: Never
      volumes:
      - configMap:
          name: keycloak-client-sync-script-d6762d52bd
        name: script
