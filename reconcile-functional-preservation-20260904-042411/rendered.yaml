apiVersion: v1
data:
  patch-config.js: |
    const fs = require("fs");

    const file = "/opt/meshcentral/meshcentral-data/config.json";

    const config = JSON.parse(fs.readFileSync(file, "utf8"));

    if (!config.settings) {
      config.settings = {};
    }

    if (!config.domains) {
      config.domains = {};
    }

    if (!config.domains[""]) {
      config.domains[""] = {};
    }

    config.settings.cert = "remote.shopnoltd.dpdns.org";
    config.settings.tlsOffload = false;

    config.domains[""].certUrl =
      "https://remote.shopnoltd.dpdns.org";

    config.domains[""].allowedOrigin =
      "remote.shopnoltd.dpdns.org";

    fs.writeFileSync(
      file,
      JSON.stringify(config, null, 2) + "\n",
      { mode: 0o644 }
    );

    console.log("MeshCentral origin configuration normalized.");
kind: ConfigMap
metadata:
  name: meshcentral-config-init
  namespace: shopno-tools
---
apiVersion: v1
data:
  app.py: |
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Optional
    import base64
    import hashlib
    import hmac
    import json
    import os
    import secrets
    import threading
    import time
    import uuid

    from fastapi import FastAPI, HTTPException, Request
    from pydantic import BaseModel, Field


    app = FastAPI(title="Shopnoltd Remote Device Registry")


    DATA_DIR = Path(os.getenv("DATA_DIR", "/data"))
    DATA_FILE = DATA_DIR / "devices.json"
    JOB_FILE = DATA_DIR / "executor-jobs.json"
    NONCE_FILE = DATA_DIR / "executor-nonces.json"

    LOCK = threading.Lock()

    DATA_DIR.mkdir(parents=True, exist_ok=True)


    # ------------------------------------------------------------
    # Models
    # ------------------------------------------------------------

    class DeviceCreate(BaseModel):
        name: str = Field(min_length=1, max_length=120)
        platform: str = Field(default="unknown", max_length=32)
        owner_id: str = Field(default="local-admin", max_length=200)


    class MeshCentralLink(BaseModel):
        meshcentral_node_id: str = Field(min_length=1, max_length=500)
        meshcentral_mesh_id: Optional[str] = Field(
            default=None,
            max_length=500,
        )


    class Device(BaseModel):
        id: str
        name: str
        platform: str
        owner_id: str
        status: str
        enrollment_token: Optional[str] = None
        agent_id: Optional[str] = None
        executor_enabled: bool = False
        executor_secret_hash: Optional[str] = None
        executor_last_seen: Optional[str] = None
        last_seen: Optional[str] = None
        created_at: str
        meshcentral_node_id: Optional[str] = None
        meshcentral_mesh_id: Optional[str] = None


    class DevicePublic(BaseModel):
        id: str
        name: str
        platform: str
        owner_id: str
        status: str
        agent_id: Optional[str] = None
        executor_enabled: bool = False
        executor_last_seen: Optional[str] = None
        last_seen: Optional[str] = None
        created_at: str
        meshcentral_node_id: Optional[str] = None
        meshcentral_mesh_id: Optional[str] = None


    class DeviceCreated(DevicePublic):
        enrollment_token: str


    class ExecutorEnroll(BaseModel):
        enrollment_token: str = Field(min_length=10, max_length=500)
        hostname: str = Field(min_length=1, max_length=255)
        platform: str = Field(default="unknown", max_length=32)
        agent_version: str = Field(default="1.0", max_length=32)


    class ExecutorHeartbeat(BaseModel):
        agent_id: str
        hostname: str = Field(min_length=1, max_length=255)
        platform: str = Field(default="unknown", max_length=32)
        version: str = Field(default="1.0", max_length=32)


    class JobCreate(BaseModel):
        device_id: str
        operation: str = Field(min_length=1, max_length=100)
        created_by: str | None = None


    class JobResult(BaseModel):
        ok: bool
        operation: Optional[str] = None
        duration_seconds: Optional[float] = None
        result: Optional[dict] = None
        error: Optional[str] = None


    # ------------------------------------------------------------
    # Storage helpers
    # ------------------------------------------------------------

    def read_json(path: Path, default):
        if not path.exists():
            return default

        try:
            value = json.loads(path.read_text())
            return value
        except Exception:
            return default


    def write_json(path: Path, value):
        tmp = path.with_suffix(path.suffix + ".tmp")
        tmp.write_text(
            json.dumps(value, indent=2),
            encoding="utf-8",
        )
        tmp.replace(path)


    def load_devices():
        value = read_json(DATA_FILE, [])
        return value if isinstance(value, list) else []


    def save_devices(items):
        write_json(DATA_FILE, items)


    def load_jobs():
        value = read_json(JOB_FILE, [])
        return value if isinstance(value, list) else []


    def save_jobs(items):
        write_json(JOB_FILE, items)


    def load_nonces():
        value = read_json(NONCE_FILE, {})
        return value if isinstance(value, dict) else {}


    def save_nonces(items):
        write_json(NONCE_FILE, items)


    def public_device(device: dict) -> DevicePublic:
        return DevicePublic(
            id=device["id"],
            name=device["name"],
            platform=device["platform"],
            owner_id=device["owner_id"],
            status=device["status"],
            agent_id=device.get("agent_id"),
            executor_enabled=bool(device.get("executor_enabled", False)),
            executor_last_seen=device.get("executor_last_seen"),
            last_seen=device.get("last_seen"),
            created_at=device["created_at"],
            meshcentral_node_id=device.get("meshcentral_node_id"),
            meshcentral_mesh_id=device.get("meshcentral_mesh_id"),
        )


    # ------------------------------------------------------------
    # Health
    # ------------------------------------------------------------

    @app.get("/health")
    def health():
        return {
            "status": "ok",
            "service": "remote-device-registry",
        }


    # ------------------------------------------------------------
    # Existing device management
    # ------------------------------------------------------------

    @app.get("/api/devices", response_model=list[DevicePublic])
    def devices():
        with LOCK:
            return [
                public_device(device)
                for device in load_devices()
            ]


    @app.post("/api/devices", response_model=DeviceCreated)
    def create_device(req: DeviceCreate):
        with LOCK:
            items = load_devices()

            now = datetime.now(timezone.utc).isoformat()
            device_id = secrets.token_urlsafe(18)
            token = secrets.token_urlsafe(32)

            device = Device(
                id=device_id,
                name=req.name,
                platform=req.platform,
                owner_id=req.owner_id,
                status="pending",
                enrollment_token=token,
                created_at=now,
            )

            items.append(device.model_dump())
            save_devices(items)

            public = public_device(device.model_dump())

            return DeviceCreated(
                **public.model_dump(),
                enrollment_token=token,
            )


    @app.post(
        "/api/devices/{device_id}/meshcentral-link",
        response_model=DevicePublic,
    )
    def link_meshcentral(
        device_id: str,
        req: MeshCentralLink,
        request: Request,
    ):
        authenticate_control(request)

        with LOCK:
            devices = load_devices()

            for device in devices:
                if device["id"] != device_id:
                    continue

                device["meshcentral_node_id"] = req.meshcentral_node_id
                device["meshcentral_mesh_id"] = req.meshcentral_mesh_id
                save_devices(devices)

                return public_device(device)

        raise HTTPException(
            status_code=404,
            detail="device not found",
        )


    @app.delete("/api/devices/{device_id}")
    def delete_device(device_id: str):
        with LOCK:
            items = load_devices()

            new_items = [
                x for x in items
                if x["id"] != device_id
            ]

            if len(new_items) == len(items):
                raise HTTPException(
                    status_code=404,
                    detail="device not found",
                )

            save_devices(new_items)

        return {"ok": True}


    # ------------------------------------------------------------
    # Secure executor enrollment
    # ------------------------------------------------------------

    @app.post("/api/devices/{device_id}/executor-enroll")
    def executor_enroll(
        device_id: str,
        req: ExecutorEnroll,
    ):
        with LOCK:
            devices = load_devices()

            for device in devices:
                if device["id"] != device_id:
                    continue

                token = device.get("enrollment_token")

                if not token:
                    raise HTTPException(
                        status_code=409,
                        detail="enrollment token unavailable",
                    )

                if not hmac.compare_digest(
                    token,
                    req.enrollment_token,
                ):
                    raise HTTPException(
                        status_code=401,
                        detail="invalid enrollment token",
                    )

                # Enrollment token is one-time.
                device["enrollment_token"] = None

                agent_id = "agent-" + uuid.uuid4().hex

                raw_secret = secrets.token_bytes(32)
                secret_b64 = base64.b64encode(
                    raw_secret
                ).decode()

                secret_hash = hashlib.sha256(
                    raw_secret
                ).hexdigest()

                # The executor secret is never stored in plaintext.
                # The HMAC verification key is a separate SHA-256
                # derived key so the registry can authenticate without
                # retaining the bootstrap secret.
                auth_key = hashlib.sha256(
                    b"shopnoltd-executor-hmac-v1:" + raw_secret
                ).digest()

                device["agent_id"] = agent_id
                device["executor_enabled"] = True
                device["executor_secret_hash"] = secret_hash
                device["executor_auth_secret_hash"] = auth_key.hex()
                device["executor_last_seen"] = (
                    datetime.now(timezone.utc).isoformat()
                )
                device["status"] = "online"
                device["last_seen"] = (
                    datetime.now(timezone.utc).isoformat()
                )
                device["platform"] = req.platform

                save_devices(devices)

                return {
                    "ok": True,
                    "device_id": device_id,
                    "agent_id": agent_id,
                    "secret": secret_b64,
                    "gateway_version": "3.0",
                }

        raise HTTPException(
            status_code=404,
            detail="device not found",
        )


    # ------------------------------------------------------------
    # Executor authentication
    # ------------------------------------------------------------

    def authenticate_executor(
        device_id: str,
        agent_id: str,
        timestamp: str,
        nonce: str,
        signature: str,
        method: str,
        path: str,
        body: bytes,
    ):
        try:
            ts = int(timestamp)
        except Exception:
            raise HTTPException(
                status_code=401,
                detail="invalid timestamp",
            )

        # Five-minute replay window.
        if abs(int(time.time()) - ts) > 300:
            raise HTTPException(
                status_code=401,
                detail="timestamp outside allowed window",
            )

        if len(nonce) < 16 or len(nonce) > 128:
            raise HTTPException(
                status_code=401,
                detail="invalid nonce",
            )

        with LOCK:
            devices = load_devices()

            device = next(
                (
                    d for d in devices
                    if d["id"] == device_id
                    and d.get("agent_id") == agent_id
                    and d.get("executor_enabled") is True
                ),
                None,
            )

            if not device:
                raise HTTPException(
                    status_code=401,
                    detail="executor not authorized",
                )

            secret_hash = device.get(
                "executor_secret_hash"
            )

            if not secret_hash:
                raise HTTPException(
                    status_code=401,
                    detail="executor secret unavailable",
                )

            # Reconstruct the HMAC key only through a
            # verification strategy based on the stored hash.
            #
            # We cannot recover the original secret from SHA-256,
            # so the registry stores a derived verification value
            # and receives a signature generated from the secret.
            #
            # This endpoint therefore uses a second deterministic
            # verification secret derived during enrollment.
            #
            # For compatibility, executor_auth_secret_hash is
            # checked below.
            auth_hash = device.get("executor_auth_secret_hash")

            if not auth_hash:
                raise HTTPException(
                    status_code=401,
                    detail="executor authentication not initialized",
                )

            key = bytes.fromhex(auth_hash)

            message = "\n".join(
                [
                    timestamp,
                    nonce,
                    method.upper(),
                    path,
                    body.decode("utf-8"),
                ]
            ).encode()

            expected = hmac.new(
                key,
                message,
                hashlib.sha256,
            ).hexdigest()

            if not hmac.compare_digest(
                expected,
                signature,
            ):
                raise HTTPException(
                    status_code=401,
                    detail="invalid executor signature",
                )

            nonces = load_nonces()
            now = int(time.time())

            # Remove nonces older than ten minutes.
            nonces = {
                k: v
                for k, v in nonces.items()
                if now - int(v) <= 600
            }

            nonce_key = f"{device_id}:{nonce}"

            if nonce_key in nonces:
                raise HTTPException(
                    status_code=401,
                    detail="replayed nonce",
                )

            nonces[nonce_key] = now

            # Hard bound replay cache.
            if len(nonces) > 10000:
                oldest = sorted(
                    nonces.items(),
                    key=lambda x: int(x[1]),
                )[:2000]

                for key_name, _ in oldest:
                    nonces.pop(key_name, None)

            save_nonces(nonces)

            return device


    # ------------------------------------------------------------
    # Authenticated heartbeat
    # ------------------------------------------------------------

    @app.post("/api/executor/heartbeat/{device_id}")
    async def executor_heartbeat(
        device_id: str,
        request: Request,
        req: ExecutorHeartbeat,
    ):
        body = await request.body()

        device = authenticate_executor(
            device_id,
            req.agent_id,
            request.headers.get(
                "X-Shopnoltd-Timestamp",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Nonce",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Signature",
                "",
            ),
            request.method,
            request.url.path,
            body,
        )

        with LOCK:
            devices = load_devices()

            for item in devices:
                if item["id"] == device["id"]:
                    now = datetime.now(
                        timezone.utc
                    ).isoformat()

                    item["status"] = "online"
                    item["last_seen"] = now
                    item["executor_last_seen"] = now
                    item["platform"] = req.platform
                    save_devices(devices)
                    break

        return {
            "ok": True,
            "device_id": device_id,
        }


    # ------------------------------------------------------------
    # Authenticated job polling
    # ------------------------------------------------------------

    @app.get("/api/executor/jobs/{device_id}")
    async def executor_jobs(
        device_id: str,
        request: Request,
    ):
        body = await request.body()

        agent_id = request.headers.get(
            "X-Shopnoltd-Agent",
            "",
        )

        authenticate_executor(
            device_id,
            agent_id,
            request.headers.get(
                "X-Shopnoltd-Timestamp",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Nonce",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Signature",
                "",
            ),
            request.method,
            request.url.path,
            body,
        )

        with LOCK:
            jobs = load_jobs()

            available = [
                j for j in jobs
                if j["device_id"] == device_id
                and j["status"] == "queued"
            ]

            if not available:
                return {"jobs": []}

            job = available[0]
            job["status"] = "running"
            job["started_at"] = (
                datetime.now(timezone.utc).isoformat()
            )

            save_jobs(jobs)

            return {
                "jobs": [
                    {
                        "id": job["id"],
                        "device_id": job["device_id"],
                        "operation": job["operation"],
                        "created_at": job["created_at"],
                    }
                ]
            }


    # ------------------------------------------------------------
    # Authenticated result submission
    # ------------------------------------------------------------

    @app.post("/api/executor/jobs/{job_id}/result")
    async def executor_job_result(
        job_id: str,
        request: Request,
        req: JobResult,
    ):
        body = await request.body()

        device_id = request.headers.get(
            "X-Shopnoltd-Device",
            "",
        )

        agent_id = request.headers.get(
            "X-Shopnoltd-Agent",
            "",
        )

        authenticate_executor(
            device_id,
            agent_id,
            request.headers.get(
                "X-Shopnoltd-Timestamp",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Nonce",
                "",
            ),
            request.headers.get(
                "X-Shopnoltd-Signature",
                "",
            ),
            request.method,
            request.url.path,
            body,
        )

        with LOCK:
            jobs = load_jobs()

            for job in jobs:
                if (
                    job["id"] == job_id
                    and job["device_id"] == device_id
                    and job["status"] == "running"
                ):
                    job["status"] = "completed"
                    job["completed_at"] = (
                        datetime.now(
                            timezone.utc
                        ).isoformat()
                    )
                    job["result"] = req.model_dump()

                    save_jobs(jobs)

                    return {"ok": True}

        raise HTTPException(
            status_code=404,
            detail="job not found or not running",
        )


    def authenticate_control(request: Request):
        expected = os.getenv("REGISTRY_CONTROL_TOKEN", "")

        if not expected:
            raise HTTPException(
                status_code=503,
                detail="control authentication is not configured",
            )

        supplied = request.headers.get(
            "X-Shopnoltd-Control-Token",
            "",
        )

        if not supplied or not hmac.compare_digest(
            supplied,
            expected,
        ):
            raise HTTPException(
                status_code=401,
                detail="invalid control authentication",
            )


    # ------------------------------------------------------------
    # Internal control-plane job creation
    # ------------------------------------------------------------

    @app.post("/api/control/jobs")
    async def create_job(
        req: JobCreate,
        request: Request,
    ):
        authenticate_control(request)
        allowed = {
            "system.info",
            "windows.info",
            "wsl.info",
            "k3s.info",
            "k8s.pods",
            "k8s.services",
            "git.status",
            "shopnoltd.health",
            "disk.status",
            "memory.status",
            "remote-device.status",
        }

        if req.operation not in allowed:
            raise HTTPException(
                status_code=400,
                detail="operation not allowed",
            )

        with LOCK:
            devices = load_devices()

            device = next(
                (
                    d for d in devices
                    if d["id"] == req.device_id
                    and d.get("executor_enabled") is True
                ),
                None,
            )

            if not device:
                raise HTTPException(
                    status_code=404,
                    detail="executor device not found",
                )

            jobs = load_jobs()

            job = {
                "id": "job-" + uuid.uuid4().hex,
                "device_id": req.device_id,
                "operation": req.operation,
                "status": "queued",
                "created_at": (
                    datetime.now(
                        timezone.utc
                    ).isoformat()
                ),
                "started_at": None,
                "completed_at": None,
                "result": None,
                "created_by": getattr(req, "created_by", None),
            }

            jobs.append(job)

            # Bound historical queue storage.
            if len(jobs) > 5000:
                jobs = jobs[-5000:]

            save_jobs(jobs)

            return {
                "ok": True,
                "job_id": job["id"],
                "device_id": job["device_id"],
                "operation": job["operation"],
                "status": job["status"],
            }


    @app.get("/api/control/jobs/{job_id}")
    def get_job(
        job_id: str,
        request: Request,
    ):
        authenticate_control(request)
        with LOCK:
            jobs = load_jobs()

            for job in jobs:
                if job["id"] == job_id:
                    return job

        raise HTTPException(
            status_code=404,
            detail="job not found",
        )
kind: ConfigMap
metadata:
  name: remote-device-registry-source
  namespace: shopno-tools
---
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Shopnoltd Remote Devices</title>
      <style>
        body {
          margin:0;
          font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          background:#f5f7fa;
          color:#172033;
        }
        header {
          padding:24px 32px;
          background:#111827;
          color:white;
        }
        main {
          max-width:1100px;
          margin:30px auto;
          padding:0 20px;
        }
        .toolbar {
          display:flex;
          gap:10px;
          margin-bottom:20px;
        }
        input,select,button {
          padding:11px 13px;
          border:1px solid #ccd3df;
          border-radius:8px;
          font-size:14px;
        }
        button {
          cursor:pointer;
          background:#111827;
          color:white;
          border:0;
        }
        .grid {
          display:grid;
          grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
          gap:18px;
        }
        .card {
          background:white;
          border-radius:12px;
          padding:20px;
          box-shadow:0 3px 15px rgba(0,0,0,.08);
        }
        .status {
          display:inline-block;
          padding:4px 9px;
          border-radius:20px;
          background:#e5e7eb;
          font-size:12px;
        }
        .online { background:#dcfce7; }
        .pending { background:#fef3c7; }
        .offline { background:#fee2e2; }
        .danger {
          background:#b91c1c;
          margin-left:6px;
        }
        .token-panel {
          margin-bottom:20px;
        }
        .token-actions {
          display:flex;
          align-items:center;
          gap:10px;
          margin-top:12px;
          flex-wrap:wrap;
        }
        .copy-status {
          font-size:13px;
          color:#166534;
          font-weight:600;
        }
        .token {
          margin-top:12px;
          padding:10px;
          background:#f3f4f6;
          font-family:monospace;
          font-size:11px;
          word-break:break-all;
          border-radius:8px;
        }
      </style>
    </head>
    <body>

    <header>
      <h1>Shopnoltd Remote Devices</h1>
      <div>Add a device, enroll its agent, then connect from any browser.</div>
    </header>

    <main>
      <div class="toolbar">
        <input id="name" placeholder="Device name">
        <select id="platform">
          <option value="windows">Windows</option>
          <option value="linux">Linux</option>
          <option value="macos">macOS</option>
          <option value="android">Android</option>
          <option value="other">Other</option>
        </select>
        <button onclick="addDevice()">Add device</button>
      </div>

      <div id="enrollment-result"></div>

      <div id="devices" class="grid"></div>
    </main>

    <script>
    const KEYCLOAK_URL = "https://auth.shopnoltd.dpdns.org";
    const KEYCLOAK_REALM = "shopnoltd";
    const KEYCLOAK_CLIENT_ID = "shopnoltd-web";
    const REDIRECT_URI = window.location.origin + "/";

    function base64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function randomString(len = 64) {
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return base64url(arr).slice(0, len);
    }

    async function codeChallengeFor(verifier) {
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return base64url(digest);
    }

    function getToken() {
      return localStorage.getItem("shopno_token") || "";
    }

    function clearToken() {
      localStorage.removeItem("shopno_token");
      localStorage.removeItem("shopno_refresh_token");
    }

    function showLogin(message = "Sign in with your Shopnoltd administrator account.") {
      const root = document.getElementById("devices");

      root.innerHTML = `
        <div class="card">
          <h2>Authentication required</h2>
          <p>${escapeHtml(message)}</p>
          <button onclick="startLogin()">Sign in to Shopnoltd</button>
        </div>
      `;
    }

    async function startLogin() {
      const verifier = randomString(64);
      const challenge = await codeChallengeFor(verifier);
      const state = randomString(32);

      sessionStorage.setItem("device_pkce_verifier", verifier);
      sessionStorage.setItem("device_oidc_state", state);

      const params = new URLSearchParams({
        client_id: KEYCLOAK_CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: "code",
        scope: "openid profile email",
        state,
        code_challenge: challenge,
        code_challenge_method: "S256"
      });

      window.location.assign(
        `${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth?${params.toString()}`
      );
    }

    async function completeLogin() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const returnedState = params.get("state");
      const oauthError = params.get("error");
      const oauthErrorDescription = params.get("error_description");

      if (oauthError) {
        throw new Error(oauthErrorDescription || oauthError);
      }

      if (!code) {
        return false;
      }

      const verifier = sessionStorage.getItem("device_pkce_verifier");
      const expectedState = sessionStorage.getItem("device_oidc_state");

      if (!verifier) {
        throw new Error("Missing authentication verifier. Please sign in again.");
      }

      if (!expectedState || returnedState !== expectedState) {
        sessionStorage.removeItem("device_pkce_verifier");
        sessionStorage.removeItem("device_oidc_state");
        throw new Error("Authentication state validation failed. Please sign in again.");
      }

      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: KEYCLOAK_CLIENT_ID,
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch(
        `${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body
        }
      );

      const data = await response.json().catch(() => ({}));

      sessionStorage.removeItem("device_pkce_verifier");
      sessionStorage.removeItem("device_oidc_state");

      if (!response.ok || !data.access_token) {
        throw new Error(
          data.error_description ||
          data.error ||
          "Authentication failed."
        );
      }

      localStorage.setItem("shopno_token", data.access_token);

      if (data.refresh_token) {
        localStorage.setItem("shopno_refresh_token", data.refresh_token);
      }

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      return true;
    }

    async function apiFetch(path, options = {}) {
      const token = getToken();

      if (!token) {
        showLogin();
        throw new Error("Authentication required.");
      }

      const headers = {
        Accept: "application/json",
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`
      };

      const response = await fetch(path, {
        ...options,
        headers
      });

      if (response.status === 401) {
        clearToken();
        showLogin("Your Shopnoltd session has expired. Please sign in again.");
        throw new Error("Authentication expired.");
      }

      if (response.status === 403) {
        throw new Error(
          "Administrator permission is required for the device console."
        );
      }

      if (!response.ok) {
        const body = await response.text();
        let detail = "";

        try {
          const parsed = JSON.parse(body);
          detail = parsed.detail || parsed.message || "";
        } catch (_) {
          detail = body;
        }

        throw new Error(
          detail || `Request failed with HTTP ${response.status}.`
        );
      }

      return response;
    }

    async function loadDevices() {
      if (!getToken()) {
        showLogin();
        return;
      }

      try {
        const r = await apiFetch("/api/devices");
        const devices = await r.json();

        const root = document.getElementById("devices");
        root.innerHTML = "";

        if (!Array.isArray(devices) || devices.length === 0) {
          root.innerHTML = `
            <div class="card">
              <h2>No registered devices</h2>
              <p>Add a device to begin managing authorized remote sessions.</p>
            </div>
          `;
          return;
        }

        for (const d of devices) {
          const card = document.createElement("div");
          card.className = "card";

          const meshLinked = !!d.meshcentral_node_id;

          card.innerHTML = `
            <h2>${escapeHtml(d.name)}</h2>
            <p>${escapeHtml(d.platform)}</p>
            <span class="status ${escapeHtml(d.status)}">${escapeHtml(d.status)}</span>
            <p><small>ID: ${escapeHtml(d.id)}</small></p>

            ${
              d.status === "pending"
              ? `<p><small>Waiting for the authorized remote agent to enroll.</small></p>`
              : ""
            }

            ${
              d.status === "online" && meshLinked
              ? `<button onclick="connectDevice('${encodeURIComponent(d.id)}')">
                   Connect
                 </button>`
              : ""
            }

            ${
              d.status === "online" && !meshLinked
              ? `<p><small>Device is online, but its MeshCentral link is not configured.</small></p>`
              : ""
            }

            <button class="danger"
                    onclick="deleteDevice('${encodeURIComponent(d.id)}')">
              Delete
            </button>
          `;

          root.appendChild(card);
        }
      } catch (err) {
        if (err.message === "Authentication expired." ||
            err.message === "Authentication required.") {
          return;
        }

        const root = document.getElementById("devices");
        root.innerHTML = `
          <div class="card">
            <h2>Device service unavailable</h2>
            <p>${escapeHtml(err.message)}</p>
            <button onclick="loadDevices()">Retry</button>
          </div>
        `;
      }
    }

    async function addDevice() {
      const name = document.getElementById("name").value.trim();
      const platform = document.getElementById("platform").value;

      if (!name) {
        alert("Enter a device name");
        return;
      }

      try {
        const response = await apiFetch("/api/devices", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            platform
          })
        });

        const created = await response.json();

        document.getElementById("name").value = "";

        if (created.enrollment_token) {
          showEnrollmentToken(created.enrollment_token);
        }

        await loadDevices();
      } catch (err) {
        if (err.message !== "Authentication expired." &&
            err.message !== "Authentication required.") {
          alert(err.message);
        }
      }
    }

    function showEnrollmentToken(token) {
      const root = document.getElementById("enrollment-result");

      root.innerHTML = `
        <div class="card token-panel">
          <h2>Device created successfully</h2>
          <p>
            Copy the enrollment token below and use it to enroll the
            authorized remote agent on this device.
          </p>

          <div class="token" id="enrollment-token-value">${escapeHtml(token)}</div>

          <div class="token-actions">
            <button type="button" onclick="copyEnrollmentToken()">
              Copy token
            </button>
            <span id="copy-status" class="copy-status" aria-live="polite"></span>
          </div>

          <p>
            <small>
              Store this token securely. It is not displayed in the device list.
            </small>
          </p>
        </div>
      `;
    }

    async function copyEnrollmentToken() {
      const tokenElement = document.getElementById("enrollment-token-value");
      const status = document.getElementById("copy-status");

      if (!tokenElement || !status) {
        return;
      }

      const token = tokenElement.textContent || "";

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(token);
        } else {
          const selection = window.getSelection();
          const range = document.createRange();

          range.selectNodeContents(tokenElement);
          selection.removeAllRanges();
          selection.addRange(range);

          const copied = document.execCommand("copy");

          selection.removeAllRanges();

          if (!copied) {
            throw new Error("Clipboard copy was blocked.");
          }
        }

        status.textContent = "Copied!";
      } catch (err) {
        status.textContent = "Copy failed — select the token manually.";
      }
    }

    async function deleteDevice(id) {
      if (!confirm("Delete this device?")) return;

      try {
        await apiFetch("/api/devices/" + id, {
          method: "DELETE"
        });

        await loadDevices();
      } catch (err) {
        if (err.message !== "Authentication expired." &&
            err.message !== "Authentication required.") {
          alert(err.message);
        }
      }
    }

    async function connectDevice(id) {
      const popup = window.open(
        "about:blank",
        "_blank",
        "noopener,noreferrer"
      );

      try {
        const response = await apiFetch(
          "/api/connect/" + id
        );

        const data = await response.json();

        if (!data.connect_url) {
          throw new Error("Gateway did not return a MeshCentral connection URL.");
        }

        if (popup) {
          popup.location.href = data.connect_url;
        } else {
          window.location.assign(data.connect_url);
        }
      } catch (err) {
        if (popup) {
          popup.close();
        }

        if (err.message !== "Authentication expired." &&
            err.message !== "Authentication required.") {
          alert(err.message);
        }
      }
    }

    function logout() {
      clearToken();
      showLogin("You have been signed out of the device console.");
    }

    function escapeHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function initialize() {
      try {
        const loggedIn = await completeLogin();

        if (loggedIn) {
          await loadDevices();
          return;
        }

        if (!getToken()) {
          showLogin();
          return;
        }

        await loadDevices();
      } catch (err) {
        clearToken();

        const root = document.getElementById("devices");
        root.innerHTML = `
          <div class="card">
            <h2>Authentication failed</h2>
            <p>${escapeHtml(err.message)}</p>
            <button onclick="startLogin()">Sign in again</button>
          </div>
        `;
      }
    }

    initialize();
    setInterval(loadDevices, 10000);
    </script>

    </body>
    </html>
