kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    app.kubernetes.io/name: billing-engine
    app.kubernetes.io/part-of: shopnoltd
  name: billing-engine
  namespace: shopno-payments
spec:
  ingressClassName: nginx
  rules:
  - host: billing-engine.shopnoltd.dpdns.org
    http:
      paths:
      - backend:
          service:
            name: billing-engine
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - billing-engine.shopnoltd.dpdns.org
    secretName: billing-engine-tls
---
