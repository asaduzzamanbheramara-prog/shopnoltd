apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-device-registry
  namespace: shopno-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-device-registry
  template:
    metadata:
      labels:
        app: remote-device-registry
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir fastapi==0.116.1 uvicorn[standard]==0.35.0 pydantic==2.11.7 &&
          uvicorn app:app --host 0.0.0.0 --port 8080
        env:
        - name: DATA_DIR
          value: /data
        - name: REGISTRY_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              key: control-token
              name: remote-device-control-secret
              optional: false
        image: python:3.12-slim
        name: registry
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 96Mi
        volumeMounts:
        - mountPath: /app
          name: source
        - mountPath: /data
          name: data
        workingDir: /app
      volumes:
      - configMap:
          name: remote-device-registry-source
        name: source
      - name: data
        persistentVolumeClaim:
          claimName: remote-device-registry
