          initialDelaySeconds: 60
          periodSeconds: 20
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        name: kobotoolbox
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 10
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            ephemeral-storage: 2Gi
            memory: 2Gi
          requests:
            cpu: 100m
            ephemeral-storage: 512Mi
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - SETUID
            - SETGID
            drop:
            - ALL
          readOnlyRootFilesystem: false
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 20
          periodSeconds: 10
          tcpSocket:
            port: 8000
        volumeMounts:
