apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: remote-device-gateway
    app.kubernetes.io/part-of: shopnoltd
  name: remote-device-gateway
  namespace: shopno-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-device-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-device-gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: REGISTRY_URL
          value: http://remote-device-registry.shopno-tools.svc.cluster.local:8080
        - name: MESH_URL
          value: https://remote-engine.shopnoltd.dpdns.org
        - name: KEYCLOAK_ISSUER
          value: https://auth.shopnoltd.dpdns.org/realms/shopnoltd
        - name: KEYCLOAK_AUDIENCE
          value: account
        - name: REGISTRY_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              key: control-token
              name: remote-device-control-secret
              optional: false
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-remote-device-gateway:b978c44d485b3af118380bd6aeb5a361af9c0d7b
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        name: remote-device-gateway
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      imagePullSecrets:
      - name: ghcr-pull-secret
