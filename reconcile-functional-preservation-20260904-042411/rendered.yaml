apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcentral
  namespace: shopno-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshcentral
  template:
    metadata:
      labels:
        app: meshcentral
    spec:
      containers:
      - env:
        - name: HOSTNAME
          value: remote.shopnoltd.dpdns.org
        image: ghcr.io/ylianst/meshcentral:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 20
          tcpSocket:
            port: https
        name: meshcentral
        ports:
        - containerPort: 443
          name: https
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 10
          tcpSocket:
            port: https
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        - mountPath: /opt/meshcentral/meshcentral-data
          name: data
        - mountPath: /opt/meshcentral/meshcentral-files
          name: files
      initContainers:
      - command:
        - node
        - /config-init/patch-config.js
        image: ghcr.io/ylianst/meshcentral:latest
        imagePullPolicy: IfNotPresent
        name: normalize-config
        volumeMounts:
        - mountPath: /opt/meshcentral/meshcentral-data
          name: data
        - mountPath: /config-init
          name: config-init
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: meshcentral-data
      - emptyDir: {}
        name: files
      - configMap:
          name: meshcentral-config-init
        name: config-init
