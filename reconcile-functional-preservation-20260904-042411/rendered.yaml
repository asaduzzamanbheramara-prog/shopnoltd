apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: litellm-proxy
  name: litellm-proxy
  namespace: shopno-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      containers:
      - args:
        - --config
        - /app/config.yaml
        - --port
        - "4000"
        envFrom:
        - secretRef:
            name: litellm-provider-keys
        image: ghcr.io/berriai/litellm:main-latest
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 3
        name: litellm
        ports:
        - containerPort: 4000
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 384Mi
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /app/config.yaml
          name: config
          subPath: config.yaml
      volumes:
      - configMap:
          name: litellm-config
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/part-of: shopnoltd
  name: chatwoot
  namespace: shopno-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/name: chatwoot
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - exec bundle exec rails s -p 3000 -b 0.0.0.0
        command:
        - /bin/sh
        - -lc
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: secret-key-base
              name: chatwoot-secret
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: chatwoot-config
        - secretRef:
            name: chatwoot-secret
        image: chatwoot/chatwoot:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        name: chatwoot
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 256Mi
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /api
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/chatwoot
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/tmp
          name: app-tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: chatwoot
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: chatwoot
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chatwoot-data
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: app-tmp
---
