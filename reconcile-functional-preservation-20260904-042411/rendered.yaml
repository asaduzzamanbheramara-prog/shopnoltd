          name: data
        - mountPath: /srv/src/kpi/media
          name: data
          subPath: media
        - mountPath: /srv/src/kobocat/media
          name: data
          subPath: kobocat-media
        - mountPath: /tmp
          name: tmp
        - mountPath: /srv/logs
          name: logs
        - mountPath: /srv/src/kpi/docker/uwsgi.ini
          name: uwsgi-ini-override
          subPath: kpi-uwsgi.ini
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kobotoolbox
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: kobotoolbox
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kobotoolbox-data
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: logs
      - configMap:
