apiVersion: v1
kind: Secret
metadata:
  name: shopnoltd-secrets
  namespace: default
type: Opaque
data:
  # These are base64 encoded values - replace with your actual base64 encoded secrets
  TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
  RECAPTCHA_SECRET_KEY: "${RECAPTCHA_SECRET_KEY}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
