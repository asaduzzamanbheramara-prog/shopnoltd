server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
  location = /sw.js { return 404; }

  # Public editorial reads only. Reject every write method at the proxy boundary.
  location = /api/v2/blog {
    limit_except GET HEAD { deny all; }
    proxy_pass https://api.shopnoltd.dpdns.org/api/v2/blog;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_set_header Host api.shopnoltd.dpdns.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
  }
  location ^~ /api/v2/blog/ {
    limit_except GET HEAD { deny all; }
    proxy_pass https://api.shopnoltd.dpdns.org;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_set_header Host api.shopnoltd.dpdns.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
  }

  location ^~ /blog/ { try_files $uri /index.html; }
  location / { try_files $uri $uri/ =404; }
}
