client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
  location = /readyz { return 200 "ok"; add_header Content-Type text/plain; }

  # Stable ShopnoltdCollect URL. The separate Android project publishes the
  # current installable QA/release asset at this fixed GitHub release tag.
  location = /downloads/ShopnoltdCollect.apk {
    return 302 https://github.com/asaduzzamanbheramara-prog/shopnoltd-collect-android/releases/download/shopnoltdcollect-latest/ShopnoltdCollect.apk;
  }

  # Stable Shopnoltd mobile-shell URLs. The root Android workflow publishes
  # the current QA assets at this fixed GitHub release tag.
  location = /downloads/Shopnoltd.apk {
    return 302 https://github.com/asaduzzamanbheramara-prog/shopnoltd/releases/download/shopnoltd-mobile-latest/Shopnoltd.apk;
  }

  location = /downloads/Shopnoltd-Admin.apk {
    return 302 https://github.com/asaduzzamanbheramara-prog/shopnoltd/releases/download/shopnoltd-mobile-latest/Shopnoltd-Admin.apk;
  }

  location /downloads/ {
    add_header Content-Disposition "attachment";
    autoindex on;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
