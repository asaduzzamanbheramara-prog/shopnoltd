# Standalone Nginx config for the Realme/Termux static-site origin.
# Keep the origin loopback-only; expose it only through an authenticated outbound tunnel.
worker_processes 1;
pid /data/data/com.termux/files/home/.local/state/shopnoltd-nginx/nginx.pid;
error_log /data/data/com.termux/files/home/.local/state/shopnoltd-nginx/error.log warn;

events {
  worker_connections 128;
}

http {
  include /data/data/com.termux/files/usr/etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /data/data/com.termux/files/home/.local/state/shopnoltd-nginx/access.log;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /data/data/com.termux/files/home/www/shopnoltd/current;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    location ~* \\.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
