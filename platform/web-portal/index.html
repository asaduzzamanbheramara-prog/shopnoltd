<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shopnoltd</title>
  <meta
    name="description"
    content="Shopnoltd — All-in-one platform for surveys, chat, meetings, live streaming, cloud storage, and payments."
  />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      margin: 0;
      min-width: 0;
      min-height: 100%;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    img,
    video,
    svg,
    canvas {
      max-width: 100%;
      height: auto;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      max-width: 100%;
    }

    a {
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      body {
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
