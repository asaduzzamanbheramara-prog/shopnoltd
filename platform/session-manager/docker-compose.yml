version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: session_manager
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  session-manager:
    build:
      context: ../..
      dockerfile: platform/session-manager/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      SESSION_MANAGER_ENCRYPTION_KEY: "${SESSION_MANAGER_ENCRYPTION_KEY:?Set SESSION_MANAGER_ENCRYPTION_KEY}"
      PROFILE_STORAGE_ROOT: /data
    ports:
      - "8000:8000"
      - "6080:6080"   # noVNC, once wired up
    volumes:
      - profile_data:/data
    shm_size: "1gb"    # Chromium needs this or it crashes under docker

volumes:
  pgdata:
  profile_data:
