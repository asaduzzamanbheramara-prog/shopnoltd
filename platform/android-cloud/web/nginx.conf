worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  # Resolve Kubernetes Service DNS at request time. Static upstream hostnames
  # make nginx fail to start when the controller Service is briefly absent
  # during rollout or DNS propagation.
  resolver 10.43.0.10 valid=10s ipv6=off;

  client_max_body_size 110m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $android_cloud_controller "android-cloud-controller.shopno-platform.svc.cluster.local:8080";

    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location /api/ {
      proxy_pass http://$android_cloud_controller;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
    }

    location ^~ /android-cloud/api/ {
      rewrite ^/android-cloud/(.*)$ /$1 break;
      proxy_pass http://$android_cloud_controller;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
    }

    location ^~ /android-cloud/ {
      rewrite ^/android-cloud/(.*)$ /$1 break;
      try_files $uri $uri/ /index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
