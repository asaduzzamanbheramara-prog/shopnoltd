server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /software-os-center {
        return 302 https://shopnoltd.dpdns.org/software-os-center.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
