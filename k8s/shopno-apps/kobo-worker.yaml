apiVersion: v1
kind: ServiceAccount
metadata:
  name: kobotoolbox-worker
  namespace: shopno-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kobotoolbox-worker
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: kobotoolbox
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kobotoolbox
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kobotoolbox
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: kobotoolbox-worker
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-kpi:sha-7ef4f470ae55378c064389ec6671dfc04b6aabca
        imagePullPolicy: Always
        command: ["/bin/bash", "-lc"]
        args:
          - |
            cd /srv/src/kpi && \
            /opt/venv/bin/celery -A kobo worker -l info
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PUBLIC_DOMAIN_NAME
          value: "shopnoltd.dpdns.org"
        - name: KOBOFORM_URL
          value: "https://kobo.shopnoltd.dpdns.org"
        - name: KOBOCAT_URL
          value: "https://kobotoolbox.shopnoltd.dpdns.org"
        envFrom:
        - configMapRef:
            name: kobotoolbox-config
        - secretRef:
            name: kobotoolbox-secret
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
