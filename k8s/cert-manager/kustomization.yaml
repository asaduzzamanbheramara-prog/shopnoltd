apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pin the upstream release; cert-manager CRDs and controllers are installed
# together, then the ClusterIssuer is reconciled by cert-manager.
resources:
- https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
- letsencrypt-prod-issuer.yaml
