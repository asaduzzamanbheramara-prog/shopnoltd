apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnoltd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/asaduzzamanbheramara-prog/shopnoltd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  ignoreDifferences:
    - group: ""
      kind: Secret
      name: litellm-provider-keys
      namespace: shopno-ai
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

