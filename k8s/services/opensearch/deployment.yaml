apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: shopno-data
  labels:
    app.kubernetes.io/name: opensearch

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch

  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: opensearch
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP

          envFrom:
            - configMapRef:
                name: opensearch-config
            - secretRef:
                name: opensearch-secret

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              cpu: "250m"
              memory: "1536Mi"
              ephemeral-storage: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"
              ephemeral-storage: "1Gi"

          startupProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30


          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http

            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5


          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5


          volumeMounts:
            - name: data
              mountPath: /var/lib/opensearch

            - name: tmp
              mountPath: /tmp


          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL


      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opensearch-data

        - name: tmp
          emptyDir: {}


      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
