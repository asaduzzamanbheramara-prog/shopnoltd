apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-portal
  namespace: shopno-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web-portal.shopnoltd.dpdns.org
        - shopnoltd.dpdns.org
        - "*.shopnoltd.dpdns.org"
      secretName: shopno-wildcard-tls

  rules:
    - host: web-portal.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80

    - host: domain.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domain-service
                port:
                  number: 80

    - host: freedomain.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freedomain-service
                port:
                  number: 80

    - host: "*.shopnoltd.dpdns.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80

    - host: shopnoltd.dpdns.org
      http:
        paths:
          # Serve the Software & OS Center from its dedicated static web image.
          # Exact matches preserve all existing root and application path routing.
          - path: /software-os-center.html
            pathType: Exact
            backend:
              service:
                name: shopnoltd-web
                port:
                  number: 80

          - path: /catalogue.json
            pathType: Exact
            backend:
              service:
                name: shopnoltd-web
                port:
                  number: 80

          - path: /offline-recovery-guide.html
            pathType: Exact
            backend:
              service:
                name: shopnoltd-web
                port:
                  number: 80

          - path: /android-cloud
            pathType: Prefix
            backend:
              service:
                name: android-cloud-web
                port:
                  number: 8080

          - path: /download
            pathType: Prefix
            backend:
              service:
                name: android-portal
                port:
                  number: 80

          - path: /downloads
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80
