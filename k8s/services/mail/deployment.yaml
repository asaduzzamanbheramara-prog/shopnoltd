apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-service
  namespace: shopno-mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-service
  template:
    metadata:
      labels:
        app: mail-service
    spec:
      containers:
      - name: mail-service
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/mail-service:4e9f6d69b79b4e16cac28b2fb999ff9644dcfe89
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: mail-service-config
        - secretRef:
            name: mail-service-secret
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
