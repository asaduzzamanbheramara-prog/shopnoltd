apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-runtime-config
  namespace: shopno-monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: shopnoltd-webhook
    receivers:
      - name: shopnoltd-webhook
        webhook_configs:
          - url: http://notification-service.shopno-platform.svc.cluster.local/api/v1/notifications/alerts
            send_resolved: true
