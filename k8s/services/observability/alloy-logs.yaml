apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: shopno-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shopnoltd-alloy-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shopnoltd-alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shopnoltd-alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: shopno-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: shopno-monitoring
data:
  config.alloy: |
    logging {
      level = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.source.podlogs "pods" {
      forward_to = [loki.write.local.receiver]
      preserve_discovered_labels = true
      node_filter {
        enabled = true
      }
    }

    loki.source.kubernetes_events "cluster_events" {
      namespaces = ["kube-system", "shopno-platform", "shopno-apps", "shopno-data", "shopno-identity", "shopno-monitoring", "shopno-payments", "shopno-tools"]
      log_format = "logfmt"
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki.shopno-monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = {
        cluster = "shopnoltd",
        environment = "production",
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: shopno-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: shopnoltd-observability
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-logs-config
        - name: data
          emptyDir: {}
