apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-server
  namespace: shopno-mail
  labels:
    app: mail-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mail-server
  template:
    metadata:
      labels:
        app: mail-server
    spec:
      hostname: mail
      initContainers:
        - name: prepare-mail-storage
          image: docker.io/library/alpine:3.22.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /mail-data/data /mail-data/state /mail-data/log /mail-data/config
              chown -R 5000:5000 /mail-data/data
              chmod 0750 /mail-data/data /mail-data/state /mail-data/log /mail-data/config
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: mail-data
              mountPath: /mail-data
      containers:
        - name: mail-server
          image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0@sha256:c341669e6cbb012c34e8c4a86af27d6415bed485e0a2b66fb18c9ed60a4c4302
          imagePullPolicy: IfNotPresent
          hostname: mail
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: false
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - MKNOD
                - SETGID
                - SETUID
                - DAC_OVERRIDE
                - NET_ADMIN
          ports:
            - containerPort: 25
              name: smtp
              protocol: TCP
            - containerPort: 465
              name: smtps
              protocol: TCP
            - containerPort: 587
              name: submission
              protocol: TCP
            - containerPort: 993
              name: imaps
              protocol: TCP
          env:
            - name: OVERRIDE_HOSTNAME
              value: mail.shopnoltd.dpdns.org
            - name: POSTMASTER_ADDRESS
              value: admin@shopnoltd.dpdns.org
            - name: ONE_DIR
              value: "1"
            - name: ENABLE_IMAP
              value: "1"
            - name: ENABLE_POP3
              value: "0"
            - name: ENABLE_CLAMAV
              value: "0"
            - name: ENABLE_FAIL2BAN
              value: "1"
            - name: FAIL2BAN_BLOCKTYPE
              value: drop
            - name: PERMIT_DOCKER
              value: network
            - name: SPOOF_PROTECTION
              value: "1"
            - name: TLS_LEVEL
              value: modern
            - name: POSTFIX_INET_PROTOCOLS
              value: ipv4
            - name: SSL_TYPE
              value: manual
            - name: SSL_CERT_PATH
              value: /secrets/ssl/tls.crt
            - name: SSL_KEY_PATH
              value: /secrets/ssl/tls.key
            - name: ENABLE_UPDATE_CHECK
              value: "0"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 993
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: mail-data
              mountPath: /var/mail
              subPath: data
            - name: mail-data
              mountPath: /var/mail-state
              subPath: state
            - name: mail-data
              mountPath: /var/log/mail
              subPath: log
            - name: mail-data
              mountPath: /tmp/docker-mailserver
              subPath: config
            - name: mail-tls
              mountPath: /secrets/ssl
              readOnly: true
      volumes:
        - name: mail-data
          persistentVolumeClaim:
            claimName: mail-data
        - name: mail-tls
          secret:
            secretName: shopno-wildcard-tls
