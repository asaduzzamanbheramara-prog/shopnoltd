apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-data

resources:
- migrate-job.yaml

configMapGenerator:
- name: postgres-platform-migrations
  files:
  - 012-payment-schema-reconciliation.sql
  - 013-provision-comms-databases.sql
  - 014-provision-chatwoot-database.sql
  options:
    disableNameSuffixHash: true

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-11"

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: shopnoltd
