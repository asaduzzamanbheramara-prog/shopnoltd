apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-data
  namespace: shopno-data

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shopnoltd
    app.kubernetes.io/component: database

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi

  storageClassName: standard
  # Keep the existing PVC intact. Expand only after the live StorageClass
  # reports volume-expansion support and measured usage justifies it.
  # Next practical target: 20Gi or larger; never shrink/recreate this PVC.
  # storageClassName: standard  # Use standard for Docker Desktop/Minikube
