apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  namespace: shopno-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ad-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ad-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ad-service
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/ad-service:pending
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ad-service-secret
              key: database-url
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: ad-service-secret
              key: INTERNAL_API_KEY
        - name: PAYMENT_SERVICE_URL
          value: http://payment-service.shopno-payments.svc.cluster.local:80
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
