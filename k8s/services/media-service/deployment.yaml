apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: shopno-platform
  labels:
    app: media-service
    app.kubernetes.io/name: media-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media-service
  template:
    metadata:
      labels:
        app: media-service
        app.kubernetes.io/name: media-service
    spec:
      serviceAccountName: media-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-service
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/media-service:bootstrap
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: media-service-config
            - secretRef:
                name: media-service-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 1500m
              memory: 768Mi
              ephemeral-storage: 3Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthhz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDire:
            sizeLimit: 512Mi
