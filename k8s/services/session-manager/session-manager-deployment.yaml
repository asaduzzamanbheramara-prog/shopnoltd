apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  namespace: shopno-tools
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: session-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: session-manager
    spec:
      containers:
        - name: session-manager
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/session-manager:6b13aab405e81f9bf1c97497bd6d9f9aad2f97e6
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: session-manager-secrets
                  key: DATABASE_URL
            - name: SESSION_MANAGER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: session-manager-secrets
                  key: ENCRYPTION_KEY
          ports:
            - containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: session-manager-data
