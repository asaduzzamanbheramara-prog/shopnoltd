apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-cloud-web
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: android-cloud-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: android-cloud-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-cloud-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/android-cloud-web:654dc9fcefacb7fd5b09c8d2407d272128a7f124
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
