apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-cloud-controller
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: android-cloud-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: android-cloud-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-cloud-controller
    spec:
      serviceAccountName: android-cloud-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/android-cloud-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: android-cloud-controller-config
            - secretRef:
                name: api-service-secret
                optional: true
            - secretRef:
                name: android-cloud-turn-secret
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
