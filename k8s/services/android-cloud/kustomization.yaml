apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - web-deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: android-cloud-controller-config
    namespace: shopno-platform
    envs:
      - controller.env

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: shopnoltd
      app.kubernetes.io/component: android-cloud
