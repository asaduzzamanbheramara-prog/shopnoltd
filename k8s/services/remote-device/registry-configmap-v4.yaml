apiVersion: v1
kind: ConfigMap
metadata:
  name: remote-device-registry-source-v4
  namespace: shopno-tools
data:
  app.py: |
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Optional
    import base64
    import hashlib
    import hmac
    import ipaddress
    import json
    import os
    import secrets
    import socket
    import subprocess
    import threading
    import time
    import uuid
    from urllib.request import urlopen

    from fastapi import FastAPI, HTTPException, Request
    from pydantic import BaseModel, Field

    app = FastAPI(title="Shopnoltd Remote Device Registry")
    DATA_DIR = Path(os.getenv("DATA_DIR", "/data"))
    DATA_FILE = DATA_DIR / "devices.json"
    JOB_FILE = DATA_DIR / "executor-jobs.json"
    NONCE_FILE = DATA_DIR / "executor-nonces.json"
    LOCK = threading.Lock()
    DATA_DIR.mkdir(parents=True, exist_ok=True)

    PLATFORM_PROFILES = {
        "windows": {"label": "Windows", "family": "desktop", "remote_control": True, "agent": True},
        "linux": {"label": "Linux", "family": "desktop", "remote_control": True, "agent": True},
        "macos": {"label": "macOS", "family": "desktop", "remote_control": True, "agent": True},
        "android": {"label": "Android phone/tablet", "family": "mobile", "remote_control": "capability-dependent", "agent": "mobile-agent-required"},
        "ios": {"label": "iPhone/iPad", "family": "mobile", "remote_control": "capability-dependent", "agent": "native-mobile-capability-required"},
        "browser": {"label": "Browser", "family": "web", "remote_control": "browser-session", "agent": False},
        "other": {"label": "Other", "family": "other", "remote_control": False, "agent": False},
    }

    class DeviceCreate(BaseModel):
        name: str = Field(min_length=1, max_length=120)
        platform: str = Field(default="unknown", max_length=32)
        owner_id: str = Field(default="local-admin", max_length=200)

    class MeshCentralLink(BaseModel):
        meshcentral_node_id: str = Field(min_length=1, max_length=500)
        meshcentral_mesh_id: Optional[str] = Field(default=None, max_length=500)

    class ExecutorEnroll(BaseModel):
        enrollment_token: str = Field(min_length=10, max_length=500)
        hostname: str = Field(min_length=1, max_length=255)
        platform: str = Field(default="unknown", max_length=32)
        agent_version: str = Field(default="1.0", max_length=32)
        profile: Optional[dict] = None
        network: Optional[dict] = None

    class ExecutorHeartbeat(BaseModel):
        agent_id: str
        hostname: str = Field(min_length=1, max_length=255)
        platform: str = Field(default="unknown", max_length=32)
        version: str = Field(default="1.0", max_length=32)
        profile: Optional[dict] = None
        network: Optional[dict] = None

    class JobCreate(BaseModel):
        device_id: str
        operation: str = Field(min_length=1, max_length=100)
        created_by: str | None = None

    class JobResult(BaseModel):
        ok: bool
        operation: Optional[str] = None
        duration_seconds: Optional[float] = None
        result: Optional[dict] = None
        error: Optional[str] = None

    class DevicePublic(BaseModel):
        id: str
        name: str
        platform: str
        platform_profile: dict
        owner_id: str
        status: str
        agent_id: Optional[str] = None
        executor_enabled: bool = False
        executor_last_seen: Optional[str] = None
        last_seen: Optional[str] = None
        created_at: str
        hostname: Optional[str] = None
        agent_version: Optional[str] = None
        system_profile: dict = {}
        network_profile: dict = {}
        meshcentral_node_id: Optional[str] = None
        meshcentral_mesh_id: Optional[str] = None

    class DeviceCreated(DevicePublic):
        enrollment_token: str

    def read_json(path: Path, default):
        if not path.exists():
            return default
        try:
            value = json.loads(path.read_text(encoding="utf-8"))
            return value
        except Exception:
            return default

    def write_json(path: Path, value):
        tmp = path.with_suffix(path.suffix + ".tmp")
        tmp.write_text(json.dumps(value, indent=2), encoding="utf-8")
        tmp.replace(path)

    def load_devices():
        value = read_json(DATA_FILE, [])
        return value if isinstance(value, list) else []

    def save_devices(items):
        write_json(DATA_FILE, items)

    def load_jobs():
        value = read_json(JOB_FILE, [])
        return value if isinstance(value, list) else []

    def save_jobs(items):
        write_json(JOB_FILE, items)

    def load_nonces():
        value = read_json(NONCE_FILE, {})
        return value if isinstance(value, dict) else {}

    def save_nonces(items):
        write_json(NONCE_FILE, items)

    def profile_for(platform_name: str) -> dict:
        key = (platform_name or "other").lower()
        return dict(PLATFORM_PROFILES.get(key, PLATFORM_PROFILES["other"]))

    def public_device(device: dict) -> DevicePublic:
        return DevicePublic(
            id=device["id"], name=device["name"], platform=device["platform"],
            platform_profile=profile_for(device["platform"]), owner_id=device["owner_id"],
            status=device["status"], agent_id=device.get("agent_id"),
            executor_enabled=bool(device.get("executor_enabled", False)),
            executor_last_seen=device.get("executor_last_seen"), last_seen=device.get("last_seen"),
            created_at=device["created_at"], hostname=device.get("hostname"),
            agent_version=device.get("agent_version"), system_profile=device.get("system_profile") or {},
            network_profile=device.get("network_profile") or {},
            meshcentral_node_id=device.get("meshcentral_node_id"),
            meshcentral_mesh_id=device.get("meshcentral_mesh_id"),
        )

    def sanitize_network(network: Optional[dict]) -> dict:
        network = network or {}
        local_ips = []
        for value in network.get("local_ips", []) if isinstance(network.get("local_ips", []), list) else []:
            try:
                ipaddress.ip_address(str(value))
                if str(value) not in local_ips:
                    local_ips.append(str(value))
            except ValueError:
                pass
        public_ip = network.get("public_ip")
        try:
            if public_ip:
                ipaddress.ip_address(str(public_ip))
                public_ip = str(public_ip)
            else:
                public_ip = None
        except ValueError:
            public_ip = None
        vpn_ips = []
        for value in network.get("vpn_ips", []) if isinstance(network.get("vpn_ips", []), list) else []:
            try:
                ipaddress.ip_address(str(value))
                if str(value) not in vpn_ips:
                    vpn_ips.append(str(value))
            except ValueError:
                pass
        return {
            "local_ips": local_ips[:32],
            "public_ip": public_ip,
            "vpn_ips": vpn_ips[:32],
            "vpn_provider": str(network.get("vpn_provider") or "")[:120],
            "vpn_interface": str(network.get("vpn_interface") or "")[:120],
            "observed_at": datetime.now(timezone.utc).isoformat(),
        }

    @app.get("/health")
    def health():
        return {"status": "ok", "service": "remote-device-registry", "version": "4.0"}

    @app.get("/api/platforms")
    def platforms():
        return {"platforms": PLATFORM_PROFILES}

    @app.get("/api/devices", response_model=list[DevicePublic])
    def devices():
        with LOCK:
            return [public_device(d) for d in load_devices()]

    @app.get("/api/devices/overview")
    def overview():
        with LOCK:
            items = [public_device(d).model_dump() for d in load_devices()]
        counts = {}
        for item in items:
            key = item["platform"]
            counts[key] = counts.get(key, 0) + 1
        return {"total": len(items), "by_platform": counts, "devices": items}

    @app.post("/api/devices", response_model=DeviceCreated)
    def create_device(req: DeviceCreate):
        with LOCK:
            items = load_devices()
            now = datetime.now(timezone.utc).isoformat()
            device = {
                "id": secrets.token_urlsafe(18), "name": req.name, "platform": req.platform,
                "owner_id": req.owner_id, "status": "pending", "enrollment_token": secrets.token_urlsafe(32),
                "created_at": now, "system_profile": {}, "network_profile": {},
            }
            items.append(device)
            save_devices(items)
            public = public_device(device)
            return DeviceCreated(**public.model_dump(), enrollment_token=device["enrollment_token"])

    @app.post("/api/devices/{device_id}/meshcentral-link", response_model=DevicePublic)
    def link_meshcentral(device_id: str, req: MeshCentralLink, request: Request):
        authenticate_control(request)
        with LOCK:
            devices = load_devices()
            for device in devices:
                if device["id"] == device_id:
                    device["meshcentral_node_id"] = req.meshcentral_node_id
                    device["meshcentral_mesh_id"] = req.meshcentral_mesh_id
                    save_devices(devices)
                    return public_device(device)
        raise HTTPException(status_code=404, detail="device not found")

    @app.post("/api/devices/{device_id}/enrollment-token")
    def regenerate_enrollment_token(device_id: str, request: Request):
        authenticate_control(request)
        with LOCK:
            devices = load_devices()
            for device in devices:
                if device["id"] == device_id:
                    if device.get("executor_enabled") is True:
                        raise HTTPException(status_code=409, detail="device is already enrolled")
                    token = secrets.token_urlsafe(32)
                    device["enrollment_token"] = token
                    device["status"] = "pending"
                    save_devices(devices)
                    return {"ok": True, "device_id": device_id, "enrollment_token": token}
        raise HTTPException(status_code=404, detail="device not found")

    @app.delete("/api/devices/{device_id}")
    def delete_device(device_id: str):
        with LOCK:
            items = load_devices()
            new_items = [x for x in items if x["id"] != device_id]
            if len(new_items) == len(items):
                raise HTTPException(status_code=404, detail="device not found")
            save_devices(new_items)
        return {"ok": True}

    @app.post("/api/devices/{device_id}/executor-enroll")
    def executor_enroll(device_id: str, req: ExecutorEnroll):
        with LOCK:
            devices = load_devices()
            for device in devices:
                if device["id"] != device_id:
                    continue
                token = device.get("enrollment_token")
                if not token:
                    raise HTTPException(status_code=409, detail="enrollment token unavailable")
                if not hmac.compare_digest(token, req.enrollment_token):
                    raise HTTPException(status_code=401, detail="invalid enrollment token")
                raw_secret = secrets.token_bytes(32)
                secret_b64 = base64.b64encode(raw_secret).decode()
                auth_key = hashlib.sha256(b"shopnoltd-executor-hmac-v1:" + raw_secret).digest()
                now = datetime.now(timezone.utc).isoformat()
                device.update({
                    "enrollment_token": None,
                    "agent_id": "agent-" + uuid.uuid4().hex,
                    "executor_enabled": True,
                    "executor_secret_hash": hashlib.sha256(raw_secret).hexdigest(),
                    "executor_auth_secret_hash": auth_key.hex(),
                    "executor_last_seen": now,
                    "last_seen": now,
                    "status": "online",
                    "platform": req.platform,
                    "hostname": req.hostname,
                    "agent_version": req.agent_version,
                    "system_profile": req.profile or {},
                    "network_profile": sanitize_network(req.network),
                })
                save_devices(devices)
                return {"ok": True, "device_id": device_id, "agent_id": device["agent_id"], "secret": secret_b64, "gateway_version": "4.0"}
        raise HTTPException(status_code=404, detail="device not found")

    def authenticate_executor(device_id, agent_id, timestamp, nonce, signature, method, path, body):
        try:
            ts = int(timestamp)
        except Exception:
            raise HTTPException(status_code=401, detail="invalid timestamp")
        if abs(int(time.time()) - ts) > 300:
            raise HTTPException(status_code=401, detail="timestamp outside allowed window")
        if len(nonce) < 16 or len(nonce) > 128:
            raise HTTPException(status_code=401, detail="invalid nonce")
        with LOCK:
            devices = load_devices()
            device = next((d for d in devices if d["id"] == device_id and d.get("agent_id") == agent_id and d.get("executor_enabled") is True), None)
            if not device:
                raise HTTPException(status_code=401, detail="executor not authorized")
            auth_hash = device.get("executor_auth_secret_hash")
            if not auth_hash:
                raise HTTPException(status_code=401, detail="executor authentication not initialized")
            key = bytes.fromhex(auth_hash)
            message = "\n".join([timestamp, nonce, method.upper(), path, body.decode("utf-8")]).encode()
            expected = hmac.new(key, message, hashlib.sha256).hexdigest()
            if not hmac.compare_digest(expected, signature):
                raise HTTPException(status_code=401, detail="invalid executor signature")
            nonces = load_nonces()
            now = int(time.time())
            nonces = {k: v for k, v in nonces.items() if now - int(v) <= 600}
            nonce_key = f"{device_id}:{nonce}"
            if nonce_key in nonces:
                raise HTTPException(status_code=401, detail="replayed nonce")
            nonces[nonce_key] = now
            if len(nonces) > 10000:
                for key_name, _ in sorted(nonces.items(), key=lambda x: int(x[1]))[:2000]:
                    nonces.pop(key_name, None)
            save_nonces(nonces)
            return device

    @app.post("/api/executor/heartbeat/{device_id}")
    async def executor_heartbeat(device_id: str, request: Request, req: ExecutorHeartbeat):
        body = await request.body()
        device = authenticate_executor(device_id, req.agent_id, request.headers.get("X-Shopnoltd-Timestamp", ""), request.headers.get("X-Shopnoltd-Nonce", ""), request.headers.get("X-Shopnoltd-Signature", ""), request.method, request.url.path, body)
        with LOCK:
            devices = load_devices()
            for item in devices:
                if item["id"] == device["id"]:
                    now = datetime.now(timezone.utc).isoformat()
                    item.update({
                        "status": "online", "last_seen": now, "executor_last_seen": now,
                        "platform": req.platform, "hostname": req.hostname, "agent_version": req.version,
                        "system_profile": req.profile or item.get("system_profile") or {},
                        "network_profile": sanitize_network(req.network),
                    })
                    save_devices(devices)
                    break
        return {"ok": True, "device_id": device_id}

    @app.get("/api/executor/jobs/{device_id}")
    async def executor_jobs(device_id: str, request: Request):
        body = await request.body()
        authenticate_executor(device_id, request.headers.get("X-Shopnoltd-Agent", ""), request.headers.get("X-Shopnoltd-Timestamp", ""), request.headers.get("X-Shopnoltd-Nonce", ""), request.headers.get("X-Shopnoltd-Signature", ""), request.method, request.url.path, body)
        with LOCK:
            jobs = load_jobs()
            available = [j for j in jobs if j["device_id"] == device_id and j["status"] == "queued"]
            if not available:
                return {"jobs": []}
            job = available[0]
            job["status"] = "running"
            job["started_at"] = datetime.now(timezone.utc).isoformat()
            save_jobs(jobs)
            return {"jobs": [{"id": job["id"], "device_id": job["device_id"], "operation": job["operation"], "created_at": job["created_at"]}]}

    @app.post("/api/executor/jobs/{job_id}/result")
    async def executor_job_result(job_id: str, request: Request, req: JobResult):
        body = await request.body()
        device_id = request.headers.get("X-Shopnoltd-Device", "")
        authenticate_executor(device_id, request.headers.get("X-Shopnoltd-Agent", ""), request.headers.get("X-Shopnoltd-Timestamp", ""), request.headers.get("X-Shopnoltd-Nonce", ""), request.headers.get("X-Shopnoltd-Signature", ""), request.method, request.url.path, body)
        with LOCK:
            jobs = load_jobs()
            for job in jobs:
                if job["id"] == job_id and job["device_id"] == device_id and job["status"] == "running":
                    job["status"] = "completed"
                    job["completed_at"] = datetime.now(timezone.utc).isoformat()
                    job["result"] = req.model_dump()
                    save_jobs(jobs)
                    return {"ok": True}
        raise HTTPException(status_code=404, detail="job not found or not running")

    def authenticate_control(request: Request):
        expected = os.getenv("REGISTRY_CONTROL_TOKEN", "")
        supplied = request.headers.get("X-Shopnoltd-Control-Token", "")
        if not expected:
            raise HTTPException(status_code=503, detail="control authentication is not configured")
        if not supplied or not hmac.compare_digest(supplied, expected):
            raise HTTPException(status_code=401, detail="invalid control authentication")

    ALLOWED_OPERATIONS = {
        "system.info", "windows.info", "wsl.info", "k3s.info", "k8s.pods", "k8s.services",
        "git.status", "shopnoltd.health", "disk.status", "memory.status", "remote-device.status",
    }

    @app.post("/api/control/jobs")
    async def create_job(req: JobCreate, request: Request):
        authenticate_control(request)
        if req.operation not in ALLOWED_OPERATIONS:
            raise HTTPException(status_code=400, detail="operation not allowed")
        with LOCK:
            devices = load_devices()
            if not any(d["id"] == req.device_id and d.get("executor_enabled") is True for d in devices):
                raise HTTPException(status_code=404, detail="executor device not found")
            jobs = load_jobs()
            job = {"id": "job-" + uuid.uuid4().hex, "device_id": req.device_id, "operation": req.operation, "status": "queued", "created_at": datetime.now(timezone.utc).isoformat(), "started_at": None, "completed_at": None, "result": None, "created_by": req.created_by}
            jobs.append(job)
            save_jobs(jobs[-5000:])
            return {"ok": True, "job_id": job["id"], "device_id": job["device_id"], "operation": job["operation"], "status": job["status"]}

    @app.get("/api/control/jobs/{job_id}")
    def get_job(job_id: str, request: Request):
        authenticate_control(request)
        with LOCK:
            for job in load_jobs():
                if job["id"] == job_id:
                    return job
        raise HTTPException(status_code=404, detail="job not found")
