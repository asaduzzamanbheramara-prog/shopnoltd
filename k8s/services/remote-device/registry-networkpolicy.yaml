apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remote-device-registry-gateway-only
  namespace: shopno-tools
spec:
  podSelector:
    matchLabels:
      app: remote-device-registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remote-device-gateway
      ports:
        - protocol: TCP
          port: 8080
