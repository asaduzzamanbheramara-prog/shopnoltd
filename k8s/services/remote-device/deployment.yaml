apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-device-gateway
  namespace: shopno-tools
  labels:
    app.kubernetes.io/name: remote-device-gateway
    app.kubernetes.io/part-of: shopnoltd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-device-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-device-gateway
      annotations:
        checksum/gateway-source: android-view-only-20261128
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: gateway-source
          configMap:
            name: remote-device-gateway-source-hotfix

      containers:
        - name: remote-device-gateway
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-remote-device-gateway@sha256:30dce11d9512ad601dbf527642f574ca602b402bcdd376e791214428039faac2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: gateway-source
              mountPath: /app/app.py
              subPath: app.py
              readOnly: true
          env:
            - name: REGISTRY_URL
              value: http://remote-device-registry.shopno-tools.svc.cluster.local:8080
            - name: MESH_URL
              value: https://remote.shopnoltd.dpdns.org
            - name: KEYCLOAK_ISSUER
              value: https://auth.shopnoltd.dpdns.org/realms/shopnoltd
            - name: KEYCLOAK_AUDIENCE
              value: account
            - name: REGISTRY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-device-control-secret
                  key: control-token
                  optional: false
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
