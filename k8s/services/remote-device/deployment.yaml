apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-device-gateway
  namespace: shopno-tools
  labels:
    app.kubernetes.io/name: remote-device-gateway
    app.kubernetes.io/part-of: shopnoltd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-device-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-device-gateway
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: remote-device-gateway
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-remote-device-gateway:825c4f0669cf9f65dedbf63770dc1dab6db06e73
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
