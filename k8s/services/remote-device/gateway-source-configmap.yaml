apiVersion: v1
kind: ConfigMap
metadata:
  name: remote-device-gateway-source-hotfix
  namespace: shopno-tools
data:
  app.py: |
    import json
    import os
    from urllib.parse import urlencode

    import httpx
    from fastapi import FastAPI, HTTPException, Request, status
    from fastapi.responses import RedirectResponse, Response
    from jose import JWTError, jwt


    app = FastAPI(
        title="Shopnoltd Remote Device Gateway",
        version="3.2.0",
    )


    MESH_URL = os.getenv(
        "MESH_URL",
        "https://remote-engine.shopnoltd.dpdns.org",
    ).rstrip("/")

    PORTAL_URL = os.getenv(
        "PORTAL_URL",
        "https://devices.shopnoltd.dpdns.org",
    ).rstrip("/")


    REGISTRY_URL = os.getenv(
        "REGISTRY_URL",
        "http://remote-device-registry.shopno-tools.svc.cluster.local:8080",
    ).rstrip("/")


    KEYCLOAK_ISSUER = os.getenv(
        "KEYCLOAK_ISSUER",
        "https://auth.shopnoltd.dpdns.org/realms/shopnoltd",
    ).rstrip("/")


    KEYCLOAK_AUDIENCE = os.getenv(
        "KEYCLOAK_AUDIENCE",
        "account",
    )


    REGISTRY_CONTROL_TOKEN = os.getenv(
        "REGISTRY_CONTROL_TOKEN",
    )


    _jwks_cache = None


    async def _jwks():
        global _jwks_cache

        if _jwks_cache:
            return _jwks_cache

        async with httpx.AsyncClient(timeout=10.0) as client:
            response = await client.get(
                f"{KEYCLOAK_ISSUER}/protocol/openid-connect/certs"
            )
            response.raise_for_status()
            _jwks_cache = response.json()

        return _jwks_cache


    async def verify_user(request: Request) -> dict:
        authorization = request.headers.get("Authorization", "")

        if not authorization.startswith("Bearer "):
            raise HTTPException(
                status_code=status.HTTP_401_UNAUTHORIZED,
                detail="Bearer authentication required",
                headers={"WWW-Authenticate": "Bearer"},
            )

        token = authorization[7:].strip()

        if not token:
            raise HTTPException(
                status_code=status.HTTP_401_UNAUTHORIZED,
                detail="Bearer authentication required",
                headers={"WWW-Authenticate": "Bearer"},
            )

        try:
            header = jwt.get_unverified_header(token)
            keys = await _jwks()

            key = next(
                k for k in keys["keys"]
                if k["kid"] == header["kid"]
            )

            claims = jwt.decode(
                token,
                key,
                algorithms=[key["alg"]],
                audience=KEYCLOAK_AUDIENCE,
                issuer=KEYCLOAK_ISSUER,
                options={
                    "verify_aud": True,
                    "verify_iss": True,
                },
            )

            if claims.get("azp") not in ("web-portal", "shopnoltd-web"):
                raise HTTPException(
                    status_code=status.HTTP_403_FORBIDDEN,
                    detail="invalid token client",
                )

        except (
            JWTError,
            StopIteration,
            KeyError,
            ValueError,
        ) as exc:
            raise HTTPException(
                status_code=status.HTTP_401_UNAUTHORIZED,
                detail="Invalid or expired access token",
                headers={"WWW-Authenticate": "Bearer"},
            ) from exc

        roles = claims.get("roles", [])

        if not isinstance(roles, list):
            roles = []

        realm_access = claims.get("realm_access", {})

        if not isinstance(realm_access, dict):
            realm_access = {}

        realm_roles = realm_access.get("roles", [])

        if not isinstance(realm_roles, list):
            realm_roles = []

        all_roles = set(roles) | set(realm_roles)

        subject = claims.get("sub")

        if not isinstance(subject, str) or not subject.strip():
            raise HTTPException(
                status_code=status.HTTP_403_FORBIDDEN,
                detail="token subject unavailable",
            )

        return {
            "claims": claims,
            "subject": subject,
            "roles": all_roles,
            "is_platform_admin": "platform_admin" in all_roles,
        }


    async def verify_admin(request: Request) -> dict:
        identity = await verify_user(request)

        if not identity["is_platform_admin"]:
            raise HTTPException(
                status_code=status.HTTP_403_FORBIDDEN,
                detail="platform_admin role required",
            )

        return identity


    async def registry_request(
        method: str,
        path: str,
        request: Request,
    ):
        body = await request.body()

        headers = {}

        for name in (
            "X-Shopnoltd-Device",
            "X-Shopnoltd-Agent",
            "X-Shopnoltd-Timestamp",
            "X-Shopnoltd-Nonce",
            "X-Shopnoltd-Signature",
            "Content-Type",
        ):
            value = request.headers.get(name)

            if value:
                headers[name] = value

        try:
            async with httpx.AsyncClient(timeout=35.0) as client:
                response = await client.request(
                    method,
                    f"{REGISTRY_URL}{path}",
                    content=body,
                    headers=headers,
                )

        except httpx.HTTPError as exc:
            raise HTTPException(
                status_code=503,
                detail=f"registry unavailable: {exc}",
            ) from exc

        content_type = response.headers.get(
            "content-type",
            "application/json",
        )

        return Response(
            content=response.content,
            status_code=response.status_code,
            media_type=(
                "application/json"
                if "application/json" in content_type
                else content_type.split(";", 1)[0]
            ),
        )


    async def registry_control_request(
        method: str,
        path: str,
        body: bytes = b"",
        parse_json: bool = False,
    ):
        if not REGISTRY_CONTROL_TOKEN:
            raise HTTPException(
                status_code=503,
                detail="registry control authentication is not configured",
            )

        headers = {
            "Content-Type": "application/json",
            "X-Shopnoltd-Control-Token": REGISTRY_CONTROL_TOKEN,
        }

        try:
            async with httpx.AsyncClient(timeout=35.0) as client:
                response = await client.request(
                    method,
                    f"{REGISTRY_URL}{path}",
                    content=body,
                    headers=headers,
                )

        except httpx.HTTPError as exc:
            raise HTTPException(
                status_code=503,
                detail=f"registry unavailable: {exc}",
            ) from exc

        if parse_json:
            try:
                return response.json()
            except ValueError as exc:
                raise HTTPException(
                    status_code=502,
                    detail="registry returned invalid JSON",
                ) from exc

        content_type = response.headers.get(
            "content-type",
            "application/json",
        )

        return Response(
            content=response.content,
            status_code=response.status_code,
            media_type=(
                "application/json"
                if "application/json" in content_type
                else content_type.split(";", 1)[0]
            ),
        )


    @app.get("/")
    def root():
        return RedirectResponse(
            url=f"{MESH_URL}/",
            status_code=307,
        )


    @app.get("/healthz")
    def healthz():
        return {
            "status": "ok",
            "service": "remote-device-gateway",
            "engine": "meshcentral",
            "executor": "enabled",
            "version": "3.2.0",
        }


    @app.get("/health")
    def health():
        return {
            "status": "ok",
            "service": "remote-device-gateway",
            "engine": "meshcentral",
            "executor": "enabled",
            "version": "3.2.0",
        }


    @app.get("/api/healthz")
    def api_healthz():
        return {
            "status": "ok",
            "service": "remote-device-gateway",
            "engine": "meshcentral",
            "executor": "enabled",
            "version": "3.2.0",
        }


    @app.get("/api/connect/{device_id}")
    async def connect(device_id: str, request: Request):
        identity = await verify_user(request)

        devices = await registry_control_request(
            "GET",
            "/api/devices",
            parse_json=True,
        )

        device = next(
            (
                item
                for item in devices
                if isinstance(item, dict)
                and item.get("id") == device_id
            ),
            None,
        )

        if device is None:
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        if (
            not identity["is_platform_admin"]
            and device.get("owner_id") != identity["subject"]
            and identity["subject"] not in (device.get("shared_user_ids") or [])
        ):
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        node_id = device.get("meshcentral_node_id")

        if not node_id:
            raise HTTPException(
                status_code=409,
                detail="MeshCentral device is not linked",
            )

        connect_url = (
            f"{MESH_URL}/?"
            + urlencode({
                "gotonode": node_id,
                "viewmode": "11",
                "hide": "15",
            })
        )

        return {
            "device_id": device_id,
            "engine": "meshcentral",
            "connect_url": connect_url,
        }


    @app.get("/connect/{device_id}")
    async def browser_connect(device_id: str, request: Request):
        identity = await verify_user(request)

        devices = await registry_control_request(
            "GET",
            "/api/devices",
            parse_json=True,
        )

        device = next(
            (
                item
                for item in devices
                if isinstance(item, dict)
                and item.get("id") == device_id
            ),
            None,
        )

        if device is None:
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        if (
            not identity["is_platform_admin"]
            and device.get("owner_id") != identity["subject"]
            and identity["subject"] not in (device.get("shared_user_ids") or [])
        ):
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        node_id = device.get("meshcentral_node_id")

        if not node_id:
            raise HTTPException(
                status_code=409,
                detail="MeshCentral device is not linked",
            )

        connect_url = (
            f"{MESH_URL}/?"
            + urlencode({
                "gotonode": node_id,
                "viewmode": "11",
                "hide": "15",
            })
        )

        return RedirectResponse(
            url=connect_url,
            status_code=307,
        )


    # ------------------------------------------------------------
    # Device management
    # ------------------------------------------------------------

    @app.get("/api/devices")
    async def list_devices(request: Request):
        identity = await verify_user(request)

        devices = await registry_control_request(
            "GET",
            "/api/devices",
            parse_json=True,
        )

        visible = []
        for device in devices:
            if not isinstance(device, dict):
                continue
            is_owner = device.get("owner_id") == identity["subject"]
            is_shared = identity["subject"] in (device.get("shared_user_ids") or [])
            if identity["is_platform_admin"] or is_owner or is_shared:
                item = dict(device)
                item["shared_access"] = bool(is_shared and not is_owner)
                item.pop("shared_user_ids", None)
                visible.append(item)
        return visible


    @app.post("/api/devices")
    async def create_device(
        request: Request,
    ):
        identity = await verify_user(request)

        body = await request.body()

        try:
            payload = json.loads(body.decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise HTTPException(
                status_code=400,
                detail="invalid JSON body",
            ) from exc

        if not isinstance(payload, dict):
            raise HTTPException(
                status_code=400,
                detail="JSON object required",
            )

        # NEVER trust owner_id supplied by the browser.
        # Ownership is always the verified Keycloak subject.
        payload["owner_id"] = identity["subject"]

        body = json.dumps(
            payload,
            separators=(",", ":"),
            sort_keys=True,
        ).encode()

        return await registry_control_request(
            "POST",
            "/api/devices",
            body,
        )


    @app.post("/api/devices/{device_id}/meshcentral-link")
    async def link_meshcentral_device(device_id: str, request: Request):
        identity = await verify_user(request)
        devices = await registry_control_request("GET", "/api/devices", parse_json=True)
        device = next((item for item in devices if isinstance(item, dict) and item.get("id") == device_id), None)
        if device is None or (not identity["is_platform_admin"] and device.get("owner_id") != identity["subject"]):
            raise HTTPException(status_code=404, detail="device not found")
        try:
            payload = await request.json()
        except ValueError as exc:
            raise HTTPException(status_code=400, detail="invalid JSON body") from exc
        if not isinstance(payload, dict):
            raise HTTPException(status_code=400, detail="JSON object required")
        node_id = payload.get("meshcentral_node_id")
        if not isinstance(node_id, str) or not node_id.strip() or len(node_id.strip()) > 500:
            raise HTTPException(status_code=400, detail="a valid MeshCentral node ID is required")
        link_payload = {"meshcentral_node_id": node_id.strip()}
        mesh_id = payload.get("meshcentral_mesh_id")
        if isinstance(mesh_id, str) and mesh_id.strip():
            if len(mesh_id.strip()) > 500:
                raise HTTPException(status_code=400, detail="MeshCentral mesh ID is too long")
            link_payload["meshcentral_mesh_id"] = mesh_id.strip()
        body = json.dumps(link_payload, separators=(",", ":"), sort_keys=True).encode()
        return await registry_control_request("POST", f"/api/devices/{device_id}/meshcentral-link", body)


    @app.post("/api/devices/{device_id}/shares")
    async def create_device_share(device_id: str, request: Request):
        identity = await verify_user(request)
        devices = await registry_control_request("GET", "/api/devices", parse_json=True)
        device = next((item for item in devices if isinstance(item, dict) and item.get("id") == device_id), None)
        if device is None or (not identity["is_platform_admin"] and device.get("owner_id") != identity["subject"]):
            raise HTTPException(status_code=404, detail="device not found")
        try:
            payload = json.loads((await request.body()).decode("utf-8") or "{}")
            hours = int(payload.get("expires_in_hours", 24)) if isinstance(payload, dict) else 24
        except (UnicodeDecodeError, json.JSONDecodeError, TypeError, ValueError) as exc:
            raise HTTPException(status_code=400, detail="invalid share request") from exc
        if hours < 1 or hours > 168:
            raise HTTPException(status_code=400, detail="share link expiry must be between 1 and 168 hours")
        created = await registry_control_request(
            "POST", f"/api/devices/{device_id}/shares",
            json.dumps({"created_by": identity["subject"], "expires_in_hours": hours}).encode(),
            parse_json=True,
        )
        share_url = PORTAL_URL + "/?share=" + created["token"]
        return {"device_id": device_id, "share_url": share_url, "expires_at": created["expires_at"], "single_use": True}


    @app.post("/api/shares/redeem")
    async def redeem_device_share(request: Request):
        identity = await verify_user(request)
        try:
            payload = json.loads((await request.body()).decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise HTTPException(status_code=400, detail="invalid JSON body") from exc
        if not isinstance(payload, dict) or not isinstance(payload.get("token"), str) or not payload["token"].strip():
            raise HTTPException(status_code=400, detail="share token required")
        device = await registry_control_request(
            "POST", "/api/shares/redeem",
            json.dumps({"token": payload["token"].strip(), "user_id": identity["subject"]}).encode(),
            parse_json=True,
        )
        if isinstance(device, dict):
            device.pop("shared_user_ids", None)
            device["shared_access"] = True
        return device


    @app.delete("/api/devices/{device_id}/shares/{shared_user_id}")
    async def revoke_device_share(device_id: str, shared_user_id: str, request: Request):
        identity = await verify_user(request)
        devices = await registry_control_request("GET", "/api/devices", parse_json=True)
        device = next((item for item in devices if isinstance(item, dict) and item.get("id") == device_id), None)
        if device is None or (not identity["is_platform_admin"] and device.get("owner_id") != identity["subject"]):
            raise HTTPException(status_code=404, detail="device not found")
        return await registry_control_request("DELETE", f"/api/devices/{device_id}/shares/{shared_user_id}")


    @app.post("/api/devices/{device_id}/enrollment-token")
    async def regenerate_enrollment_token(
        device_id: str,
        request: Request,
    ):
        identity = await verify_user(request)

        devices = await registry_control_request(
            "GET",
            "/api/devices",
            parse_json=True,
        )

        device = next(
            (
                item
                for item in devices
                if isinstance(item, dict)
                and item.get("id") == device_id
            ),
            None,
        )

        if device is None:
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        if (
            not identity["is_platform_admin"]
            and device.get("owner_id") != identity["subject"]
        ):
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        if device.get("executor_enabled") is True:
            raise HTTPException(
                status_code=409,
                detail="device is already enrolled",
            )

        return await registry_control_request(
            "POST",
            f"/api/devices/{device_id}/enrollment-token",
        )


    @app.delete("/api/devices/{device_id}")
    async def delete_device(
        device_id: str,
        request: Request,
    ):
        identity = await verify_user(request)

        devices = await registry_control_request(
            "GET",
            "/api/devices",
            parse_json=True,
        )

        device = next(
            (
                item
                for item in devices
                if isinstance(item, dict)
                and item.get("id") == device_id
            ),
            None,
        )

        if device is None:
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        if (
            not identity["is_platform_admin"]
            and device.get("owner_id") != identity["subject"]
        ):
            raise HTTPException(
                status_code=404,
                detail="device not found",
            )

        return await registry_control_request(
            "DELETE",
            f"/api/devices/{device_id}",
        )


