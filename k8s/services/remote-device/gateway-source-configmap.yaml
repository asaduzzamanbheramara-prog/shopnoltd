    # ------------------------------------------------------------
    # Admin control plane
    # ------------------------------------------------------------

    @app.post("/api/control/jobs")
    async def create_control_job(
        request: Request,
    ):
        claims = await verify_admin(request)

        body = await request.body()

        try:
            payload = json.loads(body.decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise HTTPException(
                status_code=400,
                detail="invalid JSON body",
            ) from exc

        if not isinstance(payload, dict):
            raise HTTPException(
                status_code=400,
                detail="JSON object required",
            )

        # Do not trust client-supplied identity.
        payload["created_by"] = (
            claims.get("preferred_username")
            or claims.get("email")
            or claims.get("sub")
            or "unknown-admin"
        )

        body = json.dumps(
            payload,
            separators=(",", ":"),
            sort_keys=True,
        ).encode()

        response = await registry_control_request(
            "POST",
            "/api/control/jobs",
            body,
        )

        return response


    @app.get("/api/control/jobs/{job_id}")
    async def get_control_job(
        job_id: str,
        request: Request,
    ):
        await verify_admin(request)

        response = await registry_control_request(
            "GET",
            f"/api/control/jobs/{job_id}",
        )

        return response
