apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-device-registry
  namespace: shopno-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-device-registry
  template:
    metadata:
      labels:
        app: remote-device-registry
    spec:
      containers:
        - name: registry
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir fastapi==0.116.1 uvicorn[standard]==0.35.0 pydantic==2.11.7 &&
              uvicorn app:app --host 0.0.0.0 --port 8080
          workingDir: /app
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: REGISTRY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-device-control-secret
                  key: control-token
                  optional: false
          volumeMounts:
            - name: source
              mountPath: /app
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: source
          configMap:
            name: remote-device-registry-source
        - name: data
          persistentVolumeClaim:
            claimName: remote-device-registry
