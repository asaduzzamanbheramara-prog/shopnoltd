apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcentral
  namespace: shopno-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshcentral
  template:
    metadata:
      labels:
        app: meshcentral
    spec:
      initContainers:
        - name: normalize-config
          image: ghcr.io/ylianst/meshcentral:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /config-init/patch-config.js
          volumeMounts:
            - name: data
              mountPath: /opt/meshcentral/meshcentral-data
            - name: config-init
              mountPath: /config-init
              readOnly: true

      containers:
        - name: meshcentral
          image: ghcr.io/ylianst/meshcentral:latest
          imagePullPolicy: IfNotPresent
          # MeshCentral's agent update watcher can exceed the container
          # runtime's default NOFILE soft limit. Raise it while preserving
          # the vendor entrypoint and its config/child-process handling.
          command:
            - /bin/bash
            - -c
          args:
            - |
              ulimit -n 65536
              exec /bin/bash /opt/meshcentral/entrypoint.sh
          ports:
            - name: https
              containerPort: 443
          env:
            - name: HOSTNAME
              value: remote.shopnoltd.dpdns.org
          volumeMounts:
            - name: data
              mountPath: /opt/meshcentral/meshcentral-data
            - name: files
              mountPath: /opt/meshcentral/meshcentral-files
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meshcentral-data
        - name: files
          emptyDir: {}
        - name: config-init
          configMap:
            name: meshcentral-config-init
