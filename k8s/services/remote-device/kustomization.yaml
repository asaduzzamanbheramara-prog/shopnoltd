apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:

  # MeshCentral remote-control engine
  - meshcentral-pvc.yaml
  - meshcentral-config-init.yaml
  - meshcentral-deployment.yaml
  - meshcentral-service.yaml
  - meshcentral-ingress.yaml

  # Shopnoltd device registry
  - registry-pvc.yaml
  - registry-configmap.yaml
  - registry-deployment.yaml
  - registry-service.yaml

  # Shopnoltd remote gateway
  - deployment.yaml
  - service.yaml
  - ingress.yaml

  # Browser device management UI
  - ui-configmap.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  - ui-ingress.yaml
