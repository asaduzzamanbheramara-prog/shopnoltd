apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-service
  namespace: shopno-platform
spec:
  ingressClassName: nginx
  rules:
    - host: api.shopnoltd.dpdns.org
      http:
        paths:
          - path: /api/v1/live
            pathType: Prefix
            backend:
              service:
                name: live-service
                port:
                  number: 80
