apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: live-service
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/live-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: live-service-config
          env:
            - name: OWnCAST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: live-service-secret
                  key: OWnCAST_API_KEY
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
