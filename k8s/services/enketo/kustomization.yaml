apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: enketo
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: shopnoltd
