apiVersion: apps/v1
kind: Deployment
metadata:
  name: enketo
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: enketo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enketo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enketo
        app.kubernetes.io/part-of: shopnoltd
      annotations:
        config.shopnoltd.dpdns.org/enketo-linked-server-revision: "kobo-linked-server-20260924-kobotoolbox-host"
    spec:
      containers:
        - name: enketo
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/enketo:4e94596d3a3c6df65a127ef479eca483a3201b6c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            # Kubernetes service-link injection also creates ENKETO_PORT as a TCP URL.
            # Enketo maps ENKETO_* variables into application config, so pin the
            # application port explicitly to the numeric listener port.
            - name: ENKETO_PORT
              value: "8005"
            - name: ENKETO_URL
              value: "https://enketo.shopnoltd.dpdns.org"
            - name: ENKETO_API_URL
              value: "https://kobo.shopnoltd.dpdns.org"
            - name: ENKETO_LINKED_FORM_AND_DATA_SERVER_SERVER_URL
              value: "https://kobo.shopnoltd.dpdns.org"
            - name: ENKETO_LINKED_FORM_AND_DATA_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-secret
                  key: api-key
            - name: ENKETO_REDIS_MAIN_HOST
              value: "redis.shopno-data.svc.cluster.local"
            - name: ENKETO_REDIS_MAIN_PORT
              value: "6379"
            - name: ENKETO_REDIS_MAIN_PASSWORD
              value: "null"
            - name: ENKETO_REDIS_CACHE_HOST
              value: "redis.shopno-data.svc.cluster.local"
            - name: ENKETO_REDIS_CACHE_PORT
              value: "6379"
            - name: ENKETO_REDIS_CACHE_PASSWORD
              value: "null"
            - name: ENKETO_POSTGRES_HOST
              value: "postgres.shopno-data.svc.cluster.local"
            - name: ENKETO_POSTGRES_PORT
              value: "5432"
            - name: ENKETO_POSTGRES_USER
              value: "postgres"
            - name: ENKETO_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-database
                  key: POSTGRES_PASSWORD
            - name: ENKETO_POSTGRES_DB
              value: "enketo"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
