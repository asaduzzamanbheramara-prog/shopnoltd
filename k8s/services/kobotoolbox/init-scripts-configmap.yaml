apiVersion: v1
kind: ConfigMap
metadata:
  name: kobotoolbox-init-scripts
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: kobotoolbox
    app.kubernetes.io/part-of: shopnoltd
data:
  wait_for_mongo.bash: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for MongoDB at ${KOBO_MONGO_HOST}:${KOBO_MONGO_PORT}."
    wait-for-it -t 60 -h "${KOBO_MONGO_HOST}" -p "${KOBO_MONGO_PORT}"
    echo "MongoDB is reachable."
  wait_for_postgres.bash: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for PostgreSQL at ${POSTGRES_HOST}:${POSTGRES_PORT}."
    wait-for-it -t 60 -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}"
    export PGPASSWORD="${POSTGRES_PASSWORD:-}"
    until pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER:-kobotoolbox}" >/dev/null 2>&1; do
      sleep 1
    done
    echo "PostgreSQL is ready."
