apiVersion: apps/v1
kind: Deployment
metadata:
  name: kobotoolbox
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: kobotoolbox
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kobotoolbox
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kobotoolbox
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        config.shopnoltd.dpdns.org/kobotoolbox-config-revision: "kobo-static-rsync-fowner-20261002"
    spec:
      serviceAccountName: kobotoolbox
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kobotoolbox
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-kpi:sha-7ef4f470ae55378c064389ec6671dfc04b6aabca
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kobotoolbox-config
            - secretRef:
                name: kobotoolbox-secret
            - secretRef:
                name: kobotoolbox-database
            - secretRef:
                name: kobotoolbox-smtp
          env:
            - name: MONGO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-mongo-auth
                  key: MONGO_DB_URL
            - name: KOBO_MONGO_HOST
              value: mongo.shopno-data.svc.cluster.local
            - name: KOBO_MONGO_PORT
              value: "27017"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: PUBLIC_DOMAIN_NAME
              value: shopnoltd.dpdns.org
            - name: KOBOFORM_URL
              value: https://kobo.shopnoltd.dpdns.org
            - name: KOBOCAT_URL
              value: https://kobo.shopnoltd.dpdns.org
            - name: SECURE_PROXY_SSL_HEADER
              value: HTTP_X_FORWARDED_PROTO,https
            - name: USE_X_FORWARDED_HOST
              value: "true"
            - name: PUBLIC_REQUEST_SCHEME
              value: https
            - name: ENKETO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-secret
                  key: api-key
            - name: KPI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-database
                  key: KPI_DATABASE_URL
            - name: KC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kobotoolbox-database
                  key: KC_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kobotoolbox
            - name: data
              mountPath: /srv/src/kpi/media
              subPath: media
            - name: data
              mountPath: /srv/src/kobocat/media
              subPath: kobocat-media
            - name: tmp
              mountPath: /tmp
            - name: runtime-tmp
              mountPath: /srv/tmp
            - name: logs
              mountPath: /srv/logs
            - name: uwsgi-ini-override
              mountPath: /srv/src/kpi/docker/uwsgi.ini
              subPath: kpi-uwsgi.ini
            - name: init-scripts
              mountPath: /srv/init
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kobotoolbox-data
        - name: tmp
          emptyDir: {}
        - name: runtime-tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: uwsgi-ini-override
          configMap:
            name: kobotoolbox-config
        - name: init-scripts
          configMap:
            name: kobotoolbox-init-scripts
            defaultMode: 493
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kobotoolbox
