apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: 628a86a4d4b91abdcc1ca28d659f8a88f96d876a

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: shopnoltd

configMapGenerator:
- name: code-server-continue-config
  files:
  - config.json=continue-config.json
