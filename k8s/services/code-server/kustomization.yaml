apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- secret.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml
- servicemonitor.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: b6f03b3f2f5f4bcced82867dba17e578e2f7a2d6

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: code-server
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: shopnoltd
