apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: e5e2bb84af54093ca5c48435bb9c84724761e8e2

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: shopnoltd

configMapGenerator:
- name: code-server-continue-config
  files:
  - config.json=continue-config.json
