apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: 5c65a7f3c678b195df73186d30a1a081dc9ae620

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: shopnoltd

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: code-server-continue-config
  files:
  - config.json=continue-config.json
