apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: 3cdc7b3683fa06b35ebff5db045481d9b89b44d3

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: shopnoltd

configMapGenerator:
- name: code-server-continue-config
  files:
  - config.json=continue-config.json
