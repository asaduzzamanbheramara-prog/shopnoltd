apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml

images:
- name: linuxserver/code-server
  newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
  newTag: 4b0eb08a0dc71e4d7793f4e674a4b8203699ca85

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: shopnoltd

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: code-server-continue-config
  files:
  - config.json=continue-config.json
