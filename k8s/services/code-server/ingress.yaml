apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  namespace: shopno-apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # code-server / VS Code browser connections
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

    # Keep WebSocket/editor sessions alive
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - code.shopnoltd.dpdns.org
    - codeserver.shopnoltd.dpdns.org
        - code-server.shopnoltd.dpdns.org
        - cursor.shopnoltd.dpdns.org
      secretName: code-server-tls
  rules:
    - host: code.shopnoltd.dpdns.org
    http:
      paths:
        - backend:
            service:
              name: code-server
              port:
                number: 80
          path: /
          pathType: Prefix
  - host: codeserver.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  number: 80
    - host: code-server.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  number: 80
    - host: cursor.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  number: 80
