apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: shopnoltd
  annotations:
    argocd.argoproj.io/tracking-id: shopnoltd:apps/Deployment:shopno-apps/nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "80"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: nextcloud

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: seed-nextcloud-html
          image: nextcloud:34.0.2-apache
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Seeding Nextcloud application tree..."
              cp -rL /usr/src/nextcloud/. /html/
              echo "Nextcloud application tree:"
              test -f /html/occ
              test -f /html/version.php
              echo "occ and version.php present"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: html
              mountPath: /html

        - name: seed-php-confd
          image: nextcloud:34.0.2-apache
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cp -rL /usr/local/etc/php/conf.d/. /php-confd-writable/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - FOWNER
          volumeMounts:
            - name: php-confd
              mountPath: /php-confd-writable
            - name: run-tmp
              mountPath: /run

      containers:
        - name: nextcloud
          image: nextcloud:34.0.2-apache
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: db-password
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: username
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: admin-password

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.shopnoltd.dpdns.org
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.shopnoltd.dpdns.org
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.shopnoltd.dpdns.org
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:
            - name: html
              mountPath: /var/www/html

            - name: data
              mountPath: /var/lib/nextcloud

            - name: data
              mountPath: /var/www/html/config
              subPath: config

            - name: tmp
              mountPath: /tmp

            - name: php-confd
              mountPath: /usr/local/etc/php/conf.d

            - name: apache-run
              mountPath: /var/run/apache2

      volumes:
        - name: html
          emptyDir: {}

        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data

        - name: tmp
          emptyDir: {}

        - name: php-confd
          emptyDir: {}

        - name: run-tmp
          emptyDir: {}

        - name: apache-run
          emptyDir: {}
