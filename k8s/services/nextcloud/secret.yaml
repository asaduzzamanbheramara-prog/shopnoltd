# REFERENCE ONLY — this file matches *secret*.yaml in your .gitignore and will
# NOT be committed by a normal `git add`. Do not force-add it with real values.
#
# If `nextcloud-secret` doesn't already exist live, create it directly with
# kubectl (never via a committed file):
#
#   kubectl -n shopno-apps create secret generic nextcloud-secret \
#     --from-literal=POSTGRES_PASSWORD='<real-password>' \
#     --from-literal=NEXTCLOUD_ADMIN_USER='<real-admin-user>' \
#     --from-literal=NEXTCLOUD_ADMIN_PASSWORD='<real-admin-password>'
#
# It very likely already exists on the cluster (the deployment references it
# via secretRef), so check first:
#   kubectl -n shopno-apps get secret nextcloud-secret
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: shopno-apps
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  NEXTCLOUD_ADMIN_USER: "REPLACE_ME"
  NEXTCLOUD_ADMIN_PASSWORD: "REPLACE_ME"
