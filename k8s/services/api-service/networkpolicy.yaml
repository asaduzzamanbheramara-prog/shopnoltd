apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-service
  namespace: shopno-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: shopno-ingress
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
        - namespaceSelector:
            matchLabels:
              name: shopno-monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-data
        - namespaceSelector:
            matchLabels:
              name: shopno-identity
        - namespaceSelector:
            matchLabels:
              name: shopno-monitoring
        - namespaceSelector:
            matchLabels:
              name: shopno-payments
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - port: 53
          protocol: UDP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 27017
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-payments
          podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-engine
      ports:
        - port: 5000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-payments
          podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-payments
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exchange-service
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth-service
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-platform
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: domain-service
      ports:
        - port: 8080
          protocol: TCP
    # Same-namespace platform service calls use port 8080.
    # Keep this port-scoped so API pods cannot reach arbitrary ports.
    - to:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
