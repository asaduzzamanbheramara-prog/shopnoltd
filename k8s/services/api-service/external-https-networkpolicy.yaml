apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-service-external-https
  namespace: shopno-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
