apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-browser
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: agent-browser
    app.kubernetes.io/part-of: shopnoltd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-browser
        app.kubernetes.io/part-of: shopnoltd
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chromium
          image: ghcr.io/browserless/chromium@sha256:62c720e41dd5919b652a32e5183fbd68abff533c3a757087f7b962b73a9370e4
          imagePullPolicy: IfNotPresent
          ports:
            - name: browser
              containerPort: 3000
              protocol: TCP
          env:
            - name: CONCURRENT
              value: "1"
            - name: TIMEOUT
              value: "300000"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: browser
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: browser
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
