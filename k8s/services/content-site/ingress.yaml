apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-site
  namespace: shopno-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - content.shopnoltd.dpdns.org
    secretName: shopno-wildcard-tls
  rules:
  - host: content.shopnoltd.dpdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: content-site
            port:
              number: 80
