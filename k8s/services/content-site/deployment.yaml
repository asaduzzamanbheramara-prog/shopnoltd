apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-site
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: content-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/content-site:main
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
            ephemeral-storage: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
