apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: shopno-identity
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: shopnoltd
data:
  APP_NAME: auth-service
  APP_PORT: "8080"
  ENV: production
  KEYCLOAK_AUDIENCE: auth-service
  KEYCLOAK_ISSUER: https://auth.shopnoltd.dpdns.org/realms/shopnoltd
  KEYCLOAK_REALM: shopnoltd
  KEYCLOAK_URL: https://auth.shopnoltd.dpdns.org
  KEYCLOAK_WEB_CLIENT_ID: shopnoltd-web
  LOG_FORMAT: json
  LOG_LEVEL: info
  MINIO_ENDPOINT: minio.shopno-data.svc.cluster.local:9000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4317
  PATH_PREFIX: /
  POSTGRES_HOST: postgres.shopno-data.svc.cluster.local
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis.shopno-data.svc.cluster.local
  REDIS_PORT: "6379"
