apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-infrastructure
  namespace: shopno-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin-infrastructure
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: shopno-ingress
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - namespaceSelector:
            matchLabels:
              name: shopno-identity
        - namespaceSelector:
            matchLabels:
              name: shopno-ingress
      ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
