apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-platform

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: admin-infrastructure
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: shopnoltd
