apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shopnoltd-admin-infrastructure-readonly
  labels:
    app.kubernetes.io/name: admin-infrastructure
    app.kubernetes.io/part-of: shopnoltd
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shopnoltd-admin-infrastructure-readonly
  labels:
    app.kubernetes.io/name: admin-infrastructure
    app.kubernetes.io/part-of: shopnoltd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shopnoltd-admin-infrastructure-readonly
subjects:
  - kind: ServiceAccount
    name: admin-infrastructure
    namespace: shopno-platform
