apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-infrastructure
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: admin-infrastructure
    app.kubernetes.io/part-of: shopnoltd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-infrastructure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-infrastructure
        app.kubernetes.io/part-of: shopnoltd
    spec:
      serviceAccountName: admin-infrastructure
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-infrastructure
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-admin-infrastructure:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER
              value: https://auth.shopnoltd.dpdns.org/realms/shopnoltd
            - name: KEYCLOAK_AUDIENCE
              value: shopnoltd-web
            - name: CORS_ORIGINS
              value: https://shopnoltd.dpdns.org,https://admin-portal.shopnoltd.dpdns.org
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
