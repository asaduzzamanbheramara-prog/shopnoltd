apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-tools

resources:
- serviceaccount.yaml
- configmap.yaml
- secret.yaml
- deployment-guacd.yaml
- deployment-guacamole.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: guacamole
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: shopnoltd
