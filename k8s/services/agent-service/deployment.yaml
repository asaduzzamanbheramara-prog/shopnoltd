apiVersion: v1
kind: Secret
metadata:
  name: agent-service-litellm-key
  namespace: shopno-apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData: {}   # fill at runtime: kubectl -n shopno-apps create secret generic agent-service-litellm-key --from-literal=LITELLM_MASTER_KEY=... --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: agent-service
spec:
  replicas: 1   # keep 1: extension/UI sockets and run locks are in-memory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-service
          image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-agent-service:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LITELLM_URL
              value: http://litellm-proxy.shopno-ai.svc.cluster.local:4000/v1
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-service-litellm-key
                  key: LITELLM_MASTER_KEY
            - name: KEYCLOAK_ISSUER
              value: https://auth.shopnoltd.dpdns.org/realms/shopnoltd
            - name: KEYCLOAK_AUDIENCE
              value: api-service
            - name: UI_ORIGINS
              value: https://shopnoltd.dpdns.org
            - name: EXTENSION_IDS
              value: ljgfebpfnjjogghaglblhdkihblpcgja   # unpacked-extension ID; replace after publishing the extension
            - name: ENABLE_SHELL
              value: "false"
            - name: WORKSPACE
              value: /workspace
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
