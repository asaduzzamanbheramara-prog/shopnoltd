apiVersion: v1
kind: Namespace
metadata:
  name: shopno-ai
  labels:
    name: shopno-ai

---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: shopno-ai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      initContainers:
        - name: sync-active-ai-models
          image: postgres:16-alpine
          command: ["sh", "/scripts/sync.sh"]
          env:
            - name: AI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-provider-keys
                  key: DATABASE_URL
          volumeMounts:
            - name: sync-script
              mountPath: /scripts
            - name: generated-config
              mountPath: /generated
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:0f4dce575a6c33d737886fe0796a6b3022358b45c2068a5e1312293e28b35f0f
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          env:
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          envFrom:
            - secretRef:
                name: litellm-provider-keys
            - secretRef:
                name: litellm-keys
          volumeMounts:
            - name: generated-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: sync-script
          configMap:
            name: ai-model-catalog-sync
            defaultMode: 0555
        - name: generated-config
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: shopno-ai
spec:
  selector:
    app.kubernetes.io/name: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - openai.shopnoltd.dpdns.org
      secretName: litellm-proxy-tls
  rules:
    - host: openai.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm-proxy
                port:
                  number: 4000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-proxy-netpol
  namespace: shopno-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shopno-apps
          podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-data
      ports:
        - protocol: TCP
          port: 5432
