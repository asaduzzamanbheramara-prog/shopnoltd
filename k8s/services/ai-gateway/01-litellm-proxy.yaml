apiVersion: v1
kind: Namespace
metadata:
  name: shopno-ai
  labels:
    name: shopno-ai

---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: shopno-ai
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: "c2stYW50LWFwaTAzLXh4eHh4eHh4eHh4eA=="
  GEMINI_API_KEY: ""
  MISTRAL_API_KEY: ""
  GROQ_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  XAI_API_KEY: ""
  COHERE_API_KEY: ""
  LITELLM_MASTER_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: shopno-ai
data:
  config.yaml: |
    model_list:

      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-5
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: os.environ/GEMINI_API_KEY

      - model_name: mistral-small
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: groq-llama
        litellm_params:
          model: groq/llama-3.3-70b-versatile
          api_key: os.environ/GROQ_API_KEY

      - model_name: deepseek-chat
        litellm_params:
          model: deepseek/deepseek-chat
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: grok
        litellm_params:
          model: xai/grok-3-mini
          api_key: os.environ/XAI_API_KEY

      - model_name: command-r
        litellm_params:
          model: cohere/command-r-plus
          api_key: os.environ/COHERE_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-provider-keys
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5

      volumes:
        - name: config
          configMap:
            name: litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: shopno-ai
spec:
  selector:
    app.kubernetes.io/name: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - openai.shopnoltd.dpdns.org
      secretName: litellm-proxy-tls
  rules:
    - host: openai.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm-proxy
                port:
                  number: 4000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-proxy-netpol
  namespace: shopno-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - ports:
        - protocol: TCP
          port: 4000

  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    - ports:
        - protocol: UDP
          port: 53

    - ports:
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shopno-apps
          podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
