# =============================================================================
# LiteLLM Proxy — single OpenAI-compatible gateway for multiple providers/keys
# Namespace: adjust NAMESPACE below to match where your other AI/dev tools live
# (e.g. shopno-platform, or a new shopno-ai namespace — see notes at bottom)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: shopno-ai
  labels:
    name: shopno-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: shopno-ai
type: Opaque
stringData:
  # Fill in whichever providers you actually have keys for.
  # Leave a key blank/omit it and just remove that model block in the ConfigMap below.
  OPENAI_API_KEY: "sk-REPLACE_ME"
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  GEMINI_API_KEY: "REPLACE_ME"
  # LiteLLM's own master key — this is the ONE key code-server / Open WebUI will use
  # to talk to the proxy. Generate with: openssl rand -hex 32
  LITELLM_MASTER_KEY: "sk-litellm-REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: shopno-ai
data:
  config.yaml: |
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: os.environ/GEMINI_API_KEY

      # Add a local Ollama model here later if you ever run one on-cluster, e.g.:
      # - model_name: local-llama
      #   litellm_params:
      #     model: ollama/llama3
      #     api_base: http://ollama.shopno-ai.svc.cluster.local:11434

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: null   # no DB needed — stateless proxy, keeps footprint tiny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-provider-keys
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5   # loosened — this host is CPU-starved at times
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: shopno-ai
spec:
  selector:
    app.kubernetes.io/name: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-proxy
  namespace: shopno-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # adjust to whatever you actually use
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["openai.shopnoltd.dpdns.org"]
      secretName: litellm-proxy-tls
  rules:
    - host: openai.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm-proxy
                port:
                  number: 4000
---
# Follows your existing NetworkPolicy pattern: matchLabels {name: <ns>},
# ingress-nginx must be allowed in, egress to internet needed for provider APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-proxy-netpol
  namespace: shopno-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:   # DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
