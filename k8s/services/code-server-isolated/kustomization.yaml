apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: code-server-continue-config
    files:
      - config.json=continue-config.json

images:
  - name: linuxserver/code-server
    newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
    newTag: 5dce3846f443288a5d39858ba24c6871e52d0f4f

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: code-server-isolated
      app.kubernetes.io/part-of: shopnoltd
