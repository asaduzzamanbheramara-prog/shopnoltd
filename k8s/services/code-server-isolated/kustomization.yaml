apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: code-server-isolated-continue-config
    files:
      - config.json=continue-config.json

images:
  - name: linuxserver/code-server
    newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
    newTag: 4b0eb08a0dc71e4d7793f4e674a4b8203699ca85

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: code-server-isolated
      app.kubernetes.io/part-of: shopnoltd
