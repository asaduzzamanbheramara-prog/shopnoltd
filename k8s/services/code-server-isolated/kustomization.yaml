apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: code-server-isolated-continue-config
    files:
      - config.json=continue-config.json

images:
  - name: linuxserver/code-server
    newName: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server
    newTag: 31b3db25a09c2f6651aa8e165abb83bb7aeab780

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: code-server-isolated
      app.kubernetes.io/part-of: shopnoltd
