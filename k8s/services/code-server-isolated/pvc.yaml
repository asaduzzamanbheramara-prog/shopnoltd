  name: code-server-isolated-data
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: code-server-isolated
    app.kubernetes.io/part-of: shopnoltd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
