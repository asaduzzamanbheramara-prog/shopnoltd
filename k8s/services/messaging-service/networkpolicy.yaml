apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging-service
  namespace: shopno-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: messaging-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shopno-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
