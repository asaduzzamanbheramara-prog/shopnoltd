apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-apps

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- health-service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml
- servicemonitor.yaml
- workflow-import-job.yaml

configMapGenerator:
- name: n8n-omnichannel-workflow
  files:
  - workflows/shopnoltd-omnichannel-action-queue.json

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: n8n
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: shopnoltd
