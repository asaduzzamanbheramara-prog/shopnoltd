apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-workflow-import
  namespace: shopno-apps
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-workflow-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: n8nio/n8n:2.40.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secret
          env:
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: POSTGRES_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: POSTGRES_PORT
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              value: "n8n"
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: db-password
          command:
            - /bin/sh
            - -ec
            - |
              node -e 'const http=require("http");let n=0;const t=setInterval(()=>{http.get("http://n8n/healthz",r=>{if(r.statusCode===200){clearInterval(t);process.exit(0)};r.resume()}).on("error",()=>{});if(++n>=60){clearInterval(t);process.exit(1)}},2000)'
              n8n import:workflow --input=/workflows/shopnoltd-omnichannel-action-queue.json --activeState=false
              n8n unpublish:workflow --id=7b2a0a2f-5d1f-4e9f-8e0a-9f4a8f1c0d21
          volumeMounts:
            - name: workflow
              mountPath: /workflows
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: workflow
          configMap:
            name: n8n-omnichannel-workflow
        - name: tmp
          emptyDir: {}
