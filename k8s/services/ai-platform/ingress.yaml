apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-platform
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: ai-platform
    app.kubernetes.io/part-of: shopnoltd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-platform.shopnoltd.dpdns.org
      secretName: ai-platform-tls
  rules:
    - host: ai-platform.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-platform
                port:
                  number: 80
