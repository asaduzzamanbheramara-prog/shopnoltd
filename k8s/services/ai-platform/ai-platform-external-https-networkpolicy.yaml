apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-platform-external-https
  namespace: shopno-platform
  labels:
    app.kubernetes.io/name: ai-platform-external-https
    app.kubernetes.io/part-of: shopnoltd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-platform
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
