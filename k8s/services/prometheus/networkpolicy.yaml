apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: shopno-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: shopno-ingress
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
        - namespaceSelector:
            matchLabels:
              name: shopno-monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-monitoring
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              name: shopno-data
        - namespaceSelector:
            matchLabels:
              name: shopno-identity
        - namespaceSelector:
            matchLabels:
              name: shopno-platform
        - namespaceSelector:
            matchLabels:
              name: shopno-apps
        - namespaceSelector:
            matchLabels:
              name: shopno-ingress
        - namespaceSelector:
            matchLabels:
              name: toolbox
      # scrape ports vary per-service annotation; also covers prometheus's own db/cache/keycloak/minio egress to shopno-data & shopno-identity
