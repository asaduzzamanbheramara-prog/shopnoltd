apiVersion: batch/v1
kind: Job
metadata:
  name: freedomain-secret-bridge
  namespace: shopno-identity
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: freedomain-secret-bridge
    app.kubernetes.io/part-of: shopnoltd
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freedomain-secret-bridge
    spec:
      restartPolicy: Never
      automountServiceAccountToken: true
      serviceAccountName: freedomain-secret-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/bridge/freedomain-secret-bridge.py
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /opt/bridge
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: freedomain-secret-bridge-script
