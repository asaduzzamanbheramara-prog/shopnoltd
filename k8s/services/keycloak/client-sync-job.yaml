apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-client-sync
  namespace: shopno-identity
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak-client-sync
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: sync
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/sync/client-sync.py
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.shopno-identity.svc.cluster.local"
            - name: KEYCLOAK_REALM
              value: "shopnoltd"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
          # Social provider credentials are optional until the provider consoles
          # have been provisioned. When present, the sync job reconciles them.
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: FACEBOOK_APP_ID
                  optional: true
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: FACEBOOK_APP_SECRET
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-social-providers
                  key: GITHUB_CLIENT_SECRET
                  optional: true
          volumeMounts:
            - name: script
              mountPath: /opt/sync
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
      volumes:
        - name: script
          configMap:
            name: keycloak-client-sync-script
