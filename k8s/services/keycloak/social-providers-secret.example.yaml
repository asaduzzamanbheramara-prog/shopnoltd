apiVersion: v1
kind: Secret
metadata:
  name: keycloak-social-providers
  namespace: shopno-identity
type: Opaque
stringData:
  # Fill only on the cluster; never commit real values.
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  FACEBOOK_LOGIN_APP_ID: ""
  FACEBOOK_LOGIN_APP_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  # Apple Sign in with Apple (configure only after installing the Keycloak Apple extension).
  APPLE_CLIENT_ID: ""
  APPLE_CLIENT_SECRET: ""
  APPLE_TEAM_ID: ""
  APPLE_KEY_ID: ""
