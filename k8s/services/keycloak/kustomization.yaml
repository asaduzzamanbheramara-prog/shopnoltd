apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-identity

resources:
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- networkpolicy.yaml
- poddisruptionbudget.yaml
- servicemonitor.yaml
- client-sync-job.yaml

configMapGenerator:
- name: keycloak-realm
  files:
  - realm-shopnoltd.json

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: keycloak
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: shopnoltd

configMapGenerator:
- name: keycloak-client-sync-script
  files:
  - client-sync.py
