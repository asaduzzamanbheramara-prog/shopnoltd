apiVersion: v1
kind: ServiceAccount
metadata:
  name: freedomain-secret-bridge
  namespace: shopno-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freedomain-secret-source-reader
  namespace: shopno-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freedomain-secret-source-reader
  namespace: shopno-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
subjects:
  - kind: ServiceAccount
    name: freedomain-secret-bridge
    namespace: shopno-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freedomain-secret-source-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freedomain-secret-target-patcher
  namespace: shopno-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["freedomain-service-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freedomain-secret-target-patcher
  namespace: shopno-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
subjects:
  - kind: ServiceAccount
    name: freedomain-secret-bridge
    namespace: shopno-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freedomain-secret-target-patcher
