apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopno-platform

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: social-service
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: shopnoltd
