apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: shopno-ingress
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # The k3s target is a single-node control plane. With hostNetwork enabled,
  # multiple replicas would contend for the fixed metrics/readiness port 2000
  # on the same node. Keep one connector here so the tunnel remains deterministic
  # and the readiness/liveness probes cannot collide.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      serviceAccountName: cloudflared
      # Run the tunnel connector on the node network so Cloudflare egress is
      # independent of the pod overlay/CNI datapath. Cluster DNS remains
      # available for the origin service through ClusterFirstWithHostNet.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
          imagePullPolicy: IfNotPresent
          # Let cloudflared choose QUIC or HTTP/2 based on the node's actual
          # outbound connectivity. Forcing HTTP/2 can break the tunnel when
          # TCP/7844 is blocked even though UDP/7844 is available.
          args: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--protocol", "auto", "--metrics", "0.0.0.0:2000", "run"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-creds
