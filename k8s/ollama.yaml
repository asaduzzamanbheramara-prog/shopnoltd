apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: shopno-apps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: shopno-apps
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC doesn't support rolling
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_KEEP_ALIVE
          value: "30m"
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        resources:
          requests:
            cpu: "500m"
            memory: "1536Mi"
          limits:
            cpu: "2"
            memory: "6Gi"
        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 10
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
      - name: tmp
        emptyDir:
          sizeLimit: "10Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: shopno-apps
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    name: http
