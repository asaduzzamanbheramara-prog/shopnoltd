apiVersion: v1
kind: Secret
metadata:
  name: kobotoolbox-secrets
  namespace: shopno-data
type: Opaque
stringData:
  KOBO_DB_PASSWORD: "${KOBO_DB_PASSWORD}"
  DJANGO_SECRET_KEY: "kobo-secret-key-change-in-production-xyz123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kobocat-config
  namespace: shopno-data
data:
  KC_DATABASE_URL: "postgresql://kobotoolbox:KUSEZeFnjWKY997vtX9eayS3XBICDJG@postgres:5432/kobocat"
  KOBOCAT_DATABASE_URL: "postgresql://kobotoolbox:KUSEZeFnjWKY997vtX9eayS3XBICDJG@postgres:5432/kobocat"
  DATABASE_URL: "postgresql://kobotoolbox:KUSEZeFnjWKY997vtX9eayS3XBICDJG@postgres:5432/kobocat"
  REDIS_URL: "redis://redis:6379/0"
  CACHE_URL: "redis://redis:6379/2"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DJANGO_SETTINGS_MODULE: "kobocat.settings.prod"
  LOG_LEVEL: "info"
  PUBLIC_DOMAIN_NAME: "shopnoltd.dpdns.org"
  KOBOFORM_URL: "https://kobo.shopnoltd.dpdns.org"
  KOBOCAT_URL: "https://kobotoolbox.shopnoltd.dpdns.org"
  ENKETO_URL: "https://enketo.shopnoltd.dpdns.org"
  ENKETO_INTERNAL_URL: "http://enketo.shopno-apps.svc.cluster.local:8005"
---
apiVersion: v1
kind: Service
metadata:
  name: kobocat
  namespace: shopno-data
  labels:
    app.kubernetes.io/name: kobocat
    app.kubernetes.io/part-of: shopnoltd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kobocat
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kobocat
  namespace: shopno-data
  labels:
    app.kubernetes.io/name: kobocat
    app.kubernetes.io/part-of: shopnoltd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kobocat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kobocat
        app.kubernetes.io/part-of: shopnoltd
    spec:
      serviceAccountName: kobotoolbox
      containers:
        - name: kobocat
          image: docker.io/kobotoolbox/kobocat:2.0.25
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kobocat-config
            - secretRef:
                name: kobotoolbox-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi",   ephemeral-storage: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /srv/src/kobocat/media
            - name: srv-tmp
              mountPath: /srv/tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kobocat-data
        - name: srv-tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kobocat-data
  namespace: shopno-data
  labels:
    app.kubernetes.io/name: kobocat
    app.kubernetes.io/part-of: shopnoltd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kobocat
  namespace: shopno-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kobocat
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
        - podSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
