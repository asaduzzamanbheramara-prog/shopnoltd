apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enketo
  namespace: shopno-apps
  labels:
    app.kubernetes.io/name: enketo
    app.kubernetes.io/part-of: shopnoltd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - enketo.shopnoltd.dpdns.org
      # Reuse the existing Shopnoltd wildcard certificate; avoid a new ACME
      # order for a hostname that is already covered by the wildcard cert.
      secretName: shopno-wildcard-tls
  rules:
    - host: enketo.shopnoltd.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enketo
                port:
                  number: 8005
