name: Production cluster read-only migration audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-cluster-readonly-audit.yml'

permissions:
  contents: read

concurrency:
  group: production-cluster-readonly-audit
  cancel-in-progress: true

jobs:
  inventory:
    name: Read-only Kubernetes inventory
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout repository manifests
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify runner and cluster connectivity
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v jq
          echo "Runner: $(hostname)"
          echo "Kubernetes client:"
          kubectl version --client
          connected=0
          for attempt in {1..6}; do
            if kubectl --request-timeout=10s get --raw=/readyz >/dev/null 2>&1; then
              connected=1
              break
            fi
            echo "API readiness attempt $attempt/6 failed; retrying in 5 seconds."
            sleep 5
          done
          if [ "$connected" -ne 1 ]; then
            echo "BLOCKED: runner cannot reach a ready Kubernetes API."
            exit 1
          fi
          echo "PASS: Kubernetes API is reachable."

      - name: Report cluster capacity and workload state
        shell: bash
        run: |
          set -euo pipefail
          echo "=== NODES (no node details beyond status/resources) ==="
          kubectl get nodes -o wide
          echo "=== DEPLOYMENTS ACROSS ALL NAMESPACES ==="
          kubectl get deployments -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas'
          echo "=== STATEFULSETS ACROSS ALL NAMESPACES ==="
          kubectl get statefulsets -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas'
          echo "=== PVC STATUS (NO DATA CONTENTS) ==="
          kubectl get pvc -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase,ACCESS:.spec.accessModes,CAPACITY:.status.capacity.storage,STORAGECLASS:.spec.storageClassName'
          echo "=== INGRESS HOSTS AND ADDRESS ==="
          kubectl get ingress -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,HOSTS:.spec.rules[*].host,ADDRESS:.status.loadBalancer.ingress[*].hostname'
          echo "=== SERVICES ==="
          kubectl get services -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.type,CLUSTER-IP:.spec.clusterIP,PORTS:.spec.ports[*].port'
          echo "=== ARGO CD APPLICATION SUMMARY (IF INSTALLED) ==="
          if kubectl -n argocd get application shopnoltd -o json >/tmp/shopnoltd-argo.json 2>/dev/null; then
            jq -r '"name=" + .metadata.name + "\nhealth=" + (.status.health.status // "unknown") + "\nsync=" + (.status.sync.status // "unknown") + "\nrevision=" + (.status.sync.revision // "unknown") + "\noperation=" + (.status.operationState.phase // "none")' /tmp/shopnoltd-argo.json
          else
            echo "NOTE: Argo CD application not readable in namespace argocd."
          fi
          echo "=== REPOSITORY ZERO-REPLICA DEPLOYMENT MANIFESTS ==="
          grep -R -nE 'replicas:[[:space:]]*0' k8s/services --include='deployment.yaml' || true
          echo "=== NODE CAPACITY SNAPSHOT ==="
          kubectl top nodes 2>&1 || echo "NOTE: metrics-server resource metrics unavailable."
          node_name="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          echo "=== NODE CONDITIONS (PRESSURE / READINESS) ==="
          kubectl describe node "$node_name" | sed -n '/Conditions:/,/Addresses:/p'
          echo "=== NODE ALLOCATED RESOURCE REQUESTS AND LIMITS ==="
          kubectl describe node "$node_name" | sed -n '/Allocated resources:/,/Events:/p'
          echo "=== TOP 25 PODS BY MEMORY (METRICS ONLY) ==="
          kubectl top pods -A --sort-by=memory 2>&1 | head -n 26 || echo "NOTE: pod resource metrics unavailable."
          echo "=== SERVICE START PREREQUISITES (METADATA ONLY; NO SECRET VALUES) ==="
          check_object() {
            local kind="$1" namespace="$2" name="$3"
            if kubectl -n "$namespace" get "$kind" "$name" >/dev/null 2>&1; then
              echo "PASS $kind $namespace/$name exists"
            else
              echo "BLOCKED $kind $namespace/$name missing"
            fi
          }
          check_service() {
            local namespace="$1" app="$2" pvc="$3" config="$4" secret="$5" ingress="$6"
            echo "--- $namespace/$app ---"
            check_object serviceaccount "$namespace" "$app"
            check_object configmap "$namespace" "$config"
            check_object secret "$namespace" "$secret"
            if [ -n "$pvc" ]; then
              check_object pvc "$namespace" "$pvc"
              kubectl -n "$namespace" get pvc "$pvc" -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,CAPACITY:.status.capacity.storage,STORAGECLASS:.spec.storageClassName' --no-headers 2>/dev/null || true
            fi
            if [ -n "$ingress" ]; then
              check_object ingress "$namespace" "$ingress"
              kubectl -n "$namespace" get ingress "$ingress" -o custom-columns='NAME:.metadata.name,HOSTS:.spec.rules[*].host,TLS:.spec.tls[*].secretName' --no-headers 2>/dev/null || true
              tls_names="$(kubectl -n "$namespace" get ingress "$ingress" -o jsonpath='{range .spec.tls[*]}{.secretName}{"\n"}{end}' 2>/dev/null || true)"
              if [ -n "$tls_names" ]; then
                while IFS= read -r tls_name; do
                  [ -n "$tls_name" ] || continue
                  check_object secret "$namespace" "$tls_name" || true
                done <<< "$tls_names"
              fi
            fi
          }
          check_service shopno-apps gitea gitea-data gitea-config gitea-secret gitea
          check_service shopno-apps owncast owncast-data owncast-config owncast-secret owncast
          check_service shopno-apps code-server code-server-data code-server-config code-server-secret code-server
          check_object secret shopno-apps code-server-litellm-key
          check_object configmap shopno-apps code-server-continue-config
          check_service shopno-monitoring loki loki-data loki-config loki-secret loki
          check_service shopno-platform interior-service interior-service-data interior-service-config interior-service-secret interior-service
          check_service shopno-platform license-service license-service-data license-service-config license-service-secret license-service
          check_service shopno-platform training-service training-service-data training-service-config training-service-secret training-service
          check_service shopno-platform android-cloud-controller "" android-cloud-controller-config android-cloud-turn-secret ""
          check_object secret shopno-platform ghcr-pull-secret
          echo "=== ANDROID CLOUD DEPLOYMENTS AND CONTROLLER RESTARTS (METADATA ONLY) ==="
          kubectl -n shopno-platform get deployments android-cloud-controller android-cloud-web -o custom-columns='NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,UPDATED:.status.updatedReplicas' || true
          kubectl -n shopno-platform get pods -l app.kubernetes.io/name=android-cloud-controller -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,PHASE:.status.phase,NODE:.spec.nodeName' || true
          kubectl -n shopno-platform get pods -l app.kubernetes.io/name=android-cloud-controller -o json 2>/dev/null | jq -r '.items[]? as $pod | $pod.status.containerStatuses[]? | [$pod.metadata.name, .name, (.restartCount|tostring), (.lastState.terminated.reason // "none"), ((.lastState.terminated.exitCode // -1)|tostring)] | @tsv' || true
          echo "=== ANDROID CLOUD SESSION RESOURCES AND EVENTS (NO LOGS OR SECRET VALUES) ==="
          kubectl -n shopno-android get pods,services,ingresses -o wide 2>&1 || true
          kubectl -n shopno-android get events --sort-by=.lastTimestamp 2>&1 | tail -n 40 || true
          kubectl -n shopno-platform get events --sort-by=.lastTimestamp 2>&1 | grep -Ei 'android-cloud|android-emulator|aemu-|agw-' | tail -n 40 || true
          kubectl -n shopno-android top pods --sort-by=memory 2>&1 || true
          check_service shopno-apps onlyoffice onlyoffice-data onlyoffice-config onlyoffice-secret onlyoffice
          check_object secret shopno-apps onlyoffice-tls
          echo "=== INTERIOR SERVICE POST-DEPLOYMENT VERIFICATION ==="
          kubectl -n shopno-platform get deployment interior-service -o custom-columns='NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,UPDATED:.status.updatedReplicas'
          kubectl -n shopno-platform get pods -l app.kubernetes.io/name=interior-service -o wide
          kubectl -n shopno-platform get endpoints interior-service -o wide
          if kubectl -n shopno-platform rollout status deployment/interior-service --timeout=120s; then
            echo "PASS: interior-service rollout is complete."
          else
            echo "BLOCKED: interior-service rollout is not complete; showing pod status and recent events."
            kubectl -n shopno-platform describe deployment interior-service || true
            kubectl -n shopno-platform get events --sort-by=.lastTimestamp | tail -n 40 || true
          fi
          echo "=== PUBLIC INTERIOR HEALTH ENDPOINTS ==="
          for path in healthz readyz; do
            code="$(curl -k -sS --connect-timeout 8 --max-time 15 -o /dev/null -w '%{http_code}' "https://interior.shopnoltd.dpdns.org/$path" 2>/dev/null || true)"
            echo "https://interior.shopnoltd.dpdns.org/$path -> HTTP ${code:-no-response}"
          done
      - name: Audit Keycloak social providers (metadata only; read-only)
        shell: bash
        run: |
          set -euo pipefail
          pf_log="${RUNNER_TEMP:-/tmp}/shopnoltd-keycloak-social-audit-port-forward.log"
          kubectl -n shopno-identity port-forward --address 127.0.0.1 svc/keycloak 18080:80 >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/realms/shopnoltd/.well-known/openid-configuration >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Keycloak is not reachable through the read-only port-forward."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, urllib.error, urllib.parse, urllib.request

          namespace = "shopno-identity"
          base = "http://127.0.0.1:18080"

          def read_secret(name):
              result = subprocess.run(
                  ["kubectl", "-n", namespace, "get", "secret", name, "-o", "json"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  return {}
              try:
                  return json.loads(result.stdout).get("data") or {}
              except Exception:
                  return {}

          social_data = read_secret("keycloak-social-providers")
          admin_data = read_secret("keycloak-secret")
          expected = {
              "google": ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"),
              "facebook": ("FACEBOOK_LOGIN_APP_ID", "FACEBOOK_LOGIN_APP_SECRET"),
              "github": ("GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET"),
          }
          print("Keycloak social Secret:")
          print("  exists:", "yes" if social_data else "no")
          for alias, keys in expected.items():
              count = sum(1 for key in keys if key in social_data)
              print(f"  {alias} credential key names: {count}/2 present (values not read)")
          password_b64 = admin_data.get("KC_BOOTSTRAP_ADMIN_PASSWORD")
          if not password_b64:
              print("BLOCKED: keycloak-secret/KC_BOOTSTRAP_ADMIN_PASSWORD is unavailable; provider list not queried.")
              sys.exit(1)
          password = base64.b64decode(password_b64).decode()
          form = urllib.parse.urlencode({
              "grant_type": "password",
              "client_id": "admin-cli",
              "username": "admin",
              "password": password,
          }).encode()
          token_req = urllib.request.Request(
              base + "/realms/master/protocol/openid-connect/token",
              data=form,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              with urllib.request.urlopen(token_req, timeout=15) as response:
                  token = json.loads(response.read()).get("access_token")
          except urllib.error.HTTPError as error:
              print(f"BLOCKED: Keycloak metadata authentication returned HTTP {error.code}; no credential values printed.")
              sys.exit(1)
          if not token:
              print("BLOCKED: Keycloak did not return an access token.")
              sys.exit(1)
          providers_req = urllib.request.Request(
              base + "/admin/realms/shopnoltd/identity-provider/instances",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(providers_req, timeout=15) as response:
                  providers = json.loads(response.read())
          except urllib.error.HTTPError as error:
              print(f"BLOCKED: Keycloak provider metadata returned HTTP {error.code}; no credential values printed.")
              sys.exit(1)
          configured = {
              item.get("alias"): {
                  "provider": item.get("providerId", "unknown"),
                  "enabled": bool(item.get("enabled")),
              }
              for item in providers if isinstance(item, dict)
          }
          print("Keycloak identity-provider state (metadata only):")
          summary = ["## Keycloak social provider audit", "", "| Provider | Keycloak state | Secret key names |", "|---|---|---|"]
          for alias, keys in expected.items():
              item = configured.get(alias)
              state = "enabled" if item and item["enabled"] else "present but disabled" if item else "not configured"
              key_count = sum(1 for key in keys if key in social_data)
              print(f"  {alias}: {state}")
              summary.append(f"| {alias} | {state} | {key_count}/2 present |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          print("Audit complete. No Secret values were read into logs, no Keycloak settings were changed.")
          PY

          echo "=== AUDIT SAFETY ==="
          echo "Read-only inventory only: no scale, apply, delete, rollout, secret values, or database contents were requested."
