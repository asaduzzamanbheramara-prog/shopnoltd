name: All-users login + functionality E2E (impersonation)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/all-users-functionality-e2e.yml'
      - 'tests/browser-role/all-users-e2e.spec.js'
  workflow_dispatch:
    inputs:
      limit_users:
        description: "Limit to first N users (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 3,15 * * *" # 09:00 and 21:00 Bangladesh time (UTC+6)

permissions:
  contents: read

jobs:
  e2e:
    name: All-users E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 360
    defaults:
      run:
        working-directory: tests/browser-role
    env:
      SHOPNOLTD_BASE_URL: https://shopnoltd.dpdns.org
      KEYCLOAK_BASE_URL: https://auth.shopnoltd.dpdns.org
      KEYCLOAK_REALM: shopnoltd
      AUTH_ROUTES: /dashboard,/profiles,/feed
      ADMIN_ROLE: platform_admin
      USER_SHARD_INDEX: ${{ matrix.shard }}
      USER_SHARD_COUNT: 4
      PER_USER_TIMEOUT_MS: 120000

      LIMIT_USERS: ${{ github.event.inputs.limit_users }}
      KEYCLOAK_E2E_CLIENT_ID: ${{ secrets.KEYCLOAK_E2E_CLIENT_ID }}
      KEYCLOAK_E2E_CLIENT_SECRET: ${{ secrets.KEYCLOAK_E2E_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYCLOAK_E2E_CLIENT_ID:-}" || -z "${KEYCLOAK_E2E_CLIENT_SECRET:-}" ]]; then
            echo "::error::Configure KEYCLOAK_E2E_CLIENT_ID and KEYCLOAK_E2E_CLIENT_SECRET in repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all-users E2E
        run: npx playwright test all-users-e2e.spec.js --workers=1

      - name: Upload report
        if: always() && hashFiles('tests/browser-role/reports/all-users-e2e-shard-${{ matrix.shard }}.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: all-users-e2e-report-shard-${{ matrix.shard }}
          path: tests/browser-role/reports/all-users-e2e-shard-${{ matrix.shard }}.csv
          retention-days: 1
