name: Isolated PostgreSQL backup restore test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: isolated-postgres-restore-test
  cancel-in-progress: false

jobs:
  restore:
    name: Restore all databases in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-postgres-combined:pg16-postgis3.5-pgvector0.8.6
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: restore_admin_${{ github.run_id }}
          POSTGRES_PASSWORD: restore-only-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_admin_${{ github.run_id }} -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout encrypted backup branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPOSITORY }}
          token: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          ref: database-backups
          path: backup-source
          fetch-depth: 1
          persist-credentials: false

      - name: Decrypt and extract latest backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd backup-source/backup
          for file in timestamp.txt latest.dump.enc latest.dump.enc.sha256 latest.dump.enc.hmac latest.all-databases.tar.gz.enc latest.all-databases.tar.gz.enc.sha256 latest.all-databases.tar.gz.enc.hmac latest.kubernetes-secrets.json.enc latest.kubernetes-secrets.json.enc.sha256 latest.kubernetes-secrets.json.enc.hmac; do
            test -s "$file" || { echo "::error::Required encrypted database backup is missing: $file"; exit 1; }
          done
          timestamp="$(tr -d '\r\n' < timestamp.txt)"
          [[ "$timestamp" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::Invalid backup timestamp."; exit 1; }
          iso="${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2}T${timestamp:9:2}:${timestamp:11:2}:${timestamp:13:2}Z"
          age=$(( $(date -u +%s) - $(date -u -d "$iso" +%s) ))
          (( age >= 0 && age <= 172800 )) || { echo "::error::Backup is future-dated or older than 48 hours."; exit 1; }
          sha256sum -c latest.dump.enc.sha256
          sha256sum -c latest.all-databases.tar.gz.enc.sha256
          sha256sum -c latest.kubernetes-secrets.json.enc.sha256
          python3 "$GITHUB_WORKSPACE/ops/backup/authenticated_backup.py" verify latest.dump.enc latest.all-databases.tar.gz.enc latest.kubernetes-secrets.json.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.dump.enc -out "$RUNNER_TEMP/shopnoltd-primary.dump" \
            -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.all-databases.tar.gz.enc \
            -out "$RUNNER_TEMP/shopnoltd-all-databases.tar.gz" \
            -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.kubernetes-secrets.json.enc \
            -out "$RUNNER_TEMP/shopnoltd-secrets.json" \
            -pass env:BACKUP_ENCRYPTION_KEY
          mkdir -p "$RUNNER_TEMP/shopnoltd-restore-source"
          tar -xzf "$RUNNER_TEMP/shopnoltd-all-databases.tar.gz" -C "$RUNNER_TEMP/shopnoltd-restore-source"
          test -s "$RUNNER_TEMP/shopnoltd-restore-source/globals.sql"
          test -s "$RUNNER_TEMP/shopnoltd-restore-source/database-list.txt"
          echo "PASS: encrypted database and Secret exports authenticated, decrypted and extracted on the disposable GitHub-hosted runner."

      - name: Restore Kubernetes Secrets into a disposable kind cluster
        shell: bash
        run: |
          set -euo pipefail
          bash ops/backup/restore-kubernetes-secrets-isolated.sh "$RUNNER_TEMP/shopnoltd-secrets.json"

      - name: Restore roles and all database archives with PostgreSQL 16 tools
        shell: bash
        env:
          PGUSER: restore_admin_${{ github.run_id }}
          PGPASSWORD: restore-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PGPASSWORD"
          source_dir="$RUNNER_TEMP/shopnoltd-restore-source"
          dumps_dir="$source_dir/all-databases"
          database_list="$source_dir/database-list.txt"
          test -d "$dumps_dir"

          image='ghcr.io/asaduzzamanbheramara-prog/shopnoltd-postgres-combined:pg16-postgis3.5-pgvector0.8.6'
          container_id="$(docker ps --filter "ancestor=$image" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id" || { echo "::error::Disposable PostgreSQL service container was not found."; exit 1; }

          client_version="$(docker exec "$container_id" pg_restore --version)"
          echo "Using matching restore client: $client_version"
          [[ "$client_version" == *"16."* ]] || { echo "::error::Restore client must match PostgreSQL 16."; exit 1; }
          docker exec "$container_id" pg_isready -U "$PGUSER" -d postgres
          docker cp "$source_dir" "$container_id:/tmp/"
          restore_dir=/tmp/shopnoltd-restore-source

          # The service container is disposable and isolated from production.
          docker exec --user root -e PGPASSWORD="$PGPASSWORD" "$container_id" \
            psql -U "$PGUSER" --dbname=postgres --set ON_ERROR_STOP=1 \
            --file "$restore_dir/globals.sql" >/dev/null

          restored=0
          while IFS= read -r database; do
            [[ -n "$database" ]] || continue
            [[ "$database" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Unsafe database name in backup inventory."; exit 1; }
            dump="$restore_dir/all-databases/$database.dump"
            docker exec --user root "$container_id" test -s "$dump" || { echo "::error::A listed database archive is missing."; exit 1; }
            docker exec --user root -e PGPASSWORD="$PGPASSWORD" "$container_id" \
              pg_restore --exit-on-error --clean --if-exists --create \
              --username="$PGUSER" --dbname=template1 "$dump"
            restored=$((restored + 1))
          done < "$database_list"

          listed="$(grep -cve '^$' "$database_list")"
          [[ "$restored" -eq "$listed" && "$restored" -gt 0 ]] || { echo "::error::Not every database archive was restored."; exit 1; }

          verified=0
          while IFS= read -r database; do
            [[ -n "$database" ]] || continue
            actual="$(docker exec --user root -e PGPASSWORD="$PGPASSWORD" "$container_id" \
              psql -U "$PGUSER" --dbname="$database" --tuples-only --no-align \
              --set ON_ERROR_STOP=1 --command='SELECT current_database()')"
            [[ "$actual" == "$database" ]] || { echo "::error::A restored database failed its connection check."; exit 1; }
            verified=$((verified + 1))
          done < "$database_list"

          echo "PASS: restored and connected to all $verified databases in the disposable PostgreSQL 16 instance."
          echo "PASS: production PostgreSQL and Kubernetes Secrets were not accessed or modified by this restore job."
          docker cp "$RUNNER_TEMP/shopnoltd-primary.dump" "$container_id:/tmp/shopnoltd-primary.dump"
          docker exec --user root -e PGPASSWORD="$PGPASSWORD" "$container_id" createdb --username="$PGUSER" --template=template0 primary_dump_validation
          docker exec --user root -e PGPASSWORD="$PGPASSWORD" "$container_id" pg_restore --exit-on-error --no-owner --no-acl --username="$PGUSER" --dbname=primary_dump_validation /tmp/shopnoltd-primary.dump
          echo "PASS: independent primary PostgreSQL dump restored into disposable instance."
          docker exec --user root "$container_id" rm -rf "$restore_dir"

      - name: Remove decrypted backup material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shopnoltd-primary.dump" "$RUNNER_TEMP/shopnoltd-all-databases.tar.gz" "$RUNNER_TEMP/shopnoltd-secrets.json" "$RUNNER_TEMP/secrets-import.json" "$RUNNER_TEMP/namespaces.txt" "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl"
          rm -rf "$RUNNER_TEMP/shopnoltd-restore-source"
          kind delete cluster --name shopnoltd-recovery >/dev/null 2>&1 || true
