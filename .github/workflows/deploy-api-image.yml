name: Build and pin api-service

on:
  push:
    branches: [main]
    paths:
      - 'platform/api-service/**'
      - 'shared/**'
      - '.github/workflows/deploy-api-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/api-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api-service
          cache-to: type=gha,mode=max,scope=api-service

      - name: Pin GitOps deployment to this commit image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('k8s/services/api-service/deployment.yaml')
          s = p.read_text()
          old = 'image: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service:latest'
          new = 'image: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service:${{ github.sha }}'
          if old not in s:
              raise SystemExit('api-service image reference was not in expected latest form')
          p.write_text(s.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/services/api-service/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): pin api-service image to $GITHUB_SHA"
          git push origin HEAD:main
