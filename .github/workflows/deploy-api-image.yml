name: Manual API image validation

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing api-service image tag to validate in GHCR
        required: true
        default: latest

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service

jobs:
  validate:
    name: Validate published api-service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and validate ASGI application
        env:
          TAG: ${{ inputs.image_tag }}
          DATABASE_URL: postgresql+asyncpg://validation:validation@127.0.0.1:5432/validation
          REDIS_URL: redis://127.0.0.1:6379/0
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}:${TAG}"
          docker pull "$image"
          size="$(docker run --rm --entrypoint /bin/sh "$image" -c 'wc -c < /app/app/main.py')"
          test "$size" -gt 0
          docker run --rm --entrypoint /usr/local/bin/python \
            -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" "$image" -c \
            'import app.main; assert hasattr(app.main, "app"); print(app.main.__file__)'
          docker run --rm --entrypoint /usr/local/bin/python "$image" -m uvicorn app.main:app --help >/dev/null
          echo "API image validation PASSED for $image"
