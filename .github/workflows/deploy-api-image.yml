name: Build and pin api-service

on:
  push:
    branches: [main]
    paths:
      - 'platform/api-service/**'
      - 'shared/**'
      - '.github/workflows/deploy-api-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-service without cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/api-service/Dockerfile
          load: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Verify image contents and ASGI application
        env:
          DATABASE_URL: postgresql+asyncpg://validation:validation@127.0.0.1:5432/validation
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          set -euo pipefail

          IMAGE="${{ env.IMAGE }}:${{ github.sha }}"

          echo "Checking /app/app/main.py..."
          SIZE="$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'wc -c < /app/app/main.py')"
          echo "main.py size: ${SIZE} bytes"
          test "$SIZE" -gt 0

          echo "Checking Python import..."
          docker run --rm \
            --entrypoint /usr/local/bin/python \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            "$IMAGE" -c '
          import app.main
          assert app.main.__file__ == "/app/app/main.py", app.main.__file__
          assert hasattr(app.main, "app"), "FastAPI app object missing"
          print("app.main:", app.main.__file__)
          print("FastAPI app:", app.main.app)
          '

          echo "Checking Uvicorn import target..."
          docker run --rm \
            --entrypoint /usr/local/bin/python \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            "$IMAGE" -m uvicorn app.main:app --help >/dev/null
          echo "API image validation PASSED"

      - name: Push verified image
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Pin GitOps deployment to this commit image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('k8s/services/api-service/deployment.yaml')
          s = p.read_text()
          old = 'image: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service:latest'
          new = 'image: ghcr.io/${{ github.repository_owner }}/shopnoltd/api-service:${{ github.sha }}'
          if old not in s:
              raise SystemExit('api-service image reference was not in expected latest form')
          p.write_text(s.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/services/api-service/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): pin api-service image to $GITHUB_SHA"
          git push origin HEAD:main
