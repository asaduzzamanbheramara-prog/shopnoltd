name: Provisioning Regression Tests

on:
  pull_request:
    paths:
      - "platform/mail-service/**"
      - "platform/oauth-service/**"
      - ".github/workflows/mail-service-tests.yml"
  push:
    branches:
      - main
      - "feat/automatic-user-domain-mailbox-provisioning"
    paths:
      - "platform/mail-service/**"
      - "platform/oauth-service/**"
      - ".github/workflows/mail-service-tests.yml"

permissions:
  contents: read

jobs:
  mailbox-security-tests:
    name: Mailbox security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: shared/libraries/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/mail-service/requirements.txt
      - name: Install mail-service dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/mail-service/requirements.txt pytest==8.4.1
      - name: Run mailbox security tests
        run: python -m pytest -q platform/mail-service/tests/test_mailboxes_security.py platform/mail-service/tests/test_mail_domains_provisioning.py

  oauth-provisioning-tests:
    name: OAuth provisioning outbox and PostgreSQL migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provisioning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provisioning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: shared/libraries/python
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/provisioning_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/oauth-service/requirements.txt
      - name: Install OAuth service dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/oauth-service/requirements.txt pytest==8.4.1
      - name: Run provisioning outbox tests
        working-directory: platform/oauth-service
        run: python -m pytest -q tests/test_account_provisioning_jobs.py tests/test_provisioning_migration.py tests/test_account_provisioning_status.py tests/test_provisioning_worker_contract.py
