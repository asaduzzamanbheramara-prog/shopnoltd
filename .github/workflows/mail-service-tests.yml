name: Mail Service Tests

on:
  pull_request:
    paths:
      - "platform/mail-service/**"
      - ".github/workflows/mail-service-tests.yml"
  push:
    branches:
      - main
      - "feat/automatic-user-domain-mailbox-provisioning"
    paths:
      - "platform/mail-service/**"
      - ".github/workflows/mail-service-tests.yml"

permissions:
  contents: read

jobs:
  mailbox-security-tests:
    name: Mailbox security regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: shared/libraries/python
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/mail-service/requirements.txt
      - name: Install mail-service dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/mail-service/requirements.txt pytest==8.4.1
      - name: Run mailbox security tests
        run: python -m pytest -q platform/mail-service/tests/test_mailboxes_security.py
