name: Post-deployment smoke

on:
  workflow_run:
    workflows: ["Build and promote platform images"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/post-deployment-smoke.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: post-deployment-smoke-main
  cancel-in-progress: false

env:
  ATTEMPTS: "20"
  DELAY_SECONDS: "15"

jobs:
  wait-for-gitops:
    name: Wait for matching GitOps reconciliation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Dispatch reconciliation when explicitly requested or when only this workflow changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            dispatch=1
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            after="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"
            changed=""
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && [ -n "$after" ] && [ "$before" != "$after" ]; then
              changed="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/compare/$before...$after" | jq -r '.files[]?.filename // empty')"
            fi
            if ! grep -Eq '^(k8s/|platform/|services/|\.github/workflows/self-hosted-k3s-gitops\.yml$)' <<<"$changed"; then
              dispatch=1
            fi
          fi
          if [ "$dispatch" -eq 1 ]; then
            gh workflow run self-hosted-k3s-gitops.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'Dispatched GitOps reconciliation.'
          else
            echo 'A push-triggered GitOps run is expected; waiting for that run rather than dispatching a duplicate.'
          fi

      - name: Wait for successful reconciliation of the expected revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='self-hosted-k3s-gitops.yml'
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$(jq -r '.workflow_run.name' "$GITHUB_EVENT_PATH")" = "Shopnoltd Self-Hosted K3s GitOps" ]; then
            expected_sha="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            expected_sha="$GITHUB_SHA"
          else
            expected_sha="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fi
          test -n "$expected_sha"
          echo "Waiting for GitOps reconciliation at revision $expected_sha"
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=""
            for api_attempt in 1 2 3 4 5; do
              if response="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=50" 2>/tmp/shopnoltd-gh-api-error.json)"; then
                break
              fi
              echo "GitHub Actions API request failed (attempt $api_attempt/5); retrying."
              if [ "$api_attempt" -lt 5 ]; then sleep "$((api_attempt * 2))"; fi
            done
            if [ -z "$response" ]; then
              echo "GitHub Actions API unavailable; retrying reconciliation poll in 15 seconds."
              sleep 15
              continue
            fi
            runs="$(jq -r --arg sha "$expected_sha" '[.workflow_runs[]? | select(.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | reverse | .[0] // empty' <<<"$response")"
            if [ -n "$runs" ]; then
              run_id="$(jq -r '.id' <<<"$runs")"
              status="$(jq -r '.status' <<<"$runs")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$runs")"
              echo "GitOps run=$run_id revision=$expected_sha status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            else
              echo "Waiting for GitOps run for $expected_sha"
            fi
            sleep 15
          done
          echo "Timed out waiting for GitOps reconciliation at $expected_sha"
          exit 1

  verify-required-services:
    needs: [wait-for-gitops]
    name: Verify ${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            url: https://shopnoltd.dpdns.org
            mode: web
          - name: services
            url: https://shopnoltd.dpdns.org/services
            mode: web
          - name: website-builder
            url: https://shopnoltd.dpdns.org/create-website?type=hr
            mode: web
          - name: api
            url: https://api.shopnoltd.dpdns.org/healthz
            mode: health
          - name: auth
            url: https://auth.shopnoltd.dpdns.org
            mode: web
          - name: ai
            url: https://ai-platform.shopnoltd.dpdns.org/healthz
            mode: health
          - name: billing
            url: https://billing.shopnoltd.dpdns.org/health
            mode: health
          - name: payment-ui
            url: https://payment.shopnoltd.dpdns.org
            mode: web
          - name: payment-backend
            url: https://payment-service.shopnoltd.dpdns.org/healthz
            mode: health
          - name: exchange-ui
            url: https://exchange.shopnoltd.dpdns.org
            mode: web
          - name: exchange-backend
            url: https://exchange-service.shopnoltd.dpdns.org/healthz
            mode: health
          - name: domain
            url: https://domain.shopnoltd.dpdns.org/healthz
            mode: health
          - name: devices
            url: https://devices.shopnoltd.dpdns.org
            mode: web
          - name: android-cloud
            url: https://android.shopnoltd.dpdns.org
            mode: web
          - name: chat
            url: https://chat.shopnoltd.dpdns.org
            mode: web
          - name: social
            url: https://social.shopnoltd.dpdns.org/healthz
            mode: health
          - name: vpn
            url: https://vpn.shopnoltd.dpdns.org/healthz
            mode: health
    steps:
      - name: Wait for Argo CD reconciliation window
        shell: bash
        run: sleep 90

      - name: Poll endpoint until healthy
        shell: bash
        env:
          CHECK_URL: ${{ matrix.url }}
          CHECK_MODE: ${{ matrix.mode }}
          CHECK_NAME: ${{ matrix.name }}
        run: |
          set -u
          for attempt in $(seq 1 "$ATTEMPTS"); do
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --output "$tmp" --write-out '%{http_code}' "$CHECK_URL" || true)"

            if [ "$CHECK_MODE" = "health" ]; then
              ok=0
              case "$code" in
                2??) ok=1 ;;
              esac
            else
              ok=0
              case "$code" in
                2??|3??|401|403) ok=1 ;;
              esac
            fi

            if [ "$ok" -eq 1 ]; then
              echo "PASS: $CHECK_NAME -> HTTP $code (attempt $attempt)"
              rm -f "$tmp"
              exit 0
            fi

            echo "WAIT: $CHECK_NAME -> HTTP $code (attempt $attempt/$ATTEMPTS)"
            if [ -s "$tmp" ]; then
              head -c 500 "$tmp" | tr '\n' ' ' || true
              echo
            fi
            rm -f "$tmp"

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep "$DELAY_SECONDS"
            fi
          done

          echo "FAIL: $CHECK_NAME did not become healthy: $CHECK_URL"
          exit 1

  deployment-verification:
    name: Deployment verification gate
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    needs: [verify-required-services]
    runs-on: ubuntu-latest
    steps:
      - name: Require all essential public services to pass
        shell: bash
        run: |
          if [ "${{ needs.verify-required-services.result }}" != "success" ]; then
            echo "Post-deployment verification FAILED: one or more required services are unhealthy."
            exit 1
          fi
          echo "Post-deployment verification PASSED: all required public services are healthy."
