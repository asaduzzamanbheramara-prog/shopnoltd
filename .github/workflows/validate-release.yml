name: Validate release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-portal:
    name: Build web portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/web-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes resource YAML
        run: |
          find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) \
            ! -path '*/patches/*' \
            ! -name '*-patch.yaml' \
            ! -name '*-patch.yml' \
            -print0 \
            | xargs -0 -r kubeconform -strict -ignore-missing-schemas -summary
      - name: Validate Kustomize overlays
        run: |
          if [ -d k8s/overlays ]; then
            find k8s/overlays -name kustomization.yaml -print0 | while IFS= read -r -d '' k; do
              dir="$(dirname "$k")"
              echo "Validating Kustomize overlay: $dir"
              kubectl kustomize "$dir" >/tmp/kustomize-rendered.yaml
              kubeconform -strict -ignore-missing-schemas -summary /tmp/kustomize-rendered.yaml
            done
          fi

  android-reference:
    name: Validate Android integration references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Android Cloud main-domain integration
        run: |
          grep -F "['Android Cloud', '/android-cloud']" platform/web-portal/src/main.jsx
          grep -F 'base: "/android-cloud/"' platform/android-cloud/web/vite.config.js
          grep -F 'REDIRECT_URI = `${window.location.origin}/android-cloud/callback`' platform/android-cloud/web/src/main.jsx
          grep -F 'android-cloud-web' k8s/services/web-portal/ingress.yaml
          grep -F 'path: /android-cloud' k8s/services/web-portal/ingress.yaml
