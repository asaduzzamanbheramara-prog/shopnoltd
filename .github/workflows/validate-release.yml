name: Validate release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-portal:
    name: Build web portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/web-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate YAML manifests
        run: |
          find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 -r kubeconform -strict -ignore-missing-schemas -summary

  android-reference:
    name: Validate Android integration references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Android Cloud navigation
        run: |
          grep -F 'devices.shopnoltd.dpdns.org' platform/web-portal/src/main.jsx
          grep -F 'Android Cloud' platform/web-portal/src/main.jsx
