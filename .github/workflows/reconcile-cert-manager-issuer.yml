name: Reconcile cert-manager ClusterIssuer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reconcile-cert-manager-issuer.yml'
      - 'k8s/cert-manager/letsencrypt-prod-issuer.yaml'

permissions:
  contents: read

concurrency:
  group: cert-manager-issuer-reconcile
  cancel-in-progress: false

jobs:
  reconcile-issuer:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify cluster and cert-manager without changing workloads
        shell: bash
        run: |
          set -euo pipefail
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          kubectl --request-timeout=20s cluster-info

          echo "Checking node memory headroom before installing cert-manager."
          kubectl top nodes --no-headers | awk '
            {
              usage=$5
              gsub(/%/, "", usage)
              if (usage + 0 >= 90) {
                printf "BLOCKED: node %s memory usage is %s%% (limit 90%%).\\n", $1, usage
                blocked=1
              }
            }
            END { if (blocked) exit 1 }
          '

          if ! kubectl get crd clusterissuers.cert-manager.io >/dev/null 2>&1; then
            echo "cert-manager CRD is missing; installing the repository-pinned v1.15.3 release."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
          else
            echo "cert-manager CRD already exists; preserving the current installation."
          fi

          kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=180s
          for deployment in cert-manager cert-manager-cainjector cert-manager-webhook; do
            kubectl -n cert-manager rollout status "deployment/$deployment" --timeout=180s
          done

      - name: Apply only the production ClusterIssuer
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for cert-manager CA injector to populate webhook trust bundles."
          for configuration in mutatingwebhookconfiguration/cert-manager-webhook validatingwebhookconfiguration/cert-manager-webhook; do
            ready=0
            for attempt in {1..24}; do
              if kubectl get "$configuration" -o json |
                jq -e '(.webhooks | length) > 0 and all(.webhooks[]; ((.clientConfig.caBundle // "") | length) > 0)' >/dev/null; then
                ready=1
                break
              fi
              sleep 5
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "ERROR: CA bundle was not injected into $configuration."
              kubectl get "$configuration" -o json |
                jq -r '.webhooks[] | [.name, ((.clientConfig.caBundle // "") | length)] | @tsv'
              exit 1
            fi
          done

          applied=0
          for attempt in {1..6}; do
            if kubectl apply --dry-run=server -f k8s/cert-manager/letsencrypt-prod-issuer.yaml &&
              kubectl apply -f k8s/cert-manager/letsencrypt-prod-issuer.yaml; then
              applied=1
              break
            fi
            echo "Issuer admission attempt $attempt/6 failed; retrying after webhook readiness check."
            sleep 10
          done
          if [[ "$applied" -ne 1 ]]; then
            echo "ERROR: ClusterIssuer could not be admitted after webhook CA injection retries."
            exit 1
          fi
          kubectl wait --for=condition=Ready clusterissuer/letsencrypt-prod --timeout=180s

      - name: Verify platform certificate issuance
        shell: bash
        run: |
          set -euo pipefail
          namespace=shopno-platform
          expected=(license-service-tls training-service-tls interior-service-tls)
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            all_ready=1
            for secret in "${expected[@]}"; do
              if ! kubectl -n "$namespace" get certificate "$secret" >/dev/null 2>&1; then
                all_ready=0
                continue
              fi
              ready="$(kubectl -n "$namespace" get certificate "$secret" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
              if [[ "$ready" != "True" ]]; then all_ready=0; fi
            done
            if (( all_ready == 1 )); then break; fi
            sleep 15
          done

          echo "ClusterIssuer:"
          kubectl get clusterissuer letsencrypt-prod
          echo "Certificate readiness (no secret data is displayed):"
          kubectl -n "$namespace" get certificates "${expected[@]}" -o custom-columns=NAME:.metadata.name,READY:.status.conditions[-1].status,REASON:.status.conditions[-1].reason --ignore-not-found
          echo "TLS Secret existence:"
          for secret in "${expected[@]}"; do
            if kubectl -n "$namespace" get secret "$secret" >/dev/null 2>&1; then
              echo "PASS Secret $namespace/$secret exists"
            else
              echo "BLOCKED Secret $namespace/$secret is still missing"
            fi
          done

          missing=0
          for secret in "${expected[@]}"; do
            kubectl -n "$namespace" get secret "$secret" >/dev/null 2>&1 || missing=1
          done
          if (( missing != 0 )); then
            echo "Certificate issuance is not complete. Inspect Certificate/Order/Challenge events before further changes."
            kubectl -n "$namespace" get certificates,certificaterequests,orders,challenges
            exit 1
          fi
