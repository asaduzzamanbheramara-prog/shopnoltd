name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o /tmp/kustomize.tar.gz && tar -xzf /tmp/kustomize.tar.gz -C /tmp; then
              sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to download kustomize after 3 attempts"
              exit 1
            fi
            echo "kustomize download failed on attempt $attempt; retrying in 10 seconds..."
            rm -f /tmp/kustomize.tar.gz /tmp/kustomize
            sleep 10
          done
          kustomize version
      - name: Validate
        run: ./scripts/validate-all.sh
  lint-yaml:
    name: Lint canonical YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install --break-system-packages yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable, indentation: disable, empty-lines: disable, colons: disable, commas: disable}}" \
            .github/workflows \
            k8s/services \
            k8s/argocd \
            k8s/overlays \
            k8s/system
