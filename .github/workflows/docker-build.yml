# Disabled legacy build matrix.
# The former workflow built every image on every push and contained stale
# paths such as ai-platform/backend that do not exist in this repository.
# Automatic production image build/promotion is now handled by
# .github/workflows/build-platform.yml with affected-service detection.

name: "[DISABLED] Legacy Docker Build Matrix"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement pipeline
        run: |
          echo 'Legacy docker-build.yml is intentionally disabled.'
          echo 'Use build-platform.yml for affected-service GHCR builds and GitOps image promotion.'
          echo 'Android Cloud has its dedicated CI workflow.'
