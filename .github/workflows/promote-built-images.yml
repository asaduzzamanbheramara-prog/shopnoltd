name: Promote built images

on:
  workflow_run:
    workflows: ["Build platform images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-built-images
  cancel-in-progress: false

env:
  REGISTRY_PREFIX: ghcr.io/asaduzzamanbheramara-prog/shopnoltd

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Promote image tags in Kubernetes manifests
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          prefix = os.environ["REGISTRY_PREFIX"]
          services = {
              "domain-service", "interior-service", "event-service", "foundation-service",
              "training-service", "freedomain-service", "api-service", "gateway", "oauth-service",
              "tenant-router", "analytics-service", "storage-service", "notification-service",
              "scheduler-service", "worker-service", "payment-service", "exchange-service", "auth-service",
              "audit-service", "report-service", "license-service", "mobile-api", "ai-platform",
              "admin-portal", "web-portal", "android-portal", "messaging-service", "meet-service",
              "live-service", "mail-service", "social-service", "keycloak", "session-manager", "vpn-service",
          }

          pattern = re.compile(rf"({re.escape(prefix)}/(?P<service>[A-Za-z0-9._-]+)):[^\s\"']+")
          changed = []
          for path in Path("k8s").rglob("*.yaml"):
              text = path.read_text()
              def replace(match):
                  service = match.group("service")
                  if service in services:
                      return f"{match.group(1)}:{sha}"
                  return match.group(0)
              new_text = pattern.sub(replace, text)
              if new_text != text:
                  path.write_text(new_text)
                  changed.append(str(path))

          print(f"Promoted source SHA: {sha}")
          print("Changed manifests:")
          for item in changed:
              print(f" - {item}")
          if not changed:
              print("No matching pinned images required an update.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PROMOTION_CHANGED=" + ("true" if changed else "false") + "\n")
          PY

      - name: Commit and push manifest promotion
        if: env.PROMOTION_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s
          git commit -m "ci: promote images for ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}"
          git push origin HEAD:main
