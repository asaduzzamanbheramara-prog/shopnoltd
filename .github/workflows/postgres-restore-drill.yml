name: Shopnoltd isolated PostgreSQL restore drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/postgres-restore-drill.yml
      - ops/backup/**

permissions:
  contents: read

concurrency:
  group: shopnoltd-isolated-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore encrypted snapshot into disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restore_drill
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_drill -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source and restore verifier
        uses: actions/checkout@v4

      - name: Verify backup access configuration
        shell: bash
        env:
          BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
          BACKUP_REPOSITORY_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_REPOSITORY:-}" || { echo "::error::BACKUP_REPOSITORY is missing."; exit 1; }
          test -n "${BACKUP_REPOSITORY_TOKEN:-}" || { echo "::error::BACKUP_REPOSITORY_TOKEN is missing."; exit 1; }
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          [[ "$BACKUP_REPOSITORY" != "$GITHUB_REPOSITORY" ]] || { echo "::error::Refusing to use the source repository as backup."; exit 1; }
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          echo "PASS: restore target is an ephemeral GitHub Actions PostgreSQL 17 service, not production."

      - name: Fetch latest encrypted snapshot from private backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
        run: |
          set -euo pipefail
          gh repo clone "$BACKUP_REPOSITORY" "$RUNNER_TEMP/shopnoltd-backup" \
            -- --branch database-backups --single-branch --depth 1
          test -s "$RUNNER_TEMP/shopnoltd-backup/backup/latest.dump.enc"
          test -s "$RUNNER_TEMP/shopnoltd-backup/backup/latest.dump.enc.sha256"
          test -s "$RUNNER_TEMP/shopnoltd-backup/backup/latest.dump.enc.hmac"

      - name: Verify integrity and decrypt database snapshot
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd "$RUNNER_TEMP/shopnoltd-backup/backup"
          sha256sum -c latest.dump.enc.sha256
          python3 "$GITHUB_WORKSPACE/ops/backup/authenticated_backup.py" verify latest.dump.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.dump.enc -out "$RUNNER_TEMP/shopnoltd-restore.dump" \
            -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$RUNNER_TEMP/shopnoltd-restore.dump"
          pg_restore --list "$RUNNER_TEMP/shopnoltd-restore.dump" > "$RUNNER_TEMP/restore-toc.txt"
          grep -q "TABLE DATA" "$RUNNER_TEMP/restore-toc.txt"

      - name: Restore with matching PostgreSQL 17 tools and validate
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER" || { echo "::error::Disposable PostgreSQL 17 container not found."; exit 1; }
          docker exec "$PG_CONTAINER" pg_restore --version
          docker cp "$RUNNER_TEMP/shopnoltd-restore.dump" "$PG_CONTAINER:/tmp/shopnoltd-restore.dump"
          docker exec "$PG_CONTAINER" psql -U restore_drill -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE shopnoltd_restore_drill'
          docker exec "$PG_CONTAINER" pg_restore --exit-on-error --no-owner --no-acl \
            --dbname=shopnoltd_restore_drill /tmp/shopnoltd-restore.dump
          table_count="$(docker exec "$PG_CONTAINER" psql -U restore_drill -d shopnoltd_restore_drill -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_type='BASE TABLE'")"
          [[ "$table_count" =~ ^[0-9]+$ ]] && (( table_count > 0 )) || {
            echo "::error::Restore completed but no user tables were found."; exit 1;
          }
          docker exec "$PG_CONTAINER" psql -U restore_drill -d shopnoltd_restore_drill -v ON_ERROR_STOP=1 -c \
            "SELECT current_database() AS restored_database, count(*) AS restored_tables FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_type='BASE TABLE'"
          docker exec "$PG_CONTAINER" rm -f /tmp/shopnoltd-restore.dump
          echo "PASS: isolated PostgreSQL 17 restore validated with $table_count user tables."

      - name: Remove decrypted snapshot and temporary clone
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/shopnoltd-restore.dump" "$RUNNER_TEMP/restore-toc.txt"
          rm -rf "$RUNNER_TEMP/shopnoltd-backup"
