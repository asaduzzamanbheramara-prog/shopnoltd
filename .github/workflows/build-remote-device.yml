name: Build Remote Device Gateway

on:
  push:
    branches:
      - main
      - feature/remote-device-agent
      - feature/direct-pc-executor-20260902
    paths:
      - 'platform/remote-device/gateway/**'
      - 'k8s/services/remote-device/deployment.yaml'
      - '.github/workflows/build-remote-device.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shopnoltd-remote-device-gateway

jobs:
  build:
    name: Build remote-device-gateway
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./platform/remote-device/gateway
          file: ./platform/remote-device/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image reference
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("k8s/services/remote-device/deployment.yaml")
          text = p.read_text()

          image = os.environ["IMAGE"]

          pattern = (
              r'(?m)^([ \t]+image:) '
              r'ghcr\.io/asaduzzamanbheramara-prog/'
              r'shopnoltd-remote-device-gateway:[^\n]+$'
          )

          updated, count = re.subn(
              pattern,
              rf'\1 {image}',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one remote-device-gateway image reference"
              )

          p.write_text(updated)
          PY

          git diff --check
          git diff -- k8s/services/remote-device/deployment.yaml

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/services/remote-device/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps image change required."
            exit 0
          fi

          git commit             -m "chore: update remote-device-gateway image to ${GITHUB_SHA} [skip ci]"

          git push origin HEAD:${GITHUB_REF_NAME}
