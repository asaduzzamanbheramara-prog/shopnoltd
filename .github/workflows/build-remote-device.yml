name: Build Remote Device Gateway

on:
  push:
    branches:
      - main
      - feature/remote-device-agent
    paths:
      - 'platform/remote-device/gateway/**'
      - 'k8s/services/remote-device/deployment.yaml'
      - '.github/workflows/build-remote-device.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shopnoltd-remote-device-gateway

jobs:
  build:
    name: Build remote-device-gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./platform/remote-device/gateway
          file: ./platform/remote-device/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
