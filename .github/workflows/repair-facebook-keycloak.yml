name: Repair Facebook Keycloak Identity Provider

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-facebook-provider:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify runner and cluster access
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v jq
          command -v curl
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          kubectl --request-timeout=20s cluster-info >/dev/null

      - name: Preserve provider settings and add Facebook credentials
        shell: bash
        env:
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.SHOPNOLTD_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SHOPNOLTD_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${FACEBOOK_APP_SECRET:-}" || { echo 'FACEBOOK_APP_SECRET is not configured.' >&2; exit 1; }
          test -n "${GOOGLE_CLIENT_SECRET:-}" || { echo 'GOOGLE_CLIENT_SECRET is not configured.' >&2; exit 1; }
          test -n "${GITHUB_CLIENT_ID:-}" || { echo 'GITHUB_CLIENT_ID is not configured.' >&2; exit 1; }
          test -n "${GITHUB_CLIENT_SECRET:-}" || { echo 'GITHUB_CLIENT_SECRET is not configured.' >&2; exit 1; }
          existing="$(kubectl -n shopno-identity get secret keycloak-social-providers -o json 2>/dev/null || printf '%s' '{"apiVersion":"v1","kind":"Secret","metadata":{}}')"
          facebook_app_id_b64="$(printf '%s' '1239063184913011' | base64 -w0)"
          facebook_app_secret_b64="$(printf '%s' "$FACEBOOK_APP_SECRET" | base64 -w0)"
          google_client_id_b64="$(printf '%s' '530228436303-2k8sl5mdjfotsvkcqgtcktcb7q2b78fn.apps.googleusercontent.com' | base64 -w0)"
          google_client_secret_b64="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | base64 -w0)"
          github_client_id_b64="$(printf '%s' "$GITHUB_CLIENT_ID" | base64 -w0)"
          github_client_secret_b64="$(printf '%s' "$GITHUB_CLIENT_SECRET" | base64 -w0)"
          printf '%s' "$existing" |
            jq --arg facebook_app_id "$facebook_app_id_b64" --arg facebook_app_secret "$facebook_app_secret_b64" \
              --arg google_client_id "$google_client_id_b64" --arg google_client_secret "$google_client_secret_b64" \
              --arg github_client_id "$github_client_id_b64" --arg github_client_secret "$github_client_secret_b64" '
              .apiVersion="v1" |
              .kind="Secret" |
              .metadata.namespace="shopno-identity" |
              .metadata.name="keycloak-social-providers" |
              .type="Opaque" |
              .data=((.data // {}) + {
                FACEBOOK_APP_ID:$facebook_app_id,
                FACEBOOK_APP_SECRET:$facebook_app_secret,
                GOOGLE_CLIENT_ID:$google_client_id,
                GOOGLE_CLIENT_SECRET:$google_client_secret,
                GITHUB_CLIENT_ID:$github_client_id,
                GITHUB_CLIENT_SECRET:$github_client_secret
              })
            ' |
            kubectl apply -f -
          unset FACEBOOK_APP_SECRET
          unset GOOGLE_CLIENT_SECRET
          unset GITHUB_CLIENT_ID
          unset GITHUB_CLIENT_SECRET

      - name: Refresh the existing Keycloak sync job
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n shopno-identity create configmap keycloak-client-sync-script \
            --from-file=client-sync.py=k8s/services/keycloak/client-sync.py \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n shopno-identity delete job keycloak-client-sync --ignore-not-found=true
          kubectl -n shopno-identity apply -f k8s/services/keycloak/client-sync-job.yaml
          kubectl -n shopno-identity wait --for=condition=complete job/keycloak-client-sync --timeout=10m

      - name: Verify Facebook broker endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/facebook-broker-response -w '%{http_code}' \
            'https://auth.shopnoltd.dpdns.org/realms/shopnoltd/broker/facebook/endpoint')"
          if [ "$code" = "404" ] && grep -q 'Identity Provider \[facebook\] not found' /tmp/facebook-broker-response; then
            echo 'Facebook provider is still missing from Keycloak.' >&2
            exit 1
          fi
          echo "Facebook broker endpoint responded with HTTP $code."
