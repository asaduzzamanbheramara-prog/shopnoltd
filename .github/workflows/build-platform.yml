name: Build and promote platform images

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'billing-engine/**'
      - 'services/vpn-service/**'
      - 'shared/**'
      - '.github/workflows/build-platform.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'billing-engine/**'
      - 'services/vpn-service/**'
      - 'shared/**'
      - '.github/workflows/build-platform.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: platform-build-promote-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/shopnoltd

jobs:
  detect-changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_services: ${{ steps.detect.outputs.has_services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - id: detect
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess

          services = {
            'domain-service': ('platform/domain-service/Dockerfile', '.'),
            'interior-service': ('platform/interior-service/Dockerfile', '.'),
            'event-service': ('platform/event-service/Dockerfile', '.'),
            'foundation-service': ('platform/foundation-service/Dockerfile', '.'),
            'training-service': ('platform/training-service/Dockerfile', '.'),
            'freedomain-service': ('platform/freedomain-service/Dockerfile', '.'),
            'api-service': ('platform/api-service/Dockerfile', '.'),
            'gateway': ('platform/gateway/Dockerfile', '.'),
            'oauth-service': ('platform/oauth-service/Dockerfile', '.'),
            'tenant-router': ('platform/tenant-router/Dockerfile', '.'),
            'analytics-service': ('platform/analytics-service/Dockerfile', '.'),
            'storage-service': ('platform/storage-service/Dockerfile', '.'),
            'notification-service': ('platform/notification-service/Dockerfile', '.'),
            'scheduler-service': ('platform/scheduler-service/Dockerfile', '.'),
            'worker-service': ('platform/worker-service/Dockerfile', '.'),
            'payment-service': ('platform/payment-service/Dockerfile', '.'),
            'exchange-service': ('platform/exchange-service/Dockerfile', '.'),
            'auth-service': ('platform/auth-service/Dockerfile', '.'),
            'audit-service': ('platform/audit-service/Dockerfile', '.'),
            'report-service': ('platform/report-service/Dockerfile', '.'),
            'license-service': ('platform/license-service/Dockerfile', '.'),
            'mobile-api': ('platform/mobile-api/Dockerfile', '.'),
            'ai-platform': ('platform/ai-platform/Dockerfile', '.'),
            'admin-portal': ('platform/admin-portal/Dockerfile', '.'),
            'web-portal': ('platform/web-portal/Dockerfile', '.'),
            'android-portal': ('platform/android-portal/Dockerfile', '.'),
            'android-cloud-controller': ('platform/android-cloud/controller/Dockerfile', '.'),
            'android-cloud-web': ('platform/android-cloud/web/Dockerfile', '.'),
            'android-cloud-gateway': ('platform/android-cloud/gateway/Dockerfile', 'platform/android-cloud/gateway'),
            'messaging-service': ('platform/messaging-service/Dockerfile', '.'),
            'meet-service': ('platform/meet-service/Dockerfile', '.'),
            'live-service': ('platform/live-service/Dockerfile', '.'),
            'mail-service': ('platform/mail-service/Dockerfile', '.'),
            'social-service': ('platform/social-service/Dockerfile', '.'),
            'keycloak': ('platform/keycloak/Dockerfile', '.'),
            'session-manager': ('platform/session-manager/Dockerfile', '.'),
            'vpn-service': ('services/vpn-service/Dockerfile', 'services/vpn-service'),
            'billing-engine': ('billing-engine/Dockerfile', 'billing-engine'),
          }

          before = os.environ.get('BEFORE', '')
          sha = os.environ['SHA']
          event_name = os.environ['EVENT_NAME']

          if event_name == 'workflow_dispatch':
              changed = ['ALL']
          elif not before or set(before) == {'0'}:
              changed = ['ALL']
          else:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', before, sha],
                  text=True,
              ).splitlines()

          shared_changed = (
              'ALL' in changed
              or any(
                  p == 'shared' or p.startswith('shared/')
                  for p in changed
              )
          )

          result = []

          for service, (dockerfile, context) in services.items():
              prefix = dockerfile.rsplit('/Dockerfile', 1)[0]

              affected = (
                  'ALL' in changed
                  or shared_changed
                  or any(
                      p == prefix or p.startswith(prefix + '/')
                      for p in changed
                  )
              )

              if service == 'billing-engine':
                  affected = affected or any(
                      p == 'billing-engine'
                      or p.startswith('billing-engine/')
                      for p in changed
                  )

              if service == 'vpn-service':
                  affected = affected or any(
                      p == 'services/vpn-service'
                      or p.startswith('services/vpn-service/')
                      for p in changed
                  )

              if affected:
                  result.append({
                      'service': service,
                      'dockerfile': dockerfile,
                      'context': context,
                  })

          matrix = {'include': result}

          print('Changed paths:')
          for path in changed:
              print(f'  {path}')

          if result:
              print('Affected services:')
              for item in result:
                  print(f"  {item['service']}")
          else:
              print('Affected services: none')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(
                  'matrix='
                  + json.dumps(matrix, separators=(',', ':'))
                  + '\n'
              )
              f.write(
                  'has_services='
                  + ('true' if result else 'false')
                  + '\n'
              )
          PY

  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_services == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate build context
        shell: bash
        run: |
          set -euo pipefail

          test -f '${{ matrix.dockerfile }}'
          test -d '${{ matrix.context }}'

          if [ '${{ matrix.service }}' = 'billing-engine' ]; then
            test -d billing-engine/app
          fi

          if [ '${{ matrix.service }}' = 'vpn-service' ]; then
            test -d services/vpn-service
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/{1}:latest', env.IMAGE_PREFIX, matrix.service) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    name: Promote built images to GitOps manifests
    if: needs.detect-changes.outputs.has_services == 'true'
    needs: [detect-changes, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve published image digests
        id: resolve
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          matrix = json.loads(os.environ['MATRIX'])['include']
          owner = os.environ['IMAGE_OWNER']
          sha = os.environ['SOURCE_SHA']

          resolved = {}

          for item in matrix:
              service = item['service']
              image = f'ghcr.io/{owner}/shopnoltd/{service}'
              reference = f'{image}:{sha}'

              print(f'Resolving {reference}')

              result = subprocess.run(
                  [
                      'docker',
                      'buildx',
                      'imagetools',
                      'inspect',
                      reference,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              digest = None

              for line in result.stdout.splitlines():
                  match = re.match(
                      r'^\s*Digest:\s*(sha256:[0-9a-f]{64})\s*$',
                      line,
                  )
                  if match:
                      digest = match.group(1)
                      break

              if not digest:
                  raise SystemExit(
                      f'ERROR: unable to resolve immutable digest for '
                      f'{reference}'
                  )

              resolved[service] = {
                  'image': image,
                  'tag': sha,
                  'digest': digest,
              }

              print(f'{service}: {digest}')

          with open(
              os.environ['GITHUB_OUTPUT'],
              'a',
              encoding='utf-8',
          ) as f:
              f.write(
                  'resolved='
                  + json.dumps(resolved, separators=(',', ':'))
                  + '\n'
              )
          PY

      - name: Promote GitOps image references
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re

          resolved = json.loads(os.environ['RESOLVED'])

          matched = {service: 0 for service in resolved}
          changed_files = []

          for root, _, files in os.walk('k8s'):
              for name in files:
                  if not name.endswith(('.yaml', '.yml')):
                      continue

                  path = os.path.join(root, name)

                  with open(path, encoding='utf-8') as f:
                      text = f.read()

                  original = text

                  for service, info in resolved.items():
                      image = info['image']
                      tag = info['tag']
                      digest = info['digest']

                      pattern = re.escape(image) + (
                          r'(?::[A-Za-z0-9_.-]+'
                          r'|@sha256:[0-9a-f]{64})'
                      )

                      def replace(match):
                          matched[service] += 1
                          existing = match.group(0)

                          if '@sha256:' in existing:
                              return image + '@' + digest

                          return image + ':' + tag

                      text = re.sub(
                          pattern,
                          replace,
                          text,
                      )

                  if text != original:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(text)

                      changed_files.append(path)

          print('GitOps promotion results:')

          for service, count in matched.items():
              print(f'  {service}: {count} matching image reference(s)')

              if count == 0:
                  raise SystemExit(
                      f'ERROR: no GitOps image reference found for '
                      f'{service}. Refusing to publish a build that cannot '
                      f'be promoted.'
                  )

          print()
          print('Changed GitOps files:')

          if changed_files:
              for path in sorted(changed_files):
                  print(f'  {path}')
          else:
              raise SystemExit(
                  'ERROR: affected services were resolved, but no GitOps '
                  'manifest changed. Refusing silent promotion failure.'
              )
          PY

      - name: Verify promoted manifests
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re

          resolved = json.loads(os.environ['RESOLVED'])

          for service, info in resolved.items():
              image = info['image']
              tag = info['tag']
              digest = info['digest']

              tag_count = 0
              digest_count = 0

              pattern = re.compile(
                  re.escape(image)
                  + r'(?::([A-Za-z0-9_.-]+)|@sha256:([0-9a-f]{64}))'
              )

              for root, _, files in os.walk('k8s'):
                  for name in files:
                      if not name.endswith(('.yaml', '.yml')):
                          continue

                      path = os.path.join(root, name)

                      with open(path, encoding='utf-8') as f:
                          text = f.read()

                      for match in pattern.finditer(text):
                          if match.group(1) == tag:
                              tag_count += 1
                          if match.group(2) == digest.split(':', 1)[1]:
                              digest_count += 1

              print(
                  f'{service}: '
                  f'tag={tag_count}, '
                  f'digest={digest_count}, '
                  f'expected_digest={digest}'
              )

              if tag_count == 0 and digest_count == 0:
                  raise SystemExit(
                      f'ERROR: verification failed for {service}; '
                      f'neither expected tag nor digest is present.'
                  )
          PY

      - name: Commit manifest promotion
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add k8s

          if git diff --cached --quiet; then
            echo 'ERROR: promotion produced no GitOps commit.'
            exit 1
          fi

          git diff --cached --check

          git commit \
            -m "chore(gitops): promote affected images for ${GITHUB_SHA}"

          git push origin HEAD:main
