name: Targeted Keycloak password setup repair
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-keycloak-password-setup-repair
  cancel-in-progress: false

jobs:
  repair-one-account:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify trusted runner and Keycloak secret
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null
          command -v curl >/dev/null
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          kubectl --request-timeout=15s -n shopno-identity get secret keycloak-secret -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d | grep -q .
          echo "Trusted runner and existing Keycloak bootstrap secret are available."

      - name: Port-forward Keycloak
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n shopno-identity port-forward --address 127.0.0.1 svc/keycloak 18080:80 >"${RUNNER_TEMP:-/tmp}/keycloak-targeted-repair-port-forward.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP:-/tmp}/keycloak-targeted-repair-port-forward.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/realms/shopnoltd/.well-known/openid-configuration >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1

      - name: Add only the missing password setup action
        shell: bash
        env:
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCLOAK_K8S_ADMIN_PASSWORD="$(kubectl -n shopno-identity get secret keycloak-secret -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d)"
          test -n "$KEYCLOAK_K8S_ADMIN_PASSWORD"
          echo "::add-mask::$KEYCLOAK_K8S_ADMIN_PASSWORD"
          export KEYCLOAK_K8S_ADMIN_PASSWORD
          KEYCLOAK_ADMIN_USERNAME="$(kubectl -n shopno-identity get configmap keycloak-config -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_USERNAME}')"
          test -n "$KEYCLOAK_ADMIN_USERNAME"
          export KEYCLOAK_ADMIN_USERNAME
          export KEYCLOAK_BASE_URL=http://127.0.0.1:18080
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request

          TARGET_REF = "5b8f7d9fc5876b60"
          BASE = os.environ["KEYCLOAK_BASE_URL"].rstrip("/")
          REALM = "shopnoltd"
          ADMIN_URL = f"{BASE}/admin/realms/{REALM}"

          def request(url, *, token, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Accept": "application/json", "Authorization": "Bearer " + token}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"Keycloak API request failed: HTTP {exc.code} ({method} {urllib.parse.urlsplit(url).path})") from None

          token = None
          seen_passwords = set()
          candidates = [
              ("Kubernetes keycloak-secret", os.environ.get("KEYCLOAK_K8S_ADMIN_PASSWORD", "")),
              ("GitHub Actions secret", os.environ.get("KEYCLOAK_ADMIN_PASSWORD", "")),
          ]
          for source, password in candidates:
              if not password or password in seen_passwords:
                  continue
              seen_passwords.add(password)
              form = urllib.parse.urlencode({
                  "grant_type": "password",
                  "client_id": "admin-cli",
                  "username": os.environ["KEYCLOAK_ADMIN_USERNAME"],
                  "password": password,
              }).encode()
              req = urllib.request.Request(
                  f"{BASE}/realms/master/protocol/openid-connect/token",
                  data=form,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      token_payload = json.loads(response.read())
                  token = token_payload.get("access_token") if isinstance(token_payload, dict) else None
              except Exception:
                  token = None
              if token:
                  print(f"[AUTH] Keycloak admin authentication succeeded using {source}.")
                  break
              print(f"[AUTH] {source} did not authenticate; trying the next configured source.")
          if not token:
              raise RuntimeError("Keycloak admin authentication failed with all configured sources; no account was changed")

          matches = []
          first = 0
          while True:
              query = urllib.parse.urlencode({"first": first, "max": 100})
              code, page = request(f"{ADMIN_URL}/users?{query}", token=token)
              if code != 200 or not isinstance(page, list):
                  raise RuntimeError("Could not complete exact account lookup; no account was changed")
              for user in page:
                  uid = user.get("id")
                  if uid and hashlib.sha256(uid.encode()).hexdigest()[:16] == TARGET_REF:
                      matches.append(user)
              if len(page) < 100:
                  break
              first += len(page)

          if len(matches) != 1:
              raise RuntimeError(f"Expected exactly one account matching the audit reference; found {len(matches)}. No account was changed.")
          user = matches[0]
          user_id = user["id"]
          if user.get("enabled") is not True or user.get("emailVerified") is not True:
              raise RuntimeError("Target account is no longer enabled and email-verified; no account was changed")

          code, fresh_user = request(f"{ADMIN_URL}/users/{urllib.parse.quote(user_id, safe='')}", token=token)
          if code != 200 or not isinstance(fresh_user, dict):
              raise RuntimeError("Could not re-read target account; no account was changed")
          if hashlib.sha256(fresh_user.get("id", "").encode()).hexdigest()[:16] != TARGET_REF:
              raise RuntimeError("Target account identity did not re-verify; no account was changed")
          if fresh_user.get("enabled") is not True or fresh_user.get("emailVerified") is not True:
              raise RuntimeError("Target account state changed during verification; no account was changed")

          code, credentials = request(
              f"{ADMIN_URL}/users/{urllib.parse.quote(user_id, safe='')}/credentials",
              token=token,
          )
          if code != 200 or not isinstance(credentials, list):
              raise RuntimeError("Could not verify password credentials; no account was changed")
          if any(item.get("type") == "password" for item in credentials):
              print("[SAFE-SKIP] Target account now has a password credential; no account data changed.")
              raise SystemExit(0)

          actions = list(fresh_user.get("requiredActions") or [])
          if "UPDATE_PASSWORD" not in actions:
              fresh_user["requiredActions"] = actions + ["UPDATE_PASSWORD"]
              code, _ = request(
                  f"{ADMIN_URL}/users/{urllib.parse.quote(user_id, safe='')}",
                  token=token,
                  method="PUT",
                  body={"requiredActions": actions + ["UPDATE_PASSWORD"]},
              )
              if code not in (200, 204):
                  raise RuntimeError(f"Keycloak rejected the targeted required-action update (HTTP {code})")
              print("[UPDATED] Added only UPDATE_PASSWORD; preserved all existing required actions and account fields.")
          else:
              print("[NO-OP] UPDATE_PASSWORD was already present; no account data changed.")

          code, verified = request(f"{ADMIN_URL}/users/{urllib.parse.quote(user_id, safe='')}", token=token)
          if code != 200 or not isinstance(verified, dict) or "UPDATE_PASSWORD" not in (verified.get("requiredActions") or []):
              raise RuntimeError("Post-update verification failed")
          code, verified_credentials = request(
              f"{ADMIN_URL}/users/{urllib.parse.quote(user_id, safe='')}/credentials",
              token=token,
          )
          if code != 200 or not isinstance(verified_credentials, list) or any(item.get("type") == "password" for item in verified_credentials):
              raise RuntimeError("Post-update credential safety verification failed")
          print("[VERIFIED] Exactly the intended account has UPDATE_PASSWORD and still has no password credential.")
          print("[SCOPE] No password was generated, removed, or emailed. No other account was modified.")
          PY

      - name: Stop Keycloak port-forward
        if: always()
        shell: bash
        run: |
          pid_file="${RUNNER_TEMP:-/tmp}/keycloak-targeted-repair-port-forward.pid"
          if [[ -f "$pid_file" ]]; then kill "$(cat "$pid_file")" 2>/dev/null || true; rm -f "$pid_file"; fi
