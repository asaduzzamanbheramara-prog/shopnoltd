name: Verify encrypted Shopnoltd database and Kubernetes Secrets backups

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Shopnoltd encrypted database and Kubernetes Secrets backup
    types:
      - completed
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: verify-postgres-backup
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify encrypted database and Kubernetes Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout encrypted backup branch
        uses: actions/checkout@v4
        with:
          ref: database-backups
          path: backup-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate timestamp and required files
        shell: bash
        run: |
          set -euo pipefail
          cd backup-source/backup
          for file in timestamp.txt latest.dump.enc latest.dump.enc.sha256 latest.kubernetes-secrets.json.enc latest.kubernetes-secrets.json.enc.sha256; do
            test -s "$file" || { echo "::error::Required backup file missing: $file"; exit 1; }
          done
          timestamp="$(tr -d '\r\n' < timestamp.txt)"
          [[ "$timestamp" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::Invalid backup timestamp."; exit 1; }
          iso="${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2}T${timestamp:9:2}:${timestamp:11:2}:${timestamp:13:2}Z"
          epoch="$(date -u -d "$iso" +%s)"
          now="$(date -u +%s)"
          age=$((now - epoch))
          (( age >= 0 && age <= 172800 )) || { echo "::error::Backup is future-dated or older than 48 hours."; exit 1; }
          echo "PASS: backup timestamp is fresh ($((age / 3600)) hours old)."

      - name: Verify checksums and decrypt database and Kubernetes Secrets
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY secret is missing."; exit 1; }
          cd backup-source/backup
          umask 077
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          for file in latest.dump.enc latest.kubernetes-secrets.json.enc; do
            expected="$(awk 'NR==1 {print $1}' "$file.sha256")"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            [[ "$expected" =~ ^[[:xdigit:]]{64}$ && "$expected" == "$actual" ]] || { echo "::error::Checksum mismatch: $file"; exit 1; }
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.dump.enc -out "$RUNNER_TEMP/shopnoltd.dump" -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.kubernetes-secrets.json.enc -out "$RUNNER_TEMP/shopnoltd-secrets.json" -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$RUNNER_TEMP/shopnoltd.dump"
          python3 - "$RUNNER_TEMP/shopnoltd-secrets.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", [])
          if data.get("kind") != "List" or not items:
              raise SystemExit("Kubernetes Secret export is empty or malformed")
          namespaces = {x.get("metadata", {}).get("namespace", "") for x in items}
          print(f"PASS: Kubernetes Secret export parsed ({len(items)} objects, {len(namespaces)} namespaces).")
          PY
          echo "PASS: encrypted database and Kubernetes Secrets decrypted and parsed."

      - name: Pull the exact PostgreSQL image used by production
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/asaduzzamanbheramara-prog/shopnoltd-postgres-combined:pg16-postgis3.5-pgvector0.8.6

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Restore backup into an isolated disposable PostgreSQL database
        shell: bash
        env:
          POSTGRES_PASSWORD: shopnoltd-restore-validation-only
        run: |
          set -euo pipefail
          export PGPASSWORD="$POSTGRES_PASSWORD"
          docker run --detach \
            --name shopnoltd-postgres-restore-validation \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=restore_validator \
            --env POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --env POSTGRES_DB=shopnoltd_restore_validation \
            ghcr.io/asaduzzamanbheramara-prog/shopnoltd-postgres-combined:pg16-postgis3.5-pgvector0.8.6

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec shopnoltd-postgres-restore-validation \
              pg_isready --host 127.0.0.1 --port 5432 -U restore_validator -d shopnoltd_restore_validation >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || { echo "::error::Disposable PostgreSQL did not become ready."; exit 1; }

          pg_restore --exit-on-error --no-owner --no-acl \
            --host 127.0.0.1 --port 55432 \
            --username restore_validator \
            --dbname shopnoltd_restore_validation \
            "$RUNNER_TEMP/shopnoltd.dump"

          table_count="$(psql -X -v ON_ERROR_STOP=1 -At \
            --host 127.0.0.1 --port 55432 \
            --username restore_validator \
            --dbname shopnoltd_restore_validation \
            --command "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema');")"
          [[ "$table_count" =~ ^[0-9]+$ && "$table_count" -gt 0 ]] || {
            echo "::error::Restore completed but no application tables were found."
            exit 1
          }
          extension_list="$(psql -X -v ON_ERROR_STOP=1 -At \
            --host 127.0.0.1 --port 55432 \
            --username restore_validator \
            --dbname shopnoltd_restore_validation \
            --command "SELECT COALESCE(string_agg(extname, ',' ORDER BY extname), 'none') FROM pg_extension;")"
          echo "PASS: full isolated PostgreSQL restore completed (application_tables=$table_count; extensions=$extension_list)."
          echo "NOTE: only the disposable GitHub-hosted runner database was modified."

      - name: Capture disposable PostgreSQL diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker inspect --format 'container_status={{.State.Status}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}}' shopnoltd-postgres-restore-validation 2>&1 || true
          docker logs --tail 250 shopnoltd-postgres-restore-validation 2>&1 || true

      - name: Remove disposable PostgreSQL container and image
        if: always()
        shell: bash
        run: |
          docker rm --force shopnoltd-postgres-restore-validation >/dev/null 2>&1 || true
          docker image rm ghcr.io/asaduzzamanbheramara-prog/shopnoltd-postgres-combined:pg16-postgis3.5-pgvector0.8.6 >/dev/null 2>&1 || true

      - name: Remove decrypted artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shopnoltd.dump" "$RUNNER_TEMP/shopnoltd-secrets.json" "$RUNNER_TEMP/shopnoltd-pg-restore-list.txt"
