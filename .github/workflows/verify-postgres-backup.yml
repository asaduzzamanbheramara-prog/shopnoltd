name: Verify encrypted Shopnoltd disaster-recovery backups

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Shopnoltd encrypted disaster-recovery backup
    types:
      - completed
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: verify-postgres-backup
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify encrypted database, secrets and host recovery material
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout encrypted backup branch
        uses: actions/checkout@v4
        with:
          ref: database-backups
          path: backup-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate timestamp and required files
        shell: bash
        run: |
          set -euo pipefail
          cd backup-source/backup
          for file in timestamp.txt latest.dump.enc latest.dump.enc.sha256 latest.kubernetes-secrets.json.enc latest.kubernetes-secrets.json.enc.sha256 latest.recovery-material.tar.gz.enc latest.recovery-material.tar.gz.enc.sha256 recovery-material-status.txt; do
            test -s "$file" || { echo "::error::Required backup file missing: $file"; exit 1; }
          done
          timestamp="$(tr -d '\r\n' < timestamp.txt)"
          [[ "$timestamp" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::Invalid backup timestamp."; exit 1; }
          iso="${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2}T${timestamp:9:2}:${timestamp:11:2}:${timestamp:13:2}Z"
          epoch="$(date -u -d "$iso" +%s)"
          now="$(date -u +%s)"
          age=$((now - epoch))
          (( age >= 0 && age <= 172800 )) || { echo "::error::Backup is future-dated or older than 48 hours."; exit 1; }
          echo "PASS: backup timestamp is fresh ($((age / 3600)) hours old)."

      - name: Verify checksums and decrypt all recovery files
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY secret is missing."; exit 1; }
          cd backup-source/backup
          umask 077
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          for file in latest.dump.enc latest.kubernetes-secrets.json.enc latest.recovery-material.tar.gz.enc; do
            expected="$(awk 'NR==1 {print $1}' "$file.sha256")"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            [[ "$expected" =~ ^[[:xdigit:]]{64}$ && "$expected" == "$actual" ]] || { echo "::error::Checksum mismatch: $file"; exit 1; }
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.dump.enc -out "$RUNNER_TEMP/shopnoltd.dump" -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.kubernetes-secrets.json.enc -out "$RUNNER_TEMP/shopnoltd-secrets.json" -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.recovery-material.tar.gz.enc -out "$RUNNER_TEMP/shopnoltd-recovery.tar.gz" -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$RUNNER_TEMP/shopnoltd.dump"
          python3 - "$RUNNER_TEMP/shopnoltd-secrets.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", [])
          if data.get("kind") != "List" or not items:
              raise SystemExit("Kubernetes Secret export is empty or malformed")
          namespaces = {x.get("metadata", {}).get("namespace", "") for x in items}
          print(f"PASS: Kubernetes Secret export parsed ({len(items)} objects, {len(namespaces)} namespaces).")
          PY
          tar -tzf "$RUNNER_TEMP/shopnoltd-recovery.tar.gz" > "$RUNNER_TEMP/shopnoltd-recovery-list.txt"
          grep -q 'k3s-state-backup.tgz' "$RUNNER_TEMP/shopnoltd-recovery-list.txt"
          tar -xOf "$RUNNER_TEMP/shopnoltd-recovery.tar.gz" ./k3s-state-backup.tgz > "$RUNNER_TEMP/k3s-state-backup.tgz"
          tar -tzf "$RUNNER_TEMP/k3s-state-backup.tgz" > "$RUNNER_TEMP/k3s-state-list.txt"
          grep -Eq '(^|/)token$' "$RUNNER_TEMP/k3s-state-list.txt"
          grep -Eq '(^|/)db/state.db$' "$RUNNER_TEMP/k3s-state-list.txt"
          grep -qx 'K3S_STATE_ARCHIVE=present' recovery-material-status.txt
          grep -qx 'CLOUDFLARED=present' recovery-material-status.txt
          grep -q 'cloudflared/' "$RUNNER_TEMP/shopnoltd-recovery-list.txt"
          echo "PASS: recovery bundle contains K3s token/state archive and Cloudflare files."

      - name: Validate PostgreSQL custom-format archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_restore --list "$RUNNER_TEMP/shopnoltd.dump" > "$RUNNER_TEMP/shopnoltd-pg-restore-list.txt"
          entries="$(grep -cE '^[0-9]+; ' "$RUNNER_TEMP/shopnoltd-pg-restore-list.txt" || true)"
          [[ "$entries" =~ ^[0-9]+$ ]] && (( entries > 0 )) || { echo "::error::PostgreSQL archive has no recognizable entries."; exit 1; }
          echo "PASS: PostgreSQL custom-format archive is readable ($entries entries)."
          echo "NOTE: This validates archive readability, not a full isolated database restore."

      - name: Remove decrypted artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shopnoltd.dump" "$RUNNER_TEMP/shopnoltd-secrets.json" "$RUNNER_TEMP/shopnoltd-recovery.tar.gz" "$RUNNER_TEMP/shopnoltd-recovery-list.txt" "$RUNNER_TEMP/k3s-state-backup.tgz" "$RUNNER_TEMP/k3s-state-list.txt" "$RUNNER_TEMP/shopnoltd-pg-restore-list.txt"
