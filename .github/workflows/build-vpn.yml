name: Build VPN
on:
  push:
    branches: [main, feat/full-platform-control-plane-20260907]
    paths: ['services/vpn-service/**', '.github/workflows/build-vpn.yml']
  pull_request:
    paths: ['services/vpn-service/**', '.github/workflows/build-vpn.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vpn-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q api
      - run: |
          python - <<'PY'
          import os
          import tempfile
          os.environ['VPN_ADMIN_TOKEN'] = 'ci-token'
          os.environ['VPN_DATA_DIR'] = tempfile.mkdtemp(prefix='vpn-ci-')
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          r = c.get('/healthz')
          assert r.status_code == 200 and r.json()['status'] == 'ok'
          assert c.get('/api/v1/vpn/peers').status_code == 401
          print('VPN API health/auth guard test passed')
          PY
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/vpn-service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopnoltd/vpn-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopnoltd/vpn-service:latest
      - name: Promote immutable image to GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s#image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/vpn-service:[^[:space:]]*#image: ghcr.io/asaduzzamanbheramara-prog/shopnoltd/vpn-service:${GITHUB_SHA}#" k8s/services/vpn-service.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/services/vpn-service.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(vpn): promote image ${GITHUB_SHA}"
          git push
