name: Build VPN
on:
  push:
    branches: [main, feat/full-platform-control-plane-20260907]
    paths: ['services/vpn-service/**', '.github/workflows/build-vpn.yml']
  pull_request:
    paths: ['services/vpn-service/**', '.github/workflows/build-vpn.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vpn-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q api
      - run: |
          python - <<'PY'
          import os
          import tempfile
          os.environ['VPN_ADMIN_TOKEN'] = 'ci-token'
          os.environ['VPN_DATA_DIR'] = tempfile.mkdtemp(prefix='vpn-ci-')
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          r = c.get('/healthz')
          assert r.status_code == 200 and r.json()['status'] == 'ok'
          locations = c.get('/api/v1/vpn/locations')
          assert locations.status_code == 200
          assert any(x['id'] == 'bd-dhaka' and x['available'] for x in locations.json())
          plans = c.get('/api/v1/vpn/plans')
          assert plans.status_code == 200 and any(x['id'] == 'vpn-free' for x in plans.json())
          assert c.get('/api/v1/vpn/peers').status_code == 401
          assert c.get('/api/v1/vpn/admin/gateways').status_code == 401
          print('VPN provider metadata/health/auth guard tests passed')
          PY
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/vpn-service
          push: false
          tags: shopnoltd/vpn-service:ci
