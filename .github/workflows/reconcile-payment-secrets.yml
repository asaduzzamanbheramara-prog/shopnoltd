name: Reconcile Payment Provider Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopnoltd-payment-secret-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-payment-secrets:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v jq
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          kubectl --request-timeout=20s cluster-info >/dev/null

      - name: Reconcile Stripe credentials without overwriting existing keys
        shell: bash
        env:
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK }}
        run: |
          set -euo pipefail
          test -n "${STRIPE_SECRET:-}" || { echo 'STRIPE_SECRET is not configured in GitHub Actions.' >&2; exit 1; }
          test -n "${STRIPE_WEBHOOK:-}" || { echo 'STRIPE_WEBHOOK is not configured in GitHub Actions.' >&2; exit 1; }
          existing="$(kubectl -n shopno-payments get secret payment-service-secret -o json 2>/dev/null || printf '%s' '{"apiVersion":"v1","kind":"Secret","metadata":{},"data":{}}')"
          stripe_key_b64="$(printf '%s' "$STRIPE_SECRET" | base64 -w0)"
          stripe_webhook_b64="$(printf '%s' "$STRIPE_WEBHOOK" | base64 -w0)"
          printf '%s' "$existing" | jq \
            --arg stripe_key "$stripe_key_b64" \
            --arg stripe_webhook "$stripe_webhook_b64" '
              .apiVersion="v1" |
              .kind="Secret" |
              .metadata.namespace="shopno-payments" |
              .metadata.name="payment-service-secret" |
              .type="Opaque" |
              .data=((.data // {}) + {
                STRIPE_SECRET_KEY:(if ((.data // {}).STRIPE_SECRET_KEY // "") == "" then $stripe_key else .data.STRIPE_SECRET_KEY end),
                STRIPE_WEBHOOK_SECRET:(if ((.data // {}).STRIPE_WEBHOOK_SECRET // "") == "" then $stripe_webhook else .data.STRIPE_WEBHOOK_SECRET end)
              }) |
              del(.metadata.managedFields,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp)
            ' | kubectl apply -f -
          unset STRIPE_SECRET STRIPE_WEBHOOK stripe_key_b64 stripe_webhook_b64
          kubectl -n shopno-payments get secret payment-service-secret -o json |
            jq -r '.data | to_entries[] | select(.key=="STRIPE_SECRET_KEY" or .key=="STRIPE_WEBHOOK_SECRET") | [.key,(.value|@base64d|length)] | @tsv'
          echo 'Stripe secret fields reconciled; existing non-empty values were preserved.'

      - name: Restart and verify payment service rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n shopno-payments rollout restart deployment/payment-service
          kubectl -n shopno-payments rollout status deployment/payment-service --timeout=180s
          kubectl -n shopno-payments exec deployment/payment-service -- python3 -c 'import os,sys; names=("STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET"); missing=[n for n in names if not os.getenv(n)]; print("Payment runtime credential presence:", ", ".join(n+("=MISSING" if n in missing else "=PRESENT") for n in names)); sys.exit(bool(missing))'

      - name: Report SMTP readiness without creating placeholder credentials
        shell: bash
        env:
          MAIL_SMTP_USERNAME: ${{ secrets.MAIL_SMTP_USERNAME }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_SMTP_ENVELOPE_FROM: ${{ secrets.MAIL_SMTP_ENVELOPE_FROM }}
        run: |
          set -euo pipefail
          if [ -z "${MAIL_SMTP_ENVELOPE_FROM:-}" ]; then
            echo 'SMTP remains fail-closed: MAIL_SMTP_ENVELOPE_FROM is not configured.'
            exit 0
          fi
          if [ -n "${MAIL_SMTP_USERNAME:-}" ] && [ -z "${MAIL_SMTP_PASSWORD:-}" ] || [ -z "${MAIL_SMTP_USERNAME:-}" ] && [ -n "${MAIL_SMTP_PASSWORD:-}" ]; then
            echo 'SMTP credentials are incomplete; refusing to create a Secret.' >&2
            exit 1
          fi
          kubectl -n shopno-mail create secret generic mail-service-smtp \
            --from-literal=SMTP_USERNAME="${MAIL_SMTP_USERNAME:-}" \
            --from-literal=SMTP_PASSWORD="${MAIL_SMTP_PASSWORD:-}" \
            --from-literal=SMTP_ENVELOPE_FROM="$MAIL_SMTP_ENVELOPE_FROM" \
            --dry-run=client -o yaml | kubectl -n shopno-mail apply -f -
          kubectl -n shopno-mail rollout restart deployment/mail-service
          kubectl -n shopno-mail rollout status deployment/mail-service --timeout=180s
          echo 'SMTP Secret reconciled without printing credential values.'
