name: Secret Guard

on:
  push:
    branches:
      - '**'
  pull_request:
    paths:
      - '**'
      - '!.github/workflows/secret-guard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        if: github.event_name == 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Gitleaks binary
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          version="8.24.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan pull-request or pushed changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_HEAD"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            gitleaks detect --source . --no-git --redact --exit-code 1
          else
            git fetch --no-tags origin "$base" "$head"
            gitleaks detect --source . --log-opts="$base..$head" --redact --exit-code 1
          fi
