name: build branded shopnoltd-kpi

on:
  push:
    branches: [main]
    paths:
      - branding/**
      - toolbox/**
      - .github/workflows/build-kpi.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push branded KPI
        uses: docker/build-push-action@v5
        with:
          context: ./branding
          file: ./branding/Dockerfile.overlay
          push: true
          tags: |
            ghcr.io/asaduzzamanbheramara-prog/shopnoltd-kpi:latest
            ghcr.io/asaduzzamanbheramara-prog/shopnoltd-kpi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
