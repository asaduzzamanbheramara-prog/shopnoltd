name: Keycloak Admin Credential Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-admin-readonly-preflight
  cancel-in-progress: false

jobs:
  verify-current-admin-credential:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    env:
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
    steps:
      - name: Verify runner and credential input
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v curl
          command -v python3
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          test -n "${KEYCLOAK_ADMIN_PASSWORD:-}" || {
            echo "::error::Repository Actions secret KEYCLOAK_ADMIN_PASSWORD is empty or unavailable."
            exit 1
          }
          echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
          echo "Runner prerequisites and secret presence: PASS (secret value is not displayed)."

      - name: Open temporary read-only Keycloak port-forward
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/keycloak-readonly-preflight-port-forward.log"
          kubectl --request-timeout=20s -n shopno-identity port-forward --address 127.0.0.1 svc/keycloak 18082:80 >"$log_file" 2>&1 &
          port_forward_pid=$!
          cleanup() {
            kill "$port_forward_pid" 2>/dev/null || true
            wait "$port_forward_pid" 2>/dev/null || true
            rm -f "$log_file"
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18082/realms/master/.well-known/openid-configuration >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              echo "::error::Keycloak port-forward exited before the master realm became reachable."
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Keycloak master realm did not become reachable within 30 seconds."
            exit 1
          fi
          echo "Keycloak master-realm discovery endpoint: PASS."

          export KEYCLOAK_ADMIN_PASSWORD
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = "http://127.0.0.1:18082/realms/master/protocol/openid-connect/token"
          form = urllib.parse.urlencode({
              "grant_type": "password",
              "client_id": "admin-cli",
              "username": "shopnoltd-admin",
              "password": os.environ["KEYCLOAK_ADMIN_PASSWORD"],
          }).encode()
          request = urllib.request.Request(
              endpoint,
              data=form,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit("Keycloak authentication preflight failed: unexpected HTTP status.")
                  # Parse only to verify a non-empty access token; never print or persist it.
                  import json
                  payload = json.loads(response.read())
                  if not isinstance(payload.get("access_token"), str) or not payload["access_token"]:
                      raise SystemExit("Keycloak authentication preflight failed: token response was incomplete.")
          except urllib.error.HTTPError as exc:
              # Do not print response bodies, which may contain provider diagnostics.
              raise SystemExit(
                  f"Keycloak authentication preflight FAILED (HTTP {exc.code}); no account or credential was changed."
              )
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit("Keycloak authentication preflight failed due to a connection/timeout error.")
          print("Keycloak master-realm authentication: PASS (access token discarded).")
          PY

      - name: Confirm non-mutating scope
        if: always()
        shell: bash
        run: |
          echo "This workflow performs discovery and token authentication only."
          echo "It does not apply Kubernetes Secrets, sync ArgoCD, run Jobs/backfills, alter accounts, or write to the database."
