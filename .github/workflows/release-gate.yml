name: Production Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to verify'
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: production-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          test -d k8s
          found=0
          while IFS= read -r -d '' f; do
            found=1
            if command -v kubectl >/dev/null 2>&1; then
              kubectl apply --dry-run=client --validate=false -f "$f" >/dev/null
            else
              python3 - "$f" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text(encoding='utf-8')
if not text.strip():
    raise SystemExit(f'empty manifest: {p}')
PY
            fi
          done < <(find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          test "$found" -eq 1

      - name: Validate release gate documentation
        run: test -s docs/OBSERVABILITY-RELEASE-GATE.md

  public-smoke:
    name: Public endpoint smoke tests
    needs: repository-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            url: https://shopnoltd.dpdns.org
          - name: api
            url: https://api.shopnoltd.dpdns.org
          - name: auth
            url: https://auth.shopnoltd.dpdns.org
          - name: ai
            url: https://ai-platform.shopnoltd.dpdns.org
    steps:
      - name: Probe ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          url='${{ matrix.url }}'
          ok=0
          for attempt in 1 2 3 4 5; do
            code="$(curl -k -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            case "$code" in
              2*|3*) ok=1; echo "${{ matrix.name }} reachable with HTTP $code"; break ;;
              *) echo "${{ matrix.name }} attempt $attempt returned HTTP ${code:-000}"; sleep $((attempt * 5)) ;;
            esac
          done
          test "$ok" -eq 1

  release-summary:
    name: Release gate summary
    needs: [repository-validation, public-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require all applicable gates to pass
        shell: bash
        run: |
          set -euo pipefail
          echo "repository-validation=${{ needs.repository-validation.result }}"
          echo "public-smoke=${{ needs.public-smoke.result }}"
          test '${{ needs.repository-validation.result }}' = success
          if [ '${{ github.event_name }}' != 'pull_request' ]; then
            test '${{ needs.public-smoke.result }}' = success
          fi
