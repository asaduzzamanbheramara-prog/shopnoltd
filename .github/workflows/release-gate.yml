name: Production Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar -xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          test -d k8s
          test -n "$(find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print -quit)"
          kustomize build k8s/ > /tmp/release-gate-rendered.yaml
          test -s /tmp/release-gate-rendered.yaml

      - name: Validate frontend route contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('platform/web-portal/src/main.jsx').read_text()
          required = [
              '/discover', '/feed', '/post/:id', '/work', '/work/:id', '/create-work',
              '/my-created-work', '/my-active-work', '/my-submission', '/work-review',
              '/account', '/notifications', '/blog', '/blog/:slug', '/my-blog',
              '/domain-registration', '/domain-management', '/ai', '/billing',
              '/payments', '/transactions', '/wallet', '/wallet/ledger', '/exchange',
              '/reports', '/admin', '/admin/database', '/admin/blog', '/admin/infrastructure',
          ]
          missing = [route for route in required if f'path="{route}"' not in text]
          if missing:
              raise SystemExit('Missing frontend routes: ' + ', '.join(missing))
          print(f'Validated {len(required)} required frontend routes.')
          PY

      - name: Validate financial and verified-work contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s platform/api-service/app/api/v3_work.py
          test -s platform/api-service/app/models/work_evidence.py
          test -s platform/web-portal/src/pages/WorkHub.jsx
          test -s platform/web-portal/src/pages/FinancialCenter.jsx
          test -s platform/web-portal/src/pages/CheckoutCurrencySafe.jsx
          test -s billing-engine/app/fx.py
          test -s billing-engine/app/ledger.py
          test -s platform/api-service/app/core/financial_registry.py
          test -s billing-engine/app/moneybag_routes.py
          test -s platform/payment-service/migrations/versions/0004_transaction_ownership.py
          test -s platform/android-cloud/controller/main.py
          test -s platform/android-cloud/gateway/Dockerfile
          test -s platform/android-cloud/web/src/main.jsx
          test -s k8s/services/android-cloud/kustomization.yaml
          test -s k8s/services/vpn-service.yaml
          test -s k8s/services/vpn-service-ingress.yaml
          test -s k8s/services/social-service/ingress.yaml
          test -s k8s/services/chatwoot/deployment.yaml

      - name: Validate n8n integration remains safely staged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          deployment = Path('k8s/services/n8n/deployment.yaml').read_text()
          if 'image: n8nio/n8n:latest' in deployment or 'image: n8nio/n8n:2.40.6' not in deployment:
              raise SystemExit('n8n runtime image must be pinned to the tested importer version')
          config = Path('k8s/services/n8n/configmap.yaml').read_text()
          if 'N8N_WEBHOOK_URL: "https://n8n.shopnoltd.dpdns.org/"' not in config:
              raise SystemExit('n8n production webhook base URL is missing or not canonical')
          files = [
              Path('ops/n8n/workflows/shopnoltd-omnichannel-action-queue.json'),
              Path('ops/n8n/workflows/shopnoltd-platform-account-registry.json'),
              Path('k8s/services/n8n/workflows/shopnoltd-omnichannel-action-queue.json'),
              Path('k8s/services/n8n/workflows/shopnoltd-platform-account-registry.json'),
          ]
          for path in files:
              workflow = json.loads(path.read_text())
              if workflow.get('active') is not False:
                  raise SystemExit(f'{path}: workflow must remain inactive until credentials and live tests pass')
              if any(node.get('continueOnFail') is True for node in workflow.get('nodes', [])):
                  raise SystemExit(f'{path}: downstream API failures must not be reported as successful webhook responses')
              if path.name == 'shopnoltd-platform-account-registry.json':
                  normalize_nodes = [node for node in workflow.get('nodes', []) if node.get('name') == 'Normalize Account']
                  if len(normalize_nodes) != 1:
                      raise SystemExit(f'{path}: expected exactly one Normalize Account node')
                  code = normalize_nodes[0].get('parameters', {}).get('jsCode', '')
                  for marker in ("throw new Error('unsupported_platform')", "throw new Error('platform_account_id_required')"):
                      if marker not in code:
                          raise SystemExit(f'{path}: invalid account input must stop before Register Connection')
          social_security = Path('platform/social-service/app/core/security.py').read_text()
          social_api = Path('platform/social-service/app/api/omnichannel.py').read_text()
          api_facade = Path('platform/api-service/app/api/v1.py').read_text()
          if 'SHOPNOLTD_INTERNAL_AUTOMATION_TOKEN' in social_security:
              raise SystemExit('shared social-service JWT verifier must not accept the internal automation token')
          if 'async def registration_user(' not in social_api or 'user=Depends(registration_user)' not in social_api:
              raise SystemExit('only the connection registration route may accept the internal automation token')
          if 'async def omnichannel_user_token(' not in api_facade or 'async def omnichannel_registration_token(' not in api_facade:
              raise SystemExit('API facade must separate normal JWT auth from registration-only automation auth')
          if 'token = await omnichannel_registration_token(creds)' not in api_facade:
              raise SystemExit('connection registration route must use registration-only automation auth')
          if api_facade.count('omnichannel_user_token(creds)') < 10:
              raise SystemExit('omnichannel read/update/delete/action routes must continue to require normal JWT auth')
          print('n8n staging and route-scoped automation-token security checks passed.')
          PY

      - name: Validate release gate documentation
        run: test -s docs/OBSERVABILITY-RELEASE-GATE.md

  wait-for-gitops:
    name: Wait for self-hosted k3s reconciliation
    needs: repository-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Determine whether this commit requires GitOps reconciliation
        id: deployment-scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'deployment_required=true' >> "$GITHUB_OUTPUT"
            echo 'Manual release-gate dispatch requires GitOps reconciliation.'
            exit 0
          fi

          before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          after="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$after" ]; then
            after="$GITHUB_SHA"
          fi

          files=""
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && [ "$before" != "$after" ]; then
            compare="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/compare/${before}...${after}")"
            files="$(jq -r '.files[]?.filename // empty' <<<"$compare")"
          fi

          echo 'Changed files from push comparison:'
          printf '%s\n' "$files"

          image_build_required=false
          if grep -Eq '^(platform/|enketo/|billing-engine/|services/vpn-service/|shared/|\.github/workflows/build-platform\.yml$)' <<<"$files"; then
            image_build_required=true
          fi
          echo "image_build_required=$image_build_required" >> "$GITHUB_OUTPUT"

          if grep -Eq '^(k8s/|ops/cloudflare/|platform/|services/|billing-engine/|enketo/|shared/|\.github/workflows/(self-hosted-k3s-gitops|build-platform)\.yml$)' <<<"$files"; then
            echo 'deployment_required=true' >> "$GITHUB_OUTPUT"
            echo 'This push changes application or deployment-controlled files; image promotion and/or matching self-hosted GitOps reconciliation is required.'
          else
            echo 'deployment_required=false' >> "$GITHUB_OUTPUT"
            echo 'No application or deployment-controlled files changed; self-hosted GitOps reconciliation is not required for this push.'
          fi

      - name: Wait for image build and promotion
        if: steps.deployment-scope.outputs.image_build_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='build-platform.yml'
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=50" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | reverse | .[0] // empty')"
            if [ -n "$runs" ]; then
              run_id="$(jq -r '.id' <<<"$runs")"
              status="$(jq -r '.status' <<<"$runs")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$runs")"
              echo "image build/promotion run=$run_id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            else
              echo "Waiting for image build/promotion run for $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "Timed out waiting for image build/promotion for $GITHUB_SHA"
          exit 1

      - name: Wait for matching self-hosted deployment run
        if: steps.deployment-scope.outputs.deployment_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_BUILD_REQUIRED: ${{ steps.deployment-scope.outputs.image_build_required }}
        run: |
          set -euo pipefail
          workflow='self-hosted-k3s-gitops.yml'
          if [ "$IMAGE_BUILD_REQUIRED" = "true" ]; then
            expected_sha="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          else
            expected_sha="$GITHUB_SHA"
          fi
          echo "Waiting for GitOps reconciliation at expected revision $expected_sha"
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=""
            for api_attempt in 1 2 3 4 5; do
              if response="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=50" 2>/tmp/shopnoltd-gh-api-error.json)"; then
                break
              fi
              echo "GitHub Actions API request failed (attempt $api_attempt/5); retrying."
              if [ "$api_attempt" -lt 5 ]; then sleep "$((api_attempt * 2))"; fi
            done
            if [ -z "$response" ]; then
              echo "GitHub Actions API unavailable; retrying reconciliation poll in 15 seconds."
              sleep 15
              continue
            fi
            runs="$(jq -r --arg sha "$expected_sha" '[.workflow_runs[]? | select(.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | reverse | .[0] // empty' <<<"$response")"
            if [ -n "$runs" ]; then
              run_id="$(jq -r '.id' <<<"$runs")"
              status="$(jq -r '.status' <<<"$runs")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$runs")"
              echo "self-hosted-k3s-gitops run=$run_id revision=$expected_sha status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            else
              echo "Waiting for self-hosted-k3s-gitops run for $expected_sha"
            fi
            sleep 15
          done
          echo "Timed out waiting for self-hosted k3s GitOps reconciliation at $expected_sha."
          exit 1

      - name: Confirm GitOps was not required
        if: steps.deployment-scope.outputs.deployment_required == 'false'
        run: echo 'GitOps deployment gate satisfied because this push has no deployment-controlled changes.'

  public-smoke:
    name: Public endpoint smoke tests
    needs:
      - repository-validation
      - wait-for-gitops
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Public endpoints represented by the Services catalog. A 2xx/3xx or
          # authentication response (401/403) proves the route is reachable without
          # pretending that an authenticated application session is healthy.
          - { name: root, url: 'https://shopnoltd.dpdns.org' }
          - { name: api, url: 'https://api.shopnoltd.dpdns.org/healthz' }
          - { name: auth, url: 'https://auth.shopnoltd.dpdns.org' }
          - { name: kobo, url: 'https://kobo.shopnoltd.dpdns.org' }
          - { name: chat, url: 'https://chat.shopnoltd.dpdns.org' }
          # The Meet backend is deployed, but its current public ingress exposes
          # only authenticated application routes; there is no public unauthenticated
          # Meet health route or Jitsi frontend hostname. The API gateway health check
          # above covers the shared API ingress, so Meet is intentionally not a
          # mandatory anonymous smoke endpoint until its public frontend/health route exists.
          # Owncast, code-server, Gitea, and n8n are intentionally scaled to zero and
          # therefore are not mandatory production endpoints.
          - { name: mail, url: 'https://mail-api.shopnoltd.dpdns.org/healthz' }
          - { name: enketo, url: 'https://enketo.shopnoltd.dpdns.org' }
          - { name: chatwoot, url: 'https://chatwoot.shopnoltd.dpdns.org' }
          - { name: remote, url: 'https://remote.shopnoltd.dpdns.org' }
          - { name: vpn, url: 'https://vpn.shopnoltd.dpdns.org/healthz' }
          - { name: webmail, url: 'https://webmail.shopnoltd.dpdns.org' }
          - { name: admin-portal, url: 'https://admin-portal.shopnoltd.dpdns.org' }
          - { name: devices, url: 'https://devices.shopnoltd.dpdns.org' }
          - { name: argocd, url: 'https://argocd.shopnoltd.dpdns.org' }
          - { name: ai, url: 'https://ai-platform.shopnoltd.dpdns.org/healthz' }
          - { name: billing, url: 'https://billing.shopnoltd.dpdns.org/health' }
          - { name: payment, url: 'https://payment.shopnoltd.dpdns.org/healthz' }
          - { name: exchange, url: 'https://exchange.shopnoltd.dpdns.org/healthz' }
          - { name: domain, url: 'https://domain.shopnoltd.dpdns.org/healthz' }
          - { name: android-cloud, url: 'https://android.shopnoltd.dpdns.org' }
          - { name: social, url: 'https://social.shopnoltd.dpdns.org/healthz' }
    steps:
      - name: Probe ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          url='${{ matrix.url }}'
          ok=0
          attempts=5
          if [ '${{ matrix.name }}' = 'chat' ]; then
            attempts=12
          fi
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -k -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            case "$code" in
              2*|3*|401|403)
                ok=1
                echo "${{ matrix.name }} reachable with HTTP $code"
                break
                ;;
              *)
                echo "${{ matrix.name }} attempt $attempt/$attempts returned HTTP ${code:-000}"
                if [ "$attempt" -lt "$attempts" ]; then
                  sleep 10
                fi
                ;;
            esac
          done
          test "$ok" -eq 1

  adsense-live:
    name: Live AdSense verification
    needs:
      - repository-validation
      - wait-for-gitops
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live ads.txt publisher authorization
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 -fsSL https://shopnoltd.dpdns.org/ads.txt -o /tmp/shopnoltd-ads.txt
          expected='google.com, pub-4532970890139771, DIRECT, f08c47fec0942fa0'
          grep -Fxq "$expected" /tmp/shopnoltd-ads.txt
          echo 'Live ads.txt serves the expected AdSense publisher record.'

      - name: Verify live homepage AdSense script is present exactly once
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 -fsSL https://shopnoltd.dpdns.org/ -o /tmp/shopnoltd-homepage.html
          script='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4532970890139771'
          count="$(grep -oF "$script" /tmp/shopnoltd-homepage.html | wc -l)"
          echo "Live AdSense script occurrences: $count"
          test "$count" -eq 1
          grep -Fq 'google-adsense-account' /tmp/shopnoltd-homepage.html

  release-summary:
    name: Release gate summary
    needs:
      - repository-validation
      - wait-for-gitops
      - public-smoke
      - adsense-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require repository validation on every event
        shell: bash
        run: |
          set -euo pipefail
          echo "repository-validation=${{ needs.repository-validation.result }}"
          test '${{ needs.repository-validation.result }}' = success

      - name: Require GitOps reconciliation on deployed events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "wait-for-gitops=${{ needs.wait-for-gitops.result }}"
          test '${{ needs.wait-for-gitops.result }}' = success

      - name: Require production smoke on deployed events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "public-smoke=${{ needs.public-smoke.result }}"
          test '${{ needs.public-smoke.result }}' = success

      - name: Require live AdSense verification on deployed events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "adsense-live=${{ needs.adsense-live.result }}"
          test '${{ needs.adsense-live.result }}' = success
