name: Production Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar -xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          test -d k8s
          test -n "$(find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print -quit)"
          kustomize build k8s/ > /tmp/release-gate-rendered.yaml
          test -s /tmp/release-gate-rendered.yaml

      - name: Validate frontend route contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('platform/web-portal/src/main.jsx').read_text()
          required = [
              '/discover', '/feed', '/post/:id', '/work', '/work/:id', '/create-work',
              '/my-created-work', '/my-active-work', '/my-submission', '/work-review',
              '/account', '/notifications', '/blog', '/blog/:slug', '/my-blog',
              '/domain-registration', '/domain-management', '/ai', '/billing',
              '/payments', '/transactions', '/wallet', '/wallet/ledger', '/exchange',
              '/reports', '/admin', '/admin/database', '/admin/blog', '/admin/infrastructure',
          ]
          missing = [route for route in required if f'path="{route}"' not in text]
          if missing:
              raise SystemExit('Missing frontend routes: ' + ', '.join(missing))
          print(f'Validated {len(required)} required frontend routes.')
          PY

      - name: Validate financial and verified-work contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s platform/api-service/app/api/v3_work.py
          test -s platform/api-service/app/models/work_evidence.py
          test -s platform/web-portal/src/pages/WorkHub.jsx
          test -s platform/web-portal/src/pages/FinancialCenter.jsx
          test -s platform/web-portal/src/pages/CheckoutCurrencySafe.jsx
          test -s billing-engine/app/fx.py
          test -s billing-engine/app/ledger.py
          test -s platform/api-service/app/core/financial_registry.py
          test -s billing-engine/app/moneybag_routes.py
          test -s platform/payment-service/migrations/versions/0004_transaction_ownership.py
          test -s platform/android-cloud/controller/main.py
          test -s platform/android-cloud/gateway/Dockerfile
          test -s platform/android-cloud/web/src/main.jsx
          test -s k8s/services/android-cloud/kustomization.yaml
          test -s k8s/services/vpn-service.yaml
          test -s k8s/services/vpn-service-ingress.yaml
          test -s k8s/services/social-service/ingress.yaml
          test -s k8s/services/chatwoot/deployment.yaml

      - name: Validate release gate documentation
        run: test -s docs/OBSERVABILITY-RELEASE-GATE.md

  wait-for-gitops:
    name: Wait for self-hosted k3s reconciliation
    needs: repository-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Determine whether this commit requires GitOps reconciliation
        id: deployment-scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'deployment_required=true' >> "$GITHUB_OUTPUT"
            echo 'Manual release-gate dispatch requires GitOps reconciliation.'
            exit 0
          fi

          files="$(python3 - <<'PY'
          import json, os
          event_path = os.environ['GITHUB_EVENT_PATH']
          event = json.load(open(event_path, encoding='utf-8'))
          seen = []
          for commit in event.get('commits', []):
              for key in ('added', 'modified', 'removed'):
                  for path in commit.get(key, []) or []:
                      if path not in seen:
                          seen.append(path)
          print('\n'.join(seen))
          PY
          )"

          echo 'Changed files from push event:'
          printf '%s\n' "$files"

          if grep -Eq '^(k8s/|ops/cloudflare/|\.github/workflows/self-hosted-k3s-gitops\.yml$)' <<<"$files"; then
            echo 'deployment_required=true' >> "$GITHUB_OUTPUT"
            echo 'This push changes deployment-controlled files; a matching self-hosted GitOps run is required.'
          else
            echo 'deployment_required=false' >> "$GITHUB_OUTPUT"
            echo 'No deployment-controlled files changed; self-hosted GitOps reconciliation is not required for this push.'
          fi

      - name: Wait for matching self-hosted deployment run
        if: steps.deployment-scope.outputs.deployment_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='self-hosted-k3s-gitops.yml'
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=push&per_page=20" \
              | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty')"
            if [ -n "$runs" ]; then
              run_id="$(jq -r '.id' <<<"$runs")"
              status="$(jq -r '.status' <<<"$runs")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$runs")"
              echo "self-hosted-k3s-gitops run=$run_id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                exit 0
              fi
            else
              echo "Waiting for self-hosted-k3s-gitops run for $GITHUB_SHA"
            fi
            sleep 15
          done
          echo 'Timed out waiting for self-hosted k3s GitOps reconciliation.'
          exit 1

      - name: Confirm GitOps was not required
        if: steps.deployment-scope.outputs.deployment_required == 'false'
        run: echo 'GitOps deployment gate satisfied because this push has no deployment-controlled changes.'

  public-smoke:
    name: Public endpoint smoke tests
    needs:
      - repository-validation
      - wait-for-gitops
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: root, url: 'https://shopnoltd.dpdns.org' }
          - { name: api, url: 'https://api.shopnoltd.dpdns.org/healthz' }
          - { name: auth, url: 'https://auth.shopnoltd.dpdns.org' }
          - { name: ai, url: 'https://ai-platform.shopnoltd.dpdns.org/healthz' }
          - { name: billing, url: 'https://billing.shopnoltd.dpdns.org/health' }
          - { name: payment, url: 'https://payment.shopnoltd.dpdns.org/healthz' }
          - { name: exchange, url: 'https://exchange.shopnoltd.dpdns.org/healthz' }
          - { name: domain, url: 'https://domain.shopnoltd.dpdns.org/healthz' }
          - { name: devices, url: 'https://devices.shopnoltd.dpdns.org' }
          - { name: android-cloud, url: 'https://android.shopnoltd.dpdns.org' }
          - { name: chat, url: 'https://chat.shopnoltd.dpdns.org' }
          - { name: social, url: 'https://social.shopnoltd.dpdns.org/healthz' }
          - { name: vpn, url: 'https://vpn.shopnoltd.dpdns.org/healthz' }
    steps:
      - name: Probe ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          url='${{ matrix.url }}'
          ok=0
          attempts=5
          if [ '${{ matrix.name }}' = 'chat' ]; then
            attempts=12
          fi
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -k -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            case "$code" in
              2*|3*|401|403)
                ok=1
                echo "${{ matrix.name }} reachable with HTTP $code"
                break
                ;;
              *)
                echo "${{ matrix.name }} attempt $attempt/$attempts returned HTTP ${code:-000}"
                if [ "$attempt" -lt "$attempts" ]; then
                  sleep 10
                fi
                ;;
            esac
          done
          test "$ok" -eq 1

  release-summary:
    name: Release gate summary
    needs:
      - repository-validation
      - wait-for-gitops
      - public-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require repository validation on every event
        shell: bash
        run: |
          set -euo pipefail
          echo "repository-validation=${{ needs.repository-validation.result }}"
          test '${{ needs.repository-validation.result }}' = success

      - name: Require GitOps reconciliation on deployed events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "wait-for-gitops=${{ needs.wait-for-gitops.result }}"
          test '${{ needs.wait-for-gitops.result }}' = success

      - name: Require production smoke on deployed events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "public-smoke=${{ needs.public-smoke.result }}"
          test '${{ needs.public-smoke.result }}' = success
