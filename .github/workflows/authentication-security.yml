name: Authentication security contract

on:
  pull_request:
    paths:
      - "platform/auth-service/**"
      - "platform/**/app/core/security.py"
      - "platform/**/app/security.py"
      - "platform/shared/**"
      - "shared/libraries/python/shopno_core/**"
      - "tests/security/**"
      - ".github/workflows/authentication-security.yml"
  push:
    branches: [main]
    paths:
      - "platform/auth-service/**"
      - "platform/**/app/core/security.py"
      - "platform/**/app/security.py"
      - "platform/shared/**"
      - "shared/libraries/python/shopno_core/**"
      - "tests/security/**"
      - ".github/workflows/authentication-security.yml"

permissions:
  contents: read

jobs:
  auth-service-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth-service dependencies and test tooling
        run: python -m pip install -r platform/auth-service/requirements.txt pytest==8.4.1 pytest-asyncio==0.24.0
      - name: Run authentication security tests
        env:
          PYTHONPATH: platform/auth-service:shared/libraries/python
        run: python -m unittest discover -s platform/auth-service/tests -p "test_*.py" -v
