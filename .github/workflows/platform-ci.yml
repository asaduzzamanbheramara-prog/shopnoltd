name: Shopnoltd Platform CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-syntax:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            billing-engine/app \
            platform/ai-platform/app \
            platform/api-service/app \
            platform/domain-service/app \
            platform/payment-service/app \
            platform/social-service/app \
            platform/oauth-service/app \
            platform/interior-service/app \
            platform/license-service/app \
            platform/training-service/app \
            shared/libraries/python/shopno_core

  domain-service-tests:
    name: Domain service pricing regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: platform/domain-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install domain service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test registrar pricing safeguards
        run: pytest -q tests/test_namecheap_pricing.py

  web-portal:
    name: Web portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web-portal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/web-portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify crawlable SEO HTML and canonical URLs
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import assert from 'node:assert/strict'

          const root = await readFile('dist/index.html', 'utf8')
          const pricing = await readFile('dist/pricing/index.html', 'utf8')
          assert.match(root, /<link rel="canonical" href="https:\/\/shopnoltd\.dpdns\.org\/"\s*\/>/)
          assert.match(root, /<h1>Shopnoltd — Digital Services, Domains &amp; Business Tools<\/h1>/)
          assert.match(pricing, /<link rel="canonical" href="https:\/\/shopnoltd\.dpdns\.org\/pricing"\s*\/>/)
          assert.match(pricing, /<h1>Shopnoltd Pricing<\/h1>/)
          assert.match(pricing, /<th scope="row">Enterprise<\/th>/)
          assert.match(pricing, /Confirm the selected plan and final payable amount at checkout/)
          assert.doesNotMatch(pricing, /<link rel="canonical" href="https:\/\/shopnoltd\.dpdns\.org\/"\s*\/>/)
          console.log('SEO HTML checks passed for homepage and pricing route.')
          NODE

  migration-shape:
    name: Payment migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration revision chain
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          versions = Path("platform/payment-service/migrations/versions")
          revisions = {}
          for path in sorted(versions.glob("*.py")):
              tree = ast.parse(path.read_text(), filename=str(path))
              values = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              try:
                                  values[target.id] = ast.literal_eval(node.value)
                              except Exception:
                                  pass
              if "revision" in values:
                  revisions[values["revision"]] = values.get("down_revision")

          required = {"0001", "0002_admin_audit_log", "0003_webhook_events", "0004_transaction_ownership", "0005_direct_payments", "0006_payment_accounts"}
          missing = required - revisions.keys()
          if missing:
              raise SystemExit(f"payment migration chain missing: {sorted(missing)}")
          if revisions["0001"] is not None:
              raise SystemExit("0001 must be the root migration")
          if revisions["0002_admin_audit_log"] != "0001":
              raise SystemExit("0002_admin_audit_log must revise 0001")
          if revisions["0003_webhook_events"] != "0002_admin_audit_log":
              raise SystemExit("0003_webhook_events must revise 0002_admin_audit_log")
          if revisions["0004_transaction_ownership"] != "0003_webhook_events":
              raise SystemExit("0004_transaction_ownership must revise 0003_webhook_events")
          if revisions["0005_direct_payments"] != "0004_transaction_ownership":
              raise SystemExit("0005_direct_payments must revise 0004_transaction_ownership")
          if revisions["0006_payment_accounts"] != "0005_direct_payments":
              raise SystemExit("0006_payment_accounts must revise 0005_direct_payments")

          children = {rev: 0 for rev in revisions}
          for down in revisions.values():
              if isinstance(down, str) and down in children:
                  children[down] += 1
          heads = sorted(rev for rev, count in children.items() if count == 0)
          if heads != ["0006_payment_accounts"]:
              raise SystemExit(f"expected one Alembic head at 0006_payment_accounts, got {heads}")
          print("payment migration chain OK: 0001 -> 0002_admin_audit_log -> 0003_webhook_events -> 0004_transaction_ownership -> 0005_direct_payments -> 0006_payment_accounts")
          PY

  api-sql-guard-tests:
    name: API SQL guard unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api-service
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/postgres
      PYTHONPATH: .:../../shared/libraries/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test guarded SQL table references
        run: pytest -q tests/test_database_control_sql_guard.py


  service-contract-tests:
    name: "${{ matrix.service }} isolated ASGI contract tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: interior
            path: platform/interior-service
          - service: license
            path: platform/license-service
          - service: training
            path: platform/training-service
    defaults:
      run:
        working-directory: "${{ matrix.path }}"
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:1/test
      REDIS_HOST: 127.0.0.1
      PYTHONPATH: .:../../shared/libraries/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated service test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test health, metrics, and API route contracts without starting lifespan
        run: pytest -q tests/test_app_contract.py


  social-service-executor-tests:
    name: Social service provider executor contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/social-service
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:1/test
      PYTHONPATH: .
      OMNICHANNEL_EXECUTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install social service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test provider request contracts and fail-closed approval
        run: pytest -q tests/test_omnichannel_executor.py
