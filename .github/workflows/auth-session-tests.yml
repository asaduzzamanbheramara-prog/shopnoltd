name: Auth Session Identity Tests

on:
  pull_request:
    paths:
      - "platform/auth-service/**"
      - "platform/web-portal/**"
      - "shared/libraries/python/**"
      - ".github/workflows/auth-session-tests.yml"
  push:
    branches:
      - main
    paths:
      - "platform/auth-service/**"
      - "shared/libraries/python/**"
      - ".github/workflows/auth-session-tests.yml"

permissions:
  contents: read

jobs:
  auth-session-tests:
    name: Auth session identity regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ../../shared/libraries/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/auth-service/requirements.txt
      - name: Install auth-service dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/auth-service/requirements.txt pytest==8.4.1 pytest-asyncio==0.24.0
      - name: Run auth identity tests
        working-directory: platform/auth-service
        run: python -m pytest -q --strict-markers tests/test_auth_identity.py

  web-portal-session-tests:
    name: Web portal account-switch and refresh regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run web portal regression tests
        working-directory: platform/web-portal
        run: node --test tests/*.test.js
