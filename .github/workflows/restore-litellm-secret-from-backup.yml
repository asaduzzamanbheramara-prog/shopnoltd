name: Audit or restore LiteLLM provider Secret from encrypted backup

on:
  workflow_dispatch:
    inputs:
      apply_restore:
        description: Apply the backup Secret only if every key matches the running LiteLLM pod environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit-or-restore:
    name: Compare encrypted backup with running LiteLLM environment
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Checkout encrypted backup branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: database-backups
          path: backup-source
          fetch-depth: 1
          persist-credentials: false

      - name: Decrypt, compare, and optionally restore one Secret
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          APPLY_RESTORE: ${{ inputs.apply_restore }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd backup-source/backup
          sha256sum -c latest.kubernetes-secrets.json.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.kubernetes-secrets.json.enc \
            -out "$RUNNER_TEMP/kubernetes-secrets.json" \
            -pass env:BACKUP_ENCRYPTION_KEY
          python3 - "$RUNNER_TEMP/kubernetes-secrets.json" <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          with open(sys.argv[1], encoding='utf-8') as stream:
              export = json.load(stream)
          matches = [item for item in export.get('items', []) if item.get('kind') == 'Secret' and item.get('metadata', {}).get('namespace') == 'shopno-ai' and item.get('metadata', {}).get('name') == 'litellm-provider-keys']
          if len(matches) != 1:
              raise SystemExit('Expected exactly one shopno-ai/litellm-provider-keys Secret in the encrypted snapshot')
          backup_secret = matches[0]
          backup_data = backup_secret.get('data') or {}
          if not backup_data:
              raise SystemExit('The encrypted backup Secret has no data keys')

          live_secret = json.loads(subprocess.check_output(['kubectl', '-n', 'shopno-ai', 'get', 'secret', 'litellm-provider-keys', '-o', 'json']))
          print(f"Current live Secret data key count: {len(live_secret.get('data') or {})}")
          print(f"Encrypted backup Secret data key count: {len(backup_data)}")

          pod_list = json.loads(subprocess.check_output(['kubectl', '-n', 'shopno-ai', 'get', 'pods', '-l', 'app.kubernetes.io/name=litellm-proxy', '-o', 'json']))
          ready_pods = [pod for pod in pod_list.get('items', []) if pod.get('status', {}).get('phase') == 'Running']
          if not ready_pods:
              raise SystemExit('No running LiteLLM pod is available for a read-only comparison')
          pod_name = ready_pods[0]['metadata']['name']
          key_names = sorted(backup_data)
          python_probe = 'import os,json,base64; names=' + repr(key_names) + '; print(json.dumps({k:base64.b64encode(os.environ[k].encode()).decode() for k in names if k in os.environ}))'
          pod_env = json.loads(subprocess.check_output(['kubectl', '-n', 'shopno-ai', 'exec', pod_name, '-c', 'litellm', '--', 'python', '-c', python_probe]))

          all_match = True
          for name, encoded in sorted(backup_data.items()):
              raw = base64.b64decode(encoded)
              same = pod_env.get(name) == encoded
              all_match = all_match and same
              print(f"{name}: backup_bytes={len(raw)} running_pod={'present' if name in pod_env else 'missing'} matches_running_pod={'yes' if same else 'no'}")
          print(f"All backup values match the currently running LiteLLM pod: {all_match}")

          gemini_encoded = backup_data.get('GEMINI_API_KEY')
          if gemini_encoded:
              gemini_key = base64.b64decode(gemini_encoded).decode('utf-8')
              url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + gemini_key
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept':'application/json'}), timeout=15) as response:
                      payload = json.loads(response.read(20000).decode('utf-8', 'replace'))
                      print(f"Backup Gemini API validation: HTTP {response.status}; models={len(payload.get('models', []))}; authentication=accepted")
              except urllib.error.HTTPError as error:
                  print(f"Backup Gemini API validation: HTTP {error.code}; authentication={'rejected' if error.code in (400,401,403) else 'indeterminate'}")
              except Exception as error:
                  print(f"Backup Gemini API validation: network_error={type(error).__name__}; authentication=indeterminate")

          if os.environ.get('APPLY_RESTORE', 'false').lower() == 'true':
              if not all_match:
                  raise SystemExit('Restore refused: backup values do not all match the running LiteLLM pod')
              restored = {
                  'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {'name': 'litellm-provider-keys', 'namespace': 'shopno-ai'},
                  'type': backup_secret.get('type', 'Opaque'),
                  'data': backup_data,
              }
              subprocess.run(['kubectl', 'apply', '-f', '-'], input=json.dumps(restored), text=True, check=True, stdout=subprocess.PIPE)
              print('RESTORE APPLIED: only shopno-ai/litellm-provider-keys was restored from the encrypted backup.')
              print('No pod restart was triggered; running environment values were verified identical before restore.')
          else:
              print('AUDIT ONLY: no production Secret was changed.')
          PY

      - name: Remove decrypted Secret export
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/kubernetes-secrets.json"
