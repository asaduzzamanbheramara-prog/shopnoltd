name: Deploy K8s Validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-manifests:
    name: Validate all kustomize overlays build cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar -xz
          sudo mv kustomize /usr/local/bin/
      - name: Build root kustomization (dry validation only)
        run: kustomize build k8s/ > /tmp/rendered.yaml
      - name: Confirm output is non-empty
        run: test -s /tmp/rendered.yaml
