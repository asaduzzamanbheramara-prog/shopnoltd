name: Keycloak SMTP authentication check
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-smtp-auth-check
  cancel-in-progress: false

jobs:
  smtp-auth:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Verify SMTP relay authentication without sending email
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import smtplib
          import ssl
          import subprocess

          namespace = "shopno-identity"

          def resource(kind, name):
              raw = subprocess.check_output(
                  ["kubectl", "--request-timeout=15s", "-n", namespace,
                   "get", kind, name, "-o", "json"],
                  text=True,
              )
              return json.loads(raw)

          config = resource("configmap", "keycloak-smtp-config").get("data", {})
          secret = resource("secret", "keycloak-smtp-secret").get("data", {})

          def secret_value(key):
              encoded = secret.get(key)
              if not encoded:
                  raise RuntimeError(f"Required SMTP secret field is missing: {key}")
              return base64.b64decode(encoded, validate=True).decode("utf-8")

          host = config.get("SMTP_HOST", "").strip()
          port = int(config.get("SMTP_PORT", "587"))
          username = secret_value("SMTP_USERNAME")
          password = secret_value("SMTP_PASSWORD")
          if not host or not username or not password:
              raise RuntimeError("SMTP host or authentication configuration is incomplete")
          if port != 587:
              raise RuntimeError("This check expects the configured STARTTLS submission port 587")

          context = ssl.create_default_context()
          with smtplib.SMTP(host, port, timeout=20) as client:
              client.ehlo()
              client.starttls(context=context)
              client.ehlo()
              client.login(username, password)
              print("[PASS] SMTP STARTTLS and username/password authentication accepted.")
              print("[SCOPE] Authentication-only check; no message or recipient was submitted.")
          PY
