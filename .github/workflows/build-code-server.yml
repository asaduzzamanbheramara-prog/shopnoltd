name: Build Shopnltd Code IDE

on:
  push:
    branches:
      - main
    paths:
      - "k8s/services/code-server/image/**"
      - "k8s/services/code-server/deployment.yaml"
      - "k8s/services/code-server-isolated/**"
      - ".github/workflows/build-code-server.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: code-server-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/asaduzzamanbheramara-prog/shopnoltd-code-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./k8s/services/code-server/image
          file: ./k8s/services/code-server/image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote immutable image to GitOps
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          image = os.environ["IMAGE"]
          paths = [
              Path("k8s/services/code-server/deployment.yaml"),
              Path("k8s/services/code-server/kustomization.yaml"),
              Path("k8s/services/code-server-isolated/kustomization.yaml"),
          ]
          for path in paths:
              text = path.read_text()
              if path.name == "deployment.yaml":
                  pattern = r'(?m)^([ \t]+image:) ghcr\.io/asaduzzamanbheramara-prog/shopnoltd-code-server:[^\n]+$'
                  updated, count = re.subn(pattern, rf'\1 {image}', text, count=1)
              else:
                  pattern = r'(?m)^([ \t]+newTag:) [^\n]+$'
                  updated, count = re.subn(pattern, rf'\1 {os.environ["GITHUB_SHA"]}', text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected exactly one code-server image reference in {path}")
              path.write_text(updated)
          PY
          git diff --check
          git diff -- k8s/services/code-server/deployment.yaml k8s/services/code-server/kustomization.yaml k8s/services/code-server-isolated/kustomization.yaml

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/services/code-server/deployment.yaml k8s/services/code-server/kustomization.yaml k8s/services/code-server-isolated/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps image change required."
            exit 0
          fi
          git commit -m "chore: update code-server image to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
