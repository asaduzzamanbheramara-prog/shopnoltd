name: Audit encrypted Kubernetes Secret backup metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect encrypted Secret backup without revealing values
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout encrypted backup branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: database-backups
          path: backup-source
          fetch-depth: 1
          persist-credentials: false

      - name: Decrypt and inspect Secret metadata only
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd backup-source/backup
          test -s latest.kubernetes-secrets.json.enc
          test -s latest.kubernetes-secrets.json.enc.sha256
          sha256sum -c latest.kubernetes-secrets.json.enc.sha256
          echo "Backup snapshot timestamp: $(cat timestamp.txt)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in latest.kubernetes-secrets.json.enc \
            -out "$RUNNER_TEMP/kubernetes-secrets.json" \
            -pass env:BACKUP_ENCRYPTION_KEY
          python3 - "$RUNNER_TEMP/kubernetes-secrets.json" <<'PY'
          import base64
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              export = json.load(stream)
          items = export.get("items", [])
          if export.get("kind") != "List" or not items:
              raise SystemExit("Decrypted Secret export is invalid")
          target = [item for item in items if item.get("metadata", {}).get("namespace") == "shopno-ai" and item.get("metadata", {}).get("name") == "litellm-provider-keys"]
          print(f"Secret objects in snapshot: {len(items)}")
          print(f"shopno-ai/litellm-provider-keys present: {bool(target)}")
          for item in target:
              data = item.get("data") or {}
              print("litellm-provider-keys data key names: " + (", ".join(sorted(data)) if data else "(none)"))
              for name in ("AI_DATABASE_URL", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY", "AZURE_API_KEY"):
                  value = data.get(name)
                  decoded = base64.b64decode(value) if value else b""
                  print(f"{name}: present={bool(value)} bytes={len(decoded)}")
          gemini = []
          for item in items:
              data = item.get("data") or {}
              value = data.get("GEMINI_API_KEY")
              if value:
                  decoded = base64.b64decode(value)
                  meta = item.get("metadata", {})
                  gemini.append((meta.get("namespace", ""), meta.get("name", ""), len(decoded)))
          print(f"Gemini key copies in backup: {len(gemini)}")
          for namespace, name, size in gemini:
              print(f"Gemini source {namespace}/{name}: present=True bytes={size}")
          print("No Secret values were printed or uploaded.")
          PY

      - name: Remove decrypted Secret export
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/kubernetes-secrets.json"
