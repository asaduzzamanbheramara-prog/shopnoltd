        run: |
          set +e
          rm -rf "$BACKUP_WORKDIR" /tmp/shopnoltd-restore-test.dump /tmp/shopnoltd-secrets-restore-test.json /tmp/shopnoltd-recovery-material.tar.gz /tmp/shopnoltd-recovery-material-list.txt
