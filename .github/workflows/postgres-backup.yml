name: Shopnoltd encrypted multi-store disaster-recovery backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-backup.yml'
      - '.github/workflows/backup-static-validation.yml'
      - 'ops/backup/**'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopnoltd-disaster-recovery-backup
  cancel-in-progress: false

env:
  POSTGRES_NAMESPACE: shopno-data
  POSTGRES_DEPLOYMENT: postgres
  DATA_NAMESPACE: shopno-data
  BACKUP_BRANCH: database-backups
  BACKUP_WORKDIR: ${{ vars.BACKUP_WORKDIR || '/mnt/d/shopnoltd-dr-backup' }}
  MIN_BACKUP_FREE_KB: '20971520'

jobs:
  backup:
    name: Create, encrypt, validate and version multi-store backup
    runs-on: [self-hosted, linux]
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight runner and cluster permissions
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          run_dir="${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          BACKUP_WORKDIR="${BACKUP_WORKDIR%/}/run-${run_dir}"
          echo "BACKUP_WORKDIR=$BACKUP_WORKDIR" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$BACKUP_WORKDIR")"
          test ! -e "$BACKUP_WORKDIR" || { echo "::error::Refusing to reuse existing backup staging directory."; exit 1; }
          for cmd in kubectl openssl sha256sum python3 tar gzip git sudo df; do command -v "$cmd" >/dev/null; done
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          test -f "${KUBECONFIG:-$HOME/.kube/config}" || { echo "::error::KUBECONFIG is missing."; exit 1; }
          kubectl cluster-info >/dev/null
          kubectl -n "$POSTGRES_NAMESPACE" get deployment "$POSTGRES_DEPLOYMENT" >/dev/null
          kubectl -n "$DATA_NAMESPACE" get deployment mongo redis minio >/dev/null
          kubectl auth can-i list secrets --all-namespaces | grep -qx yes
          kubectl auth can-i get pods -n "$POSTGRES_NAMESPACE" | grep -qx yes
          kubectl auth can-i create pods/exec -n "$POSTGRES_NAMESPACE" | grep -qx yes
          kubectl auth can-i get pods -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i list pods -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i watch pods -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i get persistentvolumeclaims -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i create pods -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i delete pods -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i create pods/exec -n "$DATA_NAMESPACE" | grep -qx yes
          kubectl auth can-i list persistentvolumeclaims --all-namespaces | grep -qx yes
          kubectl auth can-i get persistentvolumes | grep -qx yes
          sudo -n test -r /var/lib/rancher/k3s/server/token
          bash ./ops/backup/check-postgres-storage.sh
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"

      - name: Export all databases, object data and K3s bootstrap files
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          bash ./ops/backup/export-all-postgres-databases.sh
          test -s "$BACKUP_WORKDIR/postgres-all-databases.tar.gz"
          printf '%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" > "$BACKUP_WORKDIR/metadata/timestamp.txt"
          printf '%s\n' "$GITHUB_SHA" > "$BACKUP_WORKDIR/metadata/source-revision.txt"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$BACKUP_WORKDIR/postgres-all-databases.tar.gz" \
            -out "$BACKUP_WORKDIR/postgres-all-databases.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY

      - name: Export and encrypt all Kubernetes Secrets
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          kubectl get secrets --all-namespaces -o json > "$BACKUP_WORKDIR/kubernetes-secrets.json"
          python3 - "$BACKUP_WORKDIR/kubernetes-secrets.json" <<'PY'
          import json, sys
          doc=json.load(open(sys.argv[1], encoding="utf-8"))
          if doc.get("kind") != "List" or not doc.get("items"):
              raise SystemExit("Kubernetes Secret export is empty or malformed")
          print(f"Validated {len(doc['items'])} Kubernetes Secret objects.")
          PY
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$BACKUP_WORKDIR/kubernetes-secrets.json" \
            -out "$BACKUP_WORKDIR/kubernetes-secrets.json.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm -f "$BACKUP_WORKDIR/kubernetes-secrets.json"

      - name: Authenticate encrypted files and verify decryptability
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd "$BACKUP_WORKDIR"
          hmac_key="$(printf 'shopnoltd-backup-hmac-v1:%s' "$BACKUP_ENCRYPTION_KEY" | sha256sum | awk '{print $1}')"
          for file in postgres-all-databases.tar.gz.enc kubernetes-secrets.json.enc; do
            sha256sum "$file" > "$file.sha256"
            openssl dgst -sha256 -hmac "$hmac_key" "$file" | awk '{print $2}' > "$file.hmac"
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in postgres-all-databases.tar.gz.enc -out verify-data.tar.gz \
            -pass env:BACKUP_ENCRYPTION_KEY
          tar -tzf verify-data.tar.gz >/dev/null
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in kubernetes-secrets.json.enc -out verify-secrets.json \
            -pass env:BACKUP_ENCRYPTION_KEY
          python3 - verify-secrets.json <<'PY'
          import json, sys
          doc=json.load(open(sys.argv[1], encoding="utf-8"))
          if doc.get("kind") != "List" or not doc.get("items"):
              raise SystemExit("Decrypted Kubernetes Secret export is invalid")
          print(f"PASS: decrypted {len(doc['items'])} Secret objects.")
          PY
          for file in postgres-all-databases.tar.gz.enc kubernetes-secrets.json.enc; do
            sha256sum -c "$file.sha256"
            actual="$(openssl dgst -sha256 -hmac "$hmac_key" "$file" | awk '{print $2}')"
            expected="$(cat "$file.hmac")"
            test "$actual" = "$expected"
          done
          rm -f verify-data.tar.gz verify-secrets.json

      - name: Publish timestamped snapshot without overwriting history
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(cat "$BACKUP_WORKDIR/metadata/timestamp.txt")"
          snapshot="snapshots/$timestamp"
          git config user.name 'shopnoltd-backup-bot'
          git config user.email 'shopnoltd-backup-bot@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$BACKUP_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BACKUP_BRANCH"
            git checkout -B "$BACKUP_BRANCH" "origin/$BACKUP_BRANCH"
          else
            git checkout --orphan "$BACKUP_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          test ! -e "$snapshot" || { echo "::error::Snapshot already exists: $snapshot"; exit 1; }
          mkdir -p "$snapshot"
          cp "$BACKUP_WORKDIR/postgres-all-databases.tar.gz.enc"* "$snapshot/"
          cp "$BACKUP_WORKDIR/kubernetes-secrets.json.enc"* "$snapshot/"
          cp "$BACKUP_WORKDIR/metadata/"*.txt "$snapshot/"
          cat > "$snapshot/README.md" <<'EOF'
          Encrypted PostgreSQL all-database and CSV archive, MongoDB archive,
          Redis RDB, MinIO PVC archive, K3s bootstrap files, and Kubernetes Secret JSON.
          Key escrow is separate. No automatic deletion or force-push is performed.
          EOF
          git add "$snapshot"
          git commit -m "backup: encrypted multi-store snapshot $timestamp"
          git push origin "$BACKUP_BRANCH"

      - name: Remove plaintext staging files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$BACKUP_WORKDIR"
