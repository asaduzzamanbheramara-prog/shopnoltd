name: Shopnoltd encrypted disaster-recovery backup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/postgres-backup.yml'
      - 'ops/backup/check-postgres-storage.sh'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopnoltd-disaster-recovery-backup
  cancel-in-progress: false

env:
  POSTGRES_NAMESPACE: shopno-data
  POSTGRES_DEPLOYMENT: postgres
  BACKUP_BRANCH: database-backups
  BACKUP_WORKDIR: /tmp/shopnoltd-dr-backup
  K3S_STATE_ARCHIVE: /mnt/c/Users/asadu/k3s-state-backup.tgz
  CLOUDFLARED_DIR: /mnt/c/Users/asadu/.cloudflared

jobs:
  backup:
    name: Create, encrypt, verify and publish recovery snapshots
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check runner and cluster access
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for cmd in kubectl openssl sha256sum python3 tar git; do command -v "$cmd" >/dev/null; done
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing."; exit 1; }
          test -f "${KUBECONFIG:-$HOME/.kube/config}" || { echo "::error::KUBECONFIG is missing."; exit 1; }
          kubectl cluster-info >/dev/null
          kubectl -n "$POSTGRES_NAMESPACE" get deployment "$POSTGRES_DEPLOYMENT" >/dev/null
          kubectl auth can-i list secrets --all-namespaces | grep -qx yes
          bash ./ops/backup/check-postgres-storage.sh
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"

      - name: Export PostgreSQL and Kubernetes Secrets
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$BACKUP_WORKDIR"
          mkdir -p "$BACKUP_WORKDIR"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          raw_db="$BACKUP_WORKDIR/database.dump"
          raw_secrets="$BACKUP_WORKDIR/kubernetes-secrets.json"

          kubectl -n "$POSTGRES_NAMESPACE" exec "deployment/$POSTGRES_DEPLOYMENT" -- \
            sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; pg_dump --format=custom --no-owner --no-acl --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"' \
            > "$raw_db"
          test -s "$raw_db"

          kubectl get secrets --all-namespaces -o json > "$raw_secrets"
          python3 - "$raw_secrets" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", [])
          if data.get("kind") != "List" or not items:
              raise SystemExit("Kubernetes Secret export is empty or malformed")
          print(f"Exported {len(items)} Kubernetes Secret objects.")
          PY

          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$raw_db" \
            -out "$BACKUP_WORKDIR/latest.dump.enc" -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$raw_secrets" \
            -out "$BACKUP_WORKDIR/latest.kubernetes-secrets.json.enc" -pass env:BACKUP_ENCRYPTION_KEY
          rm -f "$raw_db" "$raw_secrets"
          cd "$BACKUP_WORKDIR"
          sha256sum latest.dump.enc > latest.dump.enc.sha256
          sha256sum latest.kubernetes-secrets.json.enc > latest.kubernetes-secrets.json.enc.sha256
          printf '%s\n' "$timestamp" > timestamp.txt
          printf '%s\n' "$GITHUB_SHA" > source-revision.txt

      - name: Package K3s and Cloudflare recovery credentials
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          stage="$BACKUP_WORKDIR/recovery-material"
          mkdir -p "$stage/cloudflared"

          if [[ ! -s "$K3S_STATE_ARCHIVE" ]]; then
            echo "::error::K3s recovery archive not found at configured path: $K3S_STATE_ARCHIVE"
            exit 1
          fi
          install -m 600 "$K3S_STATE_ARCHIVE" "$stage/k3s-state-backup.tgz"
          tar -tzf "$stage/k3s-state-backup.tgz" > "$BACKUP_WORKDIR/k3s-archive-list.txt"
          grep -Eq '(^|/)token$' "$BACKUP_WORKDIR/k3s-archive-list.txt" || { echo "::error::K3s archive lacks server token."; exit 1; }
          grep -Eq '(^|/)db/state.db$' "$BACKUP_WORKDIR/k3s-archive-list.txt" || { echo "::error::K3s archive lacks state DB."; exit 1; }

          if [[ ! -d "$CLOUDFLARED_DIR" ]]; then
            echo "::error::Cloudflare credentials directory not found: $CLOUDFLARED_DIR"
            exit 1
          fi
          find "$CLOUDFLARED_DIR" -maxdepth 1 -type f -exec install -m 600 {} "$stage/cloudflared/" \;
          find "$stage/cloudflared" -maxdepth 1 -type f -print -quit | grep -q . || {
            echo "::error::Cloudflare credentials directory is empty."
            exit 1
          }

          printf '%s\n' 'K3S_STATE_ARCHIVE=present' 'CLOUDFLARED=present' > "$BACKUP_WORKDIR/recovery-material-status.txt"
          tar -czf - -C "$stage" . | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -out "$BACKUP_WORKDIR/latest.recovery-material.tar.gz.enc" -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$BACKUP_WORKDIR/latest.recovery-material.tar.gz.enc"
          (cd "$BACKUP_WORKDIR" && sha256sum latest.recovery-material.tar.gz.enc > latest.recovery-material.tar.gz.enc.sha256)
          rm -rf "$stage"

      - name: Decrypt and validate all recovery snapshots
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          cd "$BACKUP_WORKDIR"
          sha256sum -c latest.dump.enc.sha256
          sha256sum -c latest.kubernetes-secrets.json.enc.sha256
          sha256sum -c latest.recovery-material.tar.gz.enc.sha256

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.dump.enc \
            -out database-restore-check.dump -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.kubernetes-secrets.json.enc \
            -out secrets-restore-check.json -pass env:BACKUP_ENCRYPTION_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in latest.recovery-material.tar.gz.enc \
            -out recovery-restore-check.tar.gz -pass env:BACKUP_ENCRYPTION_KEY

          python3 - secrets-restore-check.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", [])
          if data.get("kind") != "List" or not items:
              raise SystemExit("Decrypted Kubernetes Secret export is invalid")
          print(f"PASS: {len(items)} Kubernetes Secret objects decrypted and parsed.")
          PY
          tar -tzf recovery-restore-check.tar.gz > recovery-archive-list.txt
          grep -q 'k3s-state-backup.tgz' recovery-archive-list.txt
          grep -q 'cloudflared/' recovery-archive-list.txt
          tar -xOf recovery-restore-check.tar.gz ./k3s-state-backup.tgz > nested-k3s-check.tgz
          tar -tzf nested-k3s-check.tgz > nested-k3s-list.txt
          grep -Eq '(^|/)token$' nested-k3s-list.txt
          grep -Eq '(^|/)db/state.db$' nested-k3s-list.txt
          test -s database-restore-check.dump
          echo "PASS: encrypted PostgreSQL, Kubernetes Secrets, K3s archive/token/state DB and Cloudflare bundle validated."
          rm -f database-restore-check.dump secrets-restore-check.json recovery-restore-check.tar.gz recovery-archive-list.txt nested-k3s-check.tgz nested-k3s-list.txt k3s-archive-list.txt

      - name: Publish encrypted recovery snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'shopnoltd-backup-bot'
          git config user.email 'shopnoltd-backup-bot@users.noreply.github.com'
          git fetch origin "$BACKUP_BRANCH" || true
          git switch --orphan "$BACKUP_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          mkdir -p backup
          cp "$BACKUP_WORKDIR/latest.dump.enc" backup/
          cp "$BACKUP_WORKDIR/latest.dump.enc.sha256" backup/
          cp "$BACKUP_WORKDIR/latest.kubernetes-secrets.json.enc" backup/
          cp "$BACKUP_WORKDIR/latest.kubernetes-secrets.json.enc.sha256" backup/
          cp "$BACKUP_WORKDIR/latest.recovery-material.tar.gz.enc" backup/
          cp "$BACKUP_WORKDIR/latest.recovery-material.tar.gz.enc.sha256" backup/
          cp "$BACKUP_WORKDIR/recovery-material-status.txt" backup/
          cp "$BACKUP_WORKDIR/timestamp.txt" backup/
          cp "$BACKUP_WORKDIR/source-revision.txt" backup/
          cat > backup/README.md <<'EOF'
          # Shopnoltd encrypted disaster-recovery snapshots

          This branch contains encrypted PostgreSQL, all-namespace Kubernetes Secret,
          K3s host-state, and Cloudflare credential snapshots. The encryption key is
          supplied at runtime through BACKUP_ENCRYPTION_KEY and is never stored here.

          Never publish or apply decrypted files casually. Restore is a manual,
          reviewed disaster-recovery operation. GitHub Actions secret values cannot
          be exported; preserve them separately in a secure password manager.
          EOF
          git add backup
          git commit -m "backup: encrypted full disaster-recovery snapshot"
          git push --force origin "$BACKUP_BRANCH"

      - name: Remove temporary plaintext and staging files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$BACKUP_WORKDIR"
