name: All-user Keycloak readiness audit
# The targeted Keycloak sync workflow reconciles password-recovery SMTP before this read-only inventory runs.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *" # Daily at 03:15 UTC
  push:
    branches: [main]
    paths:
      - ".github/workflows/all-user-keycloak-readiness.yml"

permissions:
  contents: read

concurrency:
  group: all-user-keycloak-readiness
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only audit of every Keycloak account
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check cluster-held Keycloak bootstrap access
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "::error::kubectl is required on the trusted self-hosted runner."; exit 1; }
          test -s "${KUBECONFIG:-$HOME/.kube/config}" || { echo "::error::Runner kubeconfig is missing."; exit 1; }
          kubectl --request-timeout=15s -n shopno-identity get secret keycloak-secret -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d | grep -q . || {
            echo "::error::Keycloak bootstrap password is unavailable from the cluster secret; no credentials will be guessed."
            exit 1
          }
          echo "Cluster access and the existing Keycloak bootstrap secret are present. The workflow will provision/use a separate read-only audit client; no customer account will be modified."

      - name: Audit all users without changing accounts
        env:
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'shopnoltd' }}
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "::error::kubectl is required on the trusted self-hosted runner."; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required on the trusted self-hosted runner."; exit 1; }
          export KEYCLOAK_ADMIN_USER="admin"
          export KEYCLOAK_ADMIN_PASSWORD="$(kubectl -n shopno-identity get secret keycloak-secret -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d)"
          test -n "$KEYCLOAK_ADMIN_PASSWORD" || { echo "::error::Keycloak bootstrap credential is empty."; exit 1; }
          pf_log="${RUNNER_TEMP:-/tmp}/shopnoltd-keycloak-port-forward.log"
          kubectl -n shopno-identity port-forward --address 127.0.0.1 svc/keycloak 18080:80 >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:18080/realms/shopnoltd/.well-known/openid-configuration >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Could not reach Keycloak through the cluster-local port-forward. Check the self-hosted runner's read-only Kubernetes access and Keycloak service readiness."
            exit 1
          fi
          export KEYCLOAK_BASE_URL="http://127.0.0.1:18080"
          python3 - <<'PY'
          import csv, hashlib, json, os, re, sys, urllib.error, urllib.parse, urllib.request
          from collections import Counter

          base = os.environ["KEYCLOAK_BASE_URL"].rstrip("/")
          realm = os.environ.get("KEYCLOAK_REALM", "shopnoltd")
          admin_user = os.environ["KEYCLOAK_ADMIN_USER"]
          admin_password = os.environ["KEYCLOAK_ADMIN_PASSWORD"]
          token_url = f"{base}/realms/{urllib.parse.quote(realm, safe='')}/protocol/openid-connect/token"
          admin_url = f"{base}/admin/realms/{urllib.parse.quote(realm, safe='')}"
          audit_client_id = "shopnoltd-keycloak-readiness-audit"
          audit_secret_name = "shopnoltd-keycloak-audit-client"

          def request(url, data=None, token=None, method=None, json_body=None):
              headers = {"Accept": "application/json"}
              if json_body is not None:
                  data = json.dumps(json_body).encode()
                  headers["Content-Type"] = "application/json"
                  method = method or "POST"
              elif data is not None:
                  headers["Content-Type"] = "application/x-www-form-urlencoded"
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  # Extract only a safe machine-readable error code and response-server hints.
                  # Never print the response body, client ID, secret, token, or account data.
                  try:
                      payload = json.loads(e.read(512).decode("utf-8", "replace"))
                  except Exception:
                      payload = {}
                  raw_error = payload.get("error", "") if isinstance(payload, dict) else ""
                  error_code = re.sub(r"[^A-Za-z0-9_-]", "", str(raw_error))[:64] or "unavailable"
                  raw_server = e.headers.get("Server", "unknown")
                  server = re.sub(r"[^A-Za-z0-9_.-]", "", raw_server)[:32] or "unknown"
                  cf_ray = "yes" if e.headers.get("CF-Ray") else "no"
                  raise RuntimeError(
                      f"Keycloak API returned HTTP {e.code} for {urllib.parse.urlsplit(url).path} "
                      f"(error_code={error_code}, server={server}, cf_ray_present={cf_ray})"
                  ) from None
              except Exception as e:
                  raise RuntimeError(f"Request failed for {urllib.parse.urlsplit(url).path}: {type(e).__name__}") from None

          def get_admin_token():
              form = urllib.parse.urlencode({
                  "grant_type": "password",
                  "client_id": "admin-cli",
                  "username": admin_user,
                  "password": admin_password,
              }).encode()
              payload = request(f"{base}/realms/master/protocol/openid-connect/token", data=form)
              if not isinstance(payload, dict) or not payload.get("access_token"):
                  raise RuntimeError("Keycloak bootstrap authentication failed; check the cluster-held bootstrap credential")
              return payload["access_token"]

          def ensure_audit_client(admin_token):
              # Create/update one dedicated confidential client; its service account
              # receives only view-users, query-users, and view-realm.
              query = urllib.parse.urlencode({"clientId": audit_client_id})
              clients = request(f"{admin_url}/clients?{query}", token=admin_token)
              if not isinstance(clients, list):
                  raise RuntimeError("Unexpected Keycloak clients API response")
              if clients:
                  client = clients[0]
                  client_uuid = client["id"]
                  desired_client_settings = {
                      "serviceAccountsEnabled": True,
                      "publicClient": False,
                      "protocol": "openid-connect",
                      "standardFlowEnabled": False,
                      "implicitFlowEnabled": False,
                      "directAccessGrantsEnabled": False,
                      "enabled": True,
                      "clientAuthenticatorType": "client-secret",
                  }
                  if any(client.get(key) != value for key, value in desired_client_settings.items()):
                      client.update(desired_client_settings)
                      request(
                          f"{admin_url}/clients/{urllib.parse.quote(client_uuid, safe='')}",
                          token=admin_token, method="PUT", json_body=client,
                      )
              else:
                  payload = {
                      "clientId": audit_client_id,
                      "name": "Shopnoltd read-only account readiness audit",
                      "enabled": True,
                      "protocol": "openid-connect",
                      "publicClient": False,
                      "serviceAccountsEnabled": True,
                      "standardFlowEnabled": False,
                      "implicitFlowEnabled": False,
                      "directAccessGrantsEnabled": False,
                      "clientAuthenticatorType": "client-secret",
                  }
                  request(f"{admin_url}/clients", token=admin_token, method="POST", json_body=payload)
                  clients = request(f"{admin_url}/clients?{query}", token=admin_token)
                  if not isinstance(clients, list) or not clients:
                      raise RuntimeError("Created audit client could not be found")
                  client_uuid = clients[0]["id"]

              realm_clients = request(f"{admin_url}/clients?clientId=realm-management", token=admin_token)
              if not isinstance(realm_clients, list) or not realm_clients:
                  raise RuntimeError("Keycloak realm-management client was not found")
              realm_management_uuid = realm_clients[0]["id"]
              service_account = request(
                  f"{admin_url}/clients/{urllib.parse.quote(client_uuid, safe='')}/service-account-user",
                  token=admin_token,
              )
              if not isinstance(service_account, dict) or not service_account.get("id"):
                  raise RuntimeError("Audit client service account is unavailable")
              mappings_url = (
                  f"{admin_url}/users/{urllib.parse.quote(service_account['id'], safe='')}"
                  f"/role-mappings/clients/{urllib.parse.quote(realm_management_uuid, safe='')}"
              )
              mapped = request(mappings_url, token=admin_token)
              mapped_names = {role.get("name") for role in mapped or []}
              required_roles = []
              for role_name in ("view-users", "query-users", "view-realm"):
                  role = request(
                      f"{admin_url}/clients/{urllib.parse.quote(realm_management_uuid, safe='')}"
                      f"/roles/{urllib.parse.quote(role_name, safe='')}",
                      token=admin_token,
                  )
                  if not isinstance(role, dict) or not role.get("id"):
                      raise RuntimeError(f"Required read-only Keycloak role is missing: {role_name}")
                  if role_name not in mapped_names:
                      required_roles.append(role)
              if required_roles:
                  request(mappings_url, token=admin_token, method="POST", json_body=required_roles)

              secret = request(
                  f"{admin_url}/clients/{urllib.parse.quote(client_uuid, safe='')}/client-secret",
                  token=admin_token,
              )
              if not isinstance(secret, dict) or not secret.get("value"):
                  raise RuntimeError("Keycloak did not return the audit client secret")
              # Keep the secret in the cluster, not in Git, Actions logs, or artifacts.
              import base64, subprocess
              secret_yaml = (
                  "apiVersion: v1\nkind: Secret\nmetadata:\n"
                  f"  name: {audit_secret_name}\n  namespace: shopno-identity\n"
                  "type: Opaque\ndata:\n"
                  f"  client-id: {base64.b64encode(audit_client_id.encode()).decode()}\n"
                  f"  client-secret: {base64.b64encode(secret['value'].encode()).decode()}\n"
              )
              subprocess.run(
                  ["kubectl", "apply", "-f", "-"],
                  input=secret_yaml.encode(),
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              return secret["value"]

          def get_audit_token(secret_value):
              form = urllib.parse.urlencode({
                  "grant_type": "client_credentials",
                  "client_id": audit_client_id,
                  "client_secret": secret_value,
              }).encode()
              payload = request(token_url, data=form)
              if not isinstance(payload, dict) or not payload.get("access_token"):
                  raise RuntimeError("Dedicated read-only audit client authentication failed")
              return payload["access_token"]

          try:
              bootstrap_token = get_admin_token()
              client_secret = ensure_audit_client(bootstrap_token)
              token = get_audit_token(client_secret)
              # From this point onward, every Keycloak call is read-only and uses
              # the dedicated service account with only the three read roles.
              realm_settings = request(admin_url, token=token)
              if not isinstance(realm_settings, dict):
                  raise RuntimeError("Unexpected realm settings API response")
              smtp_settings = realm_settings.get("smtpServer") or {}
              smtp_configured = bool(smtp_settings.get("host") and smtp_settings.get("from"))
              reset_password_allowed = bool(realm_settings.get("resetPasswordAllowed"))

              users = []
              first = 0
              page_size = 100
              while True:
                  page = request(f"{admin_url}/users?first={first}&max={page_size}", token=token)
                  if not isinstance(page, list):
                      raise RuntimeError("Unexpected users API response")
                  users.extend(page)
                  if len(page) < page_size:
                      break
                  first += len(page)

              counts = Counter()
              rows = []
              for user in users:
                  user_id = user.get("id")
                  if not user_id:
                      raise RuntimeError("A user record had no ID; refusing to report incomplete results")
                  # Stable pseudonymous reference; never include names, usernames, or email addresses.
                  user_ref = hashlib.sha256(user_id.encode()).hexdigest()[:16]
                  credentials = request(f"{admin_url}/users/{urllib.parse.quote(user_id, safe='')}/credentials", token=token)
                  if not isinstance(credentials, list):
                      raise RuntimeError("Unexpected credentials API response")
                  types = {c.get("type") for c in credentials}
                  actions = sorted(user.get("requiredActions") or [])
                  enabled = bool(user.get("enabled"))
                  has_password = "password" in types
                  has_otp = "otp" in types
                  status = "ready_review" if enabled and has_password and not actions else "needs_attention"
                  if not enabled:
                      status = "disabled"
                  counts["total"] += 1
                  counts["enabled" if enabled else "disabled"] += 1
                  counts["email_verified" if user.get("emailVerified") else "email_unverified"] += 1
                  counts["has_password" if has_password else "no_password"] += 1
                  counts["has_otp" if has_otp else "no_otp"] += 1
                  counts["has_required_actions" if actions else "no_required_actions"] += 1
                  if status == "disabled":
                      counts["disabled_readiness"] += 1
                  else:
                      counts[status] += 1
                  rows.append({
                      "user_ref": user_ref,
                      "enabled": str(enabled).lower(),
                      "email_verified": str(bool(user.get("emailVerified"))).lower(),
                      "has_password_credential": str(has_password).lower(),
                      "has_otp_credential": str(has_otp).lower(),
                      "required_actions": ",".join(actions),
                      "readiness": status,
                  })

              if len(rows) != len(users):
                  raise RuntimeError("Audit row count did not match user count")
              with open("keycloak-readiness.csv", "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()) if rows else [
                      "user_ref","enabled","email_verified","has_password_credential",
                      "has_otp_credential","required_actions","readiness"
                  ])
                  writer.writeheader()
                  writer.writerows(rows)

              summary = [
                  "# Shopnoltd all-user Keycloak readiness audit",
                  "",
                  f"- Realm: `{realm}`",
                  f"- Password reset enabled in realm: **{str(reset_password_allowed).lower()}**",
                  f"- SMTP configured in Keycloak realm: **{str(smtp_configured).lower()}**",
                  f"- SMTP host present: **{str(bool(smtp_settings.get('host'))).lower()}**; sender present: **{str(bool(smtp_settings.get('from'))).lower()}**; port present: **{str(bool(smtp_settings.get('port'))).lower()}**",
                  f"- Accounts audited: **{counts['total']}**",
                  f"- Enabled: **{counts['enabled']}**; disabled: **{counts['disabled']}**",
                  f"- Password credential present: **{counts['has_password']}**; missing: **{counts['no_password']}**",
                  f"- OTP credential present: **{counts['has_otp']}**; missing: **{counts['no_otp']}**",
                  f"- Required actions present: **{counts['has_required_actions']}**; none: **{counts['no_required_actions']}**",
                  f"- Email verified: **{counts['email_verified']}**; unverified: **{counts['email_unverified']}**",
                  f"- Enabled with password and no required actions (readiness indicator only): **{counts['ready_review']}**",
                  f"- Needs attention by readiness rules: **{counts['needs_attention']}**",
                  "",
                  "This is a credential/readiness inventory, NOT a successful login test or a mail-delivery test. SMTP configured means only that the live realm has a host and sender value; it does not prove relay reachability or inbox delivery. It never attempts login as real users, resets passwords, or changes account settings. Email verification and OTP requirements depend on the configured realm policy. Review the CSV using pseudonymous references only; no names, usernames, or email addresses are included.",
                  "",
                  "A dedicated confidential audit client is provisioned idempotently with only view-users, query-users, and view-realm. Its client secret is stored only in the shopno-identity Kubernetes Secret; the per-account audit then uses this read-only service account.",
              "",
              "New accounts are included automatically on the next scheduled or manually triggered run.",
              ]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("\n".join(summary) + "\n")
              print(f"Audited {counts['total']} accounts; readiness summary written to GitHub Actions job summary.")
          except Exception as e:
              print(f"::error::{e}")
              sys.exit(1)
          PY

      - name: Upload pseudonymous per-account report
        if: always() && hashFiles('keycloak-readiness.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shopnoltd-keycloak-readiness
          path: keycloak-readiness.csv
          retention-days: 14
