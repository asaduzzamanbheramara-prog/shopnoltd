name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo:rw" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --report-format json --report-path=/repo/gitleaks-report.json --exit-code 2
          status=$?
          if [ ! -f gitleaks-report.json ]; then
            printf '[]\n' > gitleaks-report.json
          fi
          exit "$status"
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 7

  auto-remediate-safe-findings:
    name: Auto-remediate safe secret findings
    needs: secret-scan
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Detect and remediate safe findings
        id: remediate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .gitleaks-auto-remediation.json /tmp/gitleaks-findings.txt

          docker run --rm \
            -v "$PWD:/repo:rw" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --report-format json --report-path=/repo/.gitleaks-auto-remediation.json --exit-code 2 || true

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report = Path('.gitleaks-auto-remediation.json')
          if not report.exists():
              raise SystemExit('Gitleaks report was not produced')

          findings = json.loads(report.read_text(encoding='utf-8') or '[]')
          changed = []
          unresolved = []
          safe_dirs = ('docs/', 'examples/', 'example/', 'tests/fixtures/', 'test/fixtures/', 'fixtures/')
          assignment = re.compile(
              r'^(?P<indent>\s*)(?P<prefix>(?:export\s+)?[A-Za-z_][A-Za-z0-9_.-]*\s*(?:=|:=|:)\s*)'
              r'(?P<quote>["\']?)(?P<value>.*?)(?P=quote)(?P<suffix>\s*(?:#.*)?\r?\n?)$'
          )

          for item in findings:
              path = str(item.get('File') or '').replace('\\', '/')
              secret = item.get('Secret') or ''
              line_no = int(item.get('StartLine') or 0)
              rule = item.get('RuleID', 'unknown')
              if path.startswith('/repo/'):
                  path = path[len('/repo/'):]
              elif path == '/repo':
                  path = ''
              elif path.startswith('./'):
                  path = path[2:]
              if not path or not secret or not line_no:
                  unresolved.append((path, rule, line_no)); continue
              p = Path(path)
              if not p.is_file():
                  unresolved.append((path, rule, line_no)); continue
              lines = p.read_text(encoding='utf-8', errors='strict').splitlines(keepends=True)
              if line_no > len(lines):
                  unresolved.append((path, rule, line_no)); continue
              original = lines[line_no - 1]
              if secret not in original or '\n' in secret or '\r' in secret:
                  unresolved.append((path, rule, line_no)); continue

              new_line = None
              if path.startswith(safe_dirs):
                  new_line = original.replace(secret, '<REDACTED_SECRET>', 1)
              else:
                  m = assignment.match(original)
                  if m and m.group('value') == secret:
                      key_match = re.search(
                          r'(?:export\s+)?([A-Za-z_][A-Za-z0-9_.-]*)\s*(?:=|:=|:)',
                          m.group('prefix')
                      )
                      key = key_match.group(1) if key_match else ''
                      key = re.sub(r'[^A-Za-z0-9]+', '_', key).upper().strip('_')
                      if key and len(key) >= 3:
                          new_line = (
                              m.group('indent') + m.group('prefix') + m.group('quote') +
                              '${' + key + '}' + m.group('quote') + m.group('suffix')
                          )

              if new_line is None or new_line == original:
                  unresolved.append((path, rule, line_no)); continue
              lines[line_no - 1] = new_line
              p.write_text(''.join(lines), encoding='utf-8')
              changed.append(path)

          report.unlink(missing_ok=True)
          Path('/tmp/gitleaks-findings.txt').write_text(
              '\n'.join(f'{p}|{r}|line={l}' for p, r, l in unresolved), encoding='utf-8'
          )
          unique_changed = sorted(set(changed))
          print(f'Automatically remediated {len(unique_changed)} file(s).')
          print(f'Unresolved finding count: {len(unresolved)}')
          if not unique_changed:
              print('No safe deterministic remediation was available; the blocking Gitleaks job remains authoritative.')
              raise SystemExit(0)
          PY

          git diff --check
          test -n "$(git status --short)"

      - name: Commit safe remediation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: automatically remediate safe secret findings"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Trigger fresh security scan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run security-scan.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_BRANCH}"

  image-scan:
    name: Scan images for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
