name: Build Admin Infrastructure Image

on:
  push:
    branches:
      - main
      - feature/admin-kubernetes-argocd-20260903
    paths:
      - 'platform/admin-infrastructure/**'
      - 'shared/libraries/python/shopno_core/**'
      - '.github/workflows/build-admin-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopnoltd-admin-infrastructure

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/admin-infrastructure/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=admin-infrastructure
          cache-to: type=gha,mode=max,scope=admin-infrastructure
