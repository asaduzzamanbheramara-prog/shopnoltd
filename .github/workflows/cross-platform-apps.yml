name: Shopnoltd Cross-Platform Apps

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop-shell/**'
      - 'apps/mobile-shell/**'
      - '.github/workflows/cross-platform-apps.yml'
  pull_request:
    paths:
      - 'apps/desktop-shell/**'
      - 'apps/mobile-shell/**'
      - '.github/workflows/cross-platform-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: windows-installer
          - os: ubuntu-latest
            target: linux
            artifact: linux-installers
          - os: macos-latest
            target: macos-installer
            builder_target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop-shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package Shopnoltd desktop application
        run: npx electron-builder --config electron-builder.web.json --${{ matrix.builder_target || matrix.target }} --publish never

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: shopnoltd-${{ matrix.artifact }}
          path: apps/desktop-shell/release/web-portal/*
          if-no-files-found: error

  mobile-android:
    name: Mobile (Android phone/tablet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-shell/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run sync:web

      - name: Build Android debug APK
        working-directory: apps/mobile-shell/android
        run: bash ./gradlew assembleDebug

      - name: Locate generated Android APK
        id: android-apk
        shell: bash
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $APK_PATH"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shopnoltd-mobile-android-phone-tablet
          path: apps/mobile-shell/${{ steps.android-apk.outputs.path }}
          if-no-files-found: error

  mobile-ios:
    name: Mobile (iPhone/iPad)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npm run sync:web

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile-shell/ios/App
        run: pod install

      - name: Validate iOS project
        working-directory: apps/mobile-shell/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
