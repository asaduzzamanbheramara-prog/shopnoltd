name: Shopnoltd Self-Hosted K3s GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'platform/**'
      - 'services/**'
      - '.github/workflows/self-hosted-k3s-gitops.yml'
  workflow_dispatch:

env:
  ARGOCD_NAMESPACE: argocd
  ARGOCD_APP: shopnoltd
  ARGOCD_CLI_VERSION: v3.5.1
  MIGRATION_NAMESPACE: shopno-data
  MIGRATION_JOB: postgres-platform-migration
  MIGRATION_CONFIGMAP: postgres-platform-migrations
  CLOUDFLARED_NAMESPACE: shopno-ingress
  CLOUDFLARED_DEPLOYMENT: cloudflared
  CLOUDFLARE_SECRET_NAMESPACE: shopno-ingress
  CLOUDFLARE_SECRET_NAME: cloudflare-api-token
  PLATFORM_NAMESPACE: shopno-platform

jobs:
  deploy-and-verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      GIT_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v curl
          command -v jq
          command -v sha256sum
          test -s "${KUBECONFIG:-$HOME/.kube/config}"
          kubectl cluster-info
          kubectl auth can-i get applications.argoproj.io -n "$ARGOCD_NAMESPACE"
          kubectl auth can-i patch applications.argoproj.io -n "$ARGOCD_NAMESPACE"
          kubectl auth can-i get jobs.batch -n "$MIGRATION_NAMESPACE"
          kubectl auth can-i patch jobs.batch -n "$MIGRATION_NAMESPACE"
          kubectl auth can-i get pods --all-namespaces
          kubectl auth can-i get deployments -n "$CLOUDFLARED_NAMESPACE"
          kubectl auth can-i get secret -n "$CLOUDFLARE_SECRET_NAMESPACE"
          kubectl auth can-i get secret -n shopno-tools
          kubectl auth can-i create secret -n "$PLATFORM_NAMESPACE"

      - name: Install pinned Argo CD CLI
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --silent --show-error --location \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-linux-amd64" \
            -o "$tmpdir/argocd"
          curl --fail --silent --show-error --location \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/cli_checksums.txt" \
            -o "$tmpdir/cli_checksums.txt"
          expected="$(awk '$2 == "argocd-linux-amd64" {print $1}' "$tmpdir/cli_checksums.txt")"
          test -n "$expected"
          actual="$(sha256sum "$tmpdir/argocd" | awk '{print $1}')"
          test "$actual" = "$expected"
          install -m 0555 "$tmpdir/argocd" "$RUNNER_TEMP/argocd"
          "$RUNNER_TEMP/argocd" version --client --short
          echo "ARGOCD_CLI=$RUNNER_TEMP/argocd" >> "$GITHUB_ENV"

      - name: Validate rendered Kubernetes source
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize k8s >/dev/null

      - name: Provision Android Cloud GHCR pull secret
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n "$PLATFORM_NAMESPACE" get secret ghcr-pull-secret >/dev/null 2>&1; then
            echo 'Android Cloud GHCR pull secret already exists; preserving it.'
          else
            kubectl -n shopno-tools get secret ghcr-pull-secret -o json \
              | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.ownerReferences)' \
              | jq --arg namespace "$PLATFORM_NAMESPACE" '.metadata.namespace=$namespace' \
              | kubectl apply -f -
          fi

      - name: Repair migration prerequisite and terminate stale Argo CD operation
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ARGO CD PRE-SYNC STATE ====='
          kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.sync.status}{" / "}{.status.health.status}{" / "}{.status.operationState.phase}{" / "}{.status.sync.revision}{"\n"}'

          automated="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.syncPolicy.automated}' 2>/dev/null || true)"
          if [ -n "$automated" ]; then
            echo 'Temporarily disabling Argo CD automated sync while repairing the stale hook.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" --type=json -p='[{"op":"remove","path":"/spec/syncPolicy/automated"}]'
          else
            echo 'Argo CD automated sync is already disabled.'
          fi

          phase="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          if [ "$phase" = "Running" ]; then
            echo 'Terminating the running Argo CD operation through the supported Argo CD CLI.'
            timeout 60s "$ARGOCD_CLI" --core app terminate-op "$ARGOCD_APP" --app-namespace "$ARGOCD_NAMESPACE"
          elif [ "$phase" = "Terminating" ]; then
            echo 'Argo CD operation is already terminating; waiting for the controller.'
          else
            echo "No running Argo CD operation requires termination (phase=${phase:-none})."
          fi

          echo 'Waiting for the Argo CD controller to finish terminating any stale operation.'
          operation_stopped=0
          for _ in {1..36}; do
            phase="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            message="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.message}' 2>/dev/null || true)"
            echo "ArgoCD phase=$phase message=$message"
            if [ -z "$phase" ] || { [ "$phase" != "Running" ] && [ "$phase" != "Terminating" ]; }; then
              operation_stopped=1
              break
            fi
            sleep 5
          done
          if [ "$operation_stopped" -ne 1 ]; then
            echo 'Argo CD operation did not leave Running/Terminating after 180 seconds; aborting repair rather than racing the controller.'
            exit 1
          fi

          if ! timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get configmap "$MIGRATION_CONFIGMAP" >/dev/null 2>&1; then
            echo 'Migration ConfigMap is absent; materializing the source-owned ConfigMap before recreating the hook.'
            test -f k8s/services/postgres/migration/012-payment-schema-reconciliation.sql
            kubectl create configmap "$MIGRATION_CONFIGMAP" --from-file=012-payment-schema-reconciliation.sql=k8s/services/postgres/migration/012-payment-schema-reconciliation.sql --dry-run=client -o yaml | kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" apply -f -
            kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" annotate configmap "$MIGRATION_CONFIGMAP" argocd.argoproj.io/sync-wave=-11 --overwrite
          else
            echo 'Migration ConfigMap exists; preserving it.'
          fi

          if timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
            echo 'Removing the stale migration hook without waiting for Kubernetes pod termination.'
            timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" delete job "$MIGRATION_JOB" --ignore-not-found --wait=false
            echo 'Waiting for the stale migration Job to disappear.'
            removed=0
            for _ in {1..12}; do
              if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                echo 'Stale migration Job removed.'
                removed=1
                break
              fi
              echo 'Migration Job is still terminating; waiting 5 seconds.'
              sleep 5
            done

            if [ "$removed" -ne 1 ]; then
              echo 'Migration Job is still terminating; inspecting finalizers.'
              finalizers="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
              deletion_timestamp="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
              echo "deletionTimestamp=$deletion_timestamp"
              echo "finalizers=$finalizers"
              if grep -q 'argocd.argoproj.io/hook-finalizer' <<<"$finalizers"; then
                echo 'Removing the stale Argo hook finalizer from the already-deleting migration Job.'
                timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" patch job "$MIGRATION_JOB" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]'
              fi
              for _ in {1..12}; do
                if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                  echo 'Stale migration Job removed after finalizer cleanup.'
                  removed=1
                  break
                fi
                echo 'Migration Job is still terminating after finalizer cleanup; waiting 5 seconds.'
                sleep 5
              done
            fi

            if [ "$removed" -ne 1 ]; then
              echo 'Stale migration Job did not finish deletion after finalizer cleanup.'
              kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='deletionTimestamp={.metadata.deletionTimestamp}{"\n"}finalizers={.metadata.finalizers}{"\n"}'
              exit 1
            fi
          fi

          echo "Requesting full Argo CD sync for revision $GIT_REVISION"
          sync_request_epoch="$(date -u +%s)"
          printf '%s\n' "$sync_request_epoch" > "$RUNNER_TEMP/shopnoltd-argocd-sync-request-epoch"

          timeout 45s kubectl --request-timeout=30s \
            -n "$ARGOCD_NAMESPACE" \
            annotate application "$ARGOCD_APP" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

          # Use the supported Argo CD CLI operation instead of the nonexistent
          # Application.spec.operation field. No --resource selectors are used,
          # so this is a full-application sync.
          timeout 900s "$ARGOCD_CLI" \
            --core \
            app sync "$ARGOCD_APP" \
            --app-namespace "$ARGOCD_NAMESPACE" \
            --revision "$GIT_REVISION" \
            --timeout 840

          echo 'Argo CD full sync command completed.'

      - name: Wait for Argo CD full sync
        shell: bash
        run: |
          set -euo pipefail

          request_epoch="$(cat "$RUNNER_TEMP/shopnoltd-argocd-sync-request-epoch")"
          deadline=$((SECONDS + 900))
          seen_exact_revision=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o json)"
            operation_phase="$(jq -r '.status.operationState.phase // ""' <<<"$state")"
            operation_revision="$(jq -r '.status.operationState.operation.sync.revision // ""' <<<"$state")"
            sync_revision="$(jq -r '.status.sync.revision // ""' <<<"$state")"
            sync_status="$(jq -r '.status.sync.status // ""' <<<"$state")"
            health_status="$(jq -r '.status.health.status // ""' <<<"$state")"
            started_at="$(jq -r '.status.operationState.startedAt // ""' <<<"$state")"
            started_epoch=0
            if [ -n "$started_at" ]; then
              started_epoch="$(date -d "$started_at" +%s 2>/dev/null || echo 0)"
            fi

            echo "phase=$operation_phase operationRevision=$operation_revision syncRevision=$sync_revision sync=$sync_status health=$health_status startedAt=$started_at"

            if [ "$operation_revision" = "$GIT_REVISION" ] && [ "$started_epoch" -ge "$request_epoch" ]; then
              seen_exact_revision=1
            fi

            if [ "$seen_exact_revision" -eq 1 ] \
              && [ "$operation_phase" = "Succeeded" ] \
              && [ "$operation_revision" = "$GIT_REVISION" ] \
              && [ "$sync_revision" = "$GIT_REVISION" ] \
              && [ "$sync_status" = "Synced" ] \
              && [ "$health_status" = "Healthy" ]; then
              echo 'Argo CD full sync verified at the requested revision.'
              exit 0
            fi

            sleep 10
          done

          echo 'Argo CD full sync verification timed out.'
          kubectl -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o yaml
          exit 1

      - name: Restore Argo CD automated sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.syncPolicy.automated}' 2>/dev/null | grep -q .; then
            echo 'Restoring Argo CD automated sync policy from source.'
            kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" --type=merge -p='{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
          else
            echo 'Argo CD automated sync is already enabled.'
          fi

      - name: Verify Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" rollout status deployment/"$CLOUDFLARED_DEPLOYMENT" --timeout=180s
          test "$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o jsonpath='{.status.availableReplicas}')" = "$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o jsonpath='{.spec.replicas}')"

      - name: Verify Cloudflare API secret reference
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$CLOUDFLARE_SECRET_NAMESPACE" get secret "$CLOUDFLARE_SECRET_NAME" >/dev/null

      - name: Verify deployed images are registry-backed
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods --all-namespaces -o json \
            | jq -r '.items[] | .spec.containers[]? | .image' \
            | grep -E '(^ghcr.io/|^[^/]+/[^/]+/)' \
            | sort -u >/dev/null

      - name: Verify platform communications
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$PLATFORM_NAMESPACE" get pods -o wide

      - name: Verify migration hook
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o wide
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" wait --for=condition=complete job/"$MIGRATION_JOB" --timeout=300s

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== APPLICATION ====='
          kubectl -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o yaml
          echo '===== MIGRATION JOB ====='
          kubectl -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o yaml
          echo '===== MIGRATION PODS ====='
          kubectl -n "$MIGRATION_NAMESPACE" get pods -l job-name="$MIGRATION_JOB" -o wide
          kubectl -n "$MIGRATION_NAMESPACE" logs job/"$MIGRATION_JOB" --all-containers=true --tail=300
          echo '===== PLATFORM PODS ====='
          kubectl -n "$PLATFORM_NAMESPACE" get pods -o wide
          echo '===== CLOUDFLARED ====='
          kubectl -n "$CLOUDFLARED_NAMESPACE" get pods -o wide
