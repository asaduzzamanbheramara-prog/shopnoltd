name: Self-hosted k3s GitOps deployment

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'ops/cloudflare/**'
      - '.github/workflows/self-hosted-k3s-gitops.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARGOCD_NAMESPACE: argocd
  ARGOCD_APP: shopnoltd
  MIGRATION_NAMESPACE: shopno-data
  MIGRATION_JOB: postgres-platform-migration
  MIGRATION_CONFIGMAP: postgres-platform-migrations
  CLOUDFLARED_NAMESPACE: shopno-ingress
  CLOUDFLARED_DEPLOYMENT: cloudflared
  CLOUDFLARE_SECRET_NAMESPACE: shopno-ingress
  CLOUDFLARE_SECRET_NAME: cloudflare-api-token
  PLATFORM_NAMESPACE: shopno-platform

jobs:
  deploy-and-verify:
    name: Reconcile GitOps and verify k3s
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo 'kubectl is required on the self-hosted runner'; exit 1; }
          command -v curl >/dev/null || { echo 'curl is required on the self-hosted runner'; exit 1; }
          command -v jq >/dev/null || { echo 'jq is required on the self-hosted runner'; exit 1; }
          test -f "${KUBECONFIG:-$HOME/.kube/config}" || { echo 'KUBECONFIG is not configured on the runner'; exit 1; }
          kubectl version --client
          kubectl cluster-info
          kubectl auth can-i get applications.argoproj.io -n "$ARGOCD_NAMESPACE"
          kubectl auth can-i patch applications.argoproj.io -n "$ARGOCD_NAMESPACE"
          kubectl auth can-i get jobs -n "$MIGRATION_NAMESPACE"
          kubectl auth can-i patch jobs -n "$MIGRATION_NAMESPACE"
          kubectl auth can-i get pods -n "$MIGRATION_NAMESPACE"
          kubectl auth can-i get deployments -n "$CLOUDFLARED_NAMESPACE"
          kubectl auth can-i get deployments -n "$PLATFORM_NAMESPACE"
          kubectl auth can-i get secret/"$CLOUDFLARE_SECRET_NAME" -n "$CLOUDFLARE_SECRET_NAMESPACE"

      - name: Validate rendered Kubernetes source
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize k8s >/tmp/shopnoltd-rendered.yaml
          test -s /tmp/shopnoltd-rendered.yaml
          echo "Rendered $(wc -l </tmp/shopnoltd-rendered.yaml) lines from GitHub revision $GITHUB_SHA"

      - name: Repair migration prerequisite and terminate stale Argo CD operation
        shell: bash
        env:
          GIT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo '===== ARGO CD PRE-SYNC STATE ====='
          kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.sync.status}{" / "}{.status.health.status}{" / "}{.status.operationState.phase}{" / "}{.status.sync.revision}{"\n"}'

          # Pause automated sync first. This closes the race where Argo automatically
          # starts a new sync after the workflow observes no explicit spec.operation.
          automated="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.syncPolicy.automated}' 2>/dev/null || true)"
          if [ -n "$automated" ]; then
            echo 'Temporarily disabling Argo CD automated sync while repairing the stale hook.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" \
              --type=json \
              -p='[{"op":"remove","path":"/spec/syncPolicy/automated"}]'
          else
            echo 'Argo CD automated sync is already disabled.'
          fi

          # Terminate any explicit operation. Automated sync is paused above so a new
          # operation cannot race this cleanup.
          operation="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.operation}' 2>/dev/null || true)"
          if [ -n "$operation" ]; then
            echo 'Clearing explicit Argo CD operation before touching the migration hook.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" \
              --type=json \
              -p='[{"op":"remove","path":"/spec/operation"}]'
          else
            echo 'No explicit Argo CD operation remains in spec.'
          fi

          echo 'Waiting for the Argo CD controller to stop the stale operation.'
          operation_stopped=0
          for _ in {1..36}; do
            phase="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            message="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.message}' 2>/dev/null || true)"
            echo "ArgoCD phase=$phase message=$message"
            if [ "$phase" != "Running" ]; then
              operation_stopped=1
              break
            fi
            sleep 5
          done
          if [ "$operation_stopped" -ne 1 ]; then
            echo 'Argo CD operation is still Running after 180 seconds; aborting repair rather than racing the controller.'
            exit 1
          fi

          # Materialize only this exact source-owned ConfigMap if it is absent.
          if ! timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get configmap "$MIGRATION_CONFIGMAP" >/dev/null 2>&1; then
            echo 'Migration ConfigMap is absent; materializing the source-owned ConfigMap before recreating the hook.'
            test -f k8s/services/postgres/migration/012-payment-schema-reconciliation.sql
            kubectl create configmap "$MIGRATION_CONFIGMAP" \
              --from-file=012-payment-schema-reconciliation.sql=k8s/services/postgres/migration/012-payment-schema-reconciliation.sql \
              --dry-run=client -o yaml \
              | kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" apply -f -
            kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" annotate configmap "$MIGRATION_CONFIGMAP" \
              argocd.argoproj.io/sync-wave=-11 --overwrite
          else
            echo 'Migration ConfigMap exists; preserving it.'
          fi

          if timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
            echo 'Removing the stale migration hook without waiting for Kubernetes pod termination.'
            timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" delete job "$MIGRATION_JOB" --ignore-not-found --wait=false
            echo 'Waiting for the stale migration Job to disappear.'
            removed=0
            for _ in {1..12}; do
              if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                echo 'Stale migration Job removed.'
                removed=1
                break
              fi
              echo 'Migration Job is still terminating; waiting 5 seconds.'
              sleep 5
            done

            # The stuck object is specifically blocked by Argo's hook finalizer. Once
            # the stale Argo operation is stopped and automated sync is paused, removing
            # only that finalizer lets Kubernetes complete deletion without touching the
            # PostgreSQL Deployment, PVC, or database contents.
            if [ "$removed" -ne 1 ]; then
              echo 'Migration Job is still terminating; inspecting finalizers.'
              finalizers="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
              deletion_timestamp="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
              echo "deletionTimestamp=$deletion_timestamp"
              echo "finalizers=$finalizers"
              if grep -q 'argocd.argoproj.io/hook-finalizer' <<<"$finalizers"; then
                echo 'Removing the stale Argo hook finalizer from the already-deleting migration Job.'
                timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" patch job "$MIGRATION_JOB" \
                  --type=json \
                  -p='[{"op":"remove","path":"/metadata/finalizers"}]'
              fi

              for _ in {1..12}; do
                if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                  echo 'Stale migration Job removed after finalizer cleanup.'
                  removed=1
                  break
                fi
                echo 'Migration Job is still terminating after finalizer cleanup; waiting 5 seconds.'
                sleep 5
              done
            fi

            if [ "$removed" -ne 1 ]; then
              echo 'Stale migration Job did not finish deletion after finalizer cleanup.'
              kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='deletionTimestamp={.metadata.deletionTimestamp}{"\n"}finalizers={.metadata.finalizers}{"\n"}'
              exit 1
            fi
          fi

          echo "Requesting exact Argo CD sync for revision $GIT_REVISION"
          timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" annotate application "$ARGOCD_APP" \
            argocd.argoproj.io/refresh=hard --overwrite
          timeout 60s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" \
            --type merge \
            -p "{\"operation\":{\"sync\":{\"revision\":\"$GIT_REVISION\"}}}"
          echo 'Exact Argo CD sync request accepted.'

      - name: Wait for Argo CD sync
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sync="$(kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.sync.status}')"
            health="$(kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.health.status}')"
            phase="$(kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.phase}')"
            revision="$(kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.sync.revision}')"
            echo "ArgoCD: sync=$sync health=$health phase=$phase revision=$revision"
            if [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
              echo "ArgoCD reconciliation succeeded."
              exit 0
            fi
            sleep 15
          done
          echo "ArgoCD reconciliation did not reach Synced/Healthy within 15 minutes."
          exit 1

      - name: Restore Argo CD automated sync policy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo 'Restoring source-defined Argo CD automated sync policy.'
          timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" \
            --type=json \
            -p='[{"op":"add","path":"/spec/syncPolicy/automated","value":{"prune":false,"selfHeal":true}}]'

      - name: Reconcile Cloudflare Tunnel DNS
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/cloudflare/ensure-tunnel-dns.sh
          ops/cloudflare/ensure-tunnel-dns.sh

      - name: Restart and verify Cloudflared tunnel connector
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" rollout restart deployment/"$CLOUDFLARED_DEPLOYMENT"
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" rollout status deployment/"$CLOUDFLARED_DEPLOYMENT" --timeout=180s
          sleep 20
          ready="$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get pods -l app.kubernetes.io/name=cloudflared -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{"\n"}{end}' | grep -c '^true$' || true)"
          test "$ready" -ge 1
          logs="$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" logs deployment/"$CLOUDFLARED_DEPLOYMENT" --tail=250 2>&1 || true)"
          printf '%s\n' "$logs"
          if ! grep -Eiq 'registered tunnel connection|connection.*registered' <<<"$logs"; then
            echo 'Cloudflared did not report a registered tunnel connection after restart.'
            exit 1
          fi
          echo 'Cloudflared reported a registered tunnel connection.'

          for url in \
            https://shopnoltd.dpdns.org \
            https://api.shopnoltd.dpdns.org/healthz \
            https://chat.shopnoltd.dpdns.org; do
            ok=0
            for attempt in {1..6}; do
              code="$(curl -k -L -sS -o /tmp/cloudflare-smoke-body -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              echo "$url attempt $attempt/6 -> HTTP ${code:-000}"
              case "$code" in
                2*|3*|401|403) ok=1; break ;;
              esac
              sleep 10
            done
            test "$ok" -eq 1
          done

      - name: Verify Cloudflared image matches GitHub source
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -E '^[[:space:]]*image:[[:space:]]*cloudflare/cloudflared:' k8s/ingress/cloudflared/deployment.yaml | head -1 | awk '{print $2}')"
          live="$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "GitHub source image: $expected"
          echo "Live image:          $live"
          test -n "$expected"
          test "$live" = "$expected"
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" rollout status deployment/"$CLOUDFLARED_DEPLOYMENT" --timeout=180s

      - name: Verify platform communications and Android Cloud rollouts
        shell: bash
        run: |
          set -euo pipefail
          for deployment in messaging-service meet-service live-service android-cloud-controller android-cloud-web; do
            echo "Waiting for $PLATFORM_NAMESPACE/$deployment"
            kubectl --request-timeout=30s -n "$PLATFORM_NAMESPACE" rollout status deployment/"$deployment" --timeout=180s
          done

      - name: Verify migration hook completed
        shell: bash
        run: |
          set -euo pipefail
          if kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
            succeeded="$(kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.status.succeeded}')"
            echo "Migration job succeeded=$succeeded"
            test "$succeeded" = "1"
          else
            echo "Migration hook Job is absent after successful ArgoCD reconciliation; hook-delete-policy may have removed it after success."
          fi

      - name: Collect migration and Argo CD diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== ARGOCD APPLICATION ====='
          kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o yaml
          echo '===== ARGOCD OPERATION MESSAGE ====='
          kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.message}'
          echo
          echo '===== MIGRATION JOB ====='
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o wide
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" describe job "$MIGRATION_JOB"
          echo '===== MIGRATION PODS ====='
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get pods -l job-name="$MIGRATION_JOB" -o wide
          echo '===== MIGRATION LOGS ====='
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" logs job/"$MIGRATION_JOB" --all-containers --tail=300
          echo '===== MIGRATION EVENTS ====='
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get events --sort-by=.lastTimestamp | tail -100
          echo '===== PLATFORM COMMUNICATIONS / ANDROID ====='
          kubectl --request-timeout=30s -n "$PLATFORM_NAMESPACE" get deployments,pods -l 'app.kubernetes.io/part-of=shopnoltd' -o wide
          echo '===== CLOUDFLARED ====='
          kubectl --request-timeout=30s -n "$CLOUDFLARE_SECRET_NAMESPACE" get secret "$CLOUDFLARE_SECRET_NAME" -o jsonpath='{.type}'
          echo
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o wide
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get pods -l app.kubernetes.io/name=cloudflared -o wide
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" logs deployment/"$CLOUDFLARED_DEPLOYMENT" --tail=250
