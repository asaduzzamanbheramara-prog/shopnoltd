name: Shopnoltd Self-Hosted K3s GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'platform/**'
      - 'services/**'
      - '.github/workflows/self-hosted-k3s-gitops.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: k3s-gitops
  cancel-in-progress: false

env:
  ARGOCD_NAMESPACE: argocd
  ARGOCD_APP: shopnoltd
  MIGRATION_NAMESPACE: shopno-data
  MIGRATION_JOB: postgres-platform-migration
  MIGRATION_CONFIGMAP: postgres-platform-migrations
  CLOUDFLARED_NAMESPACE: shopno-ingress
  CLOUDFLARED_DEPLOYMENT: cloudflared
  CLOUDFLARE_SECRET_NAMESPACE: shopno-ingress
  CLOUDFLARE_SECRET_NAME: cloudflared-creds
  PLATFORM_NAMESPACE: shopno-platform

jobs:
  deploy-and-verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      GIT_REVISION: ${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          command -v curl
          command -v jq
          command -v sha256sum
          test -s "${KUBECONFIG:-$HOME/.kube/config}"

          echo 'Checking Kubernetes API connectivity with retries.'
          cluster_ready=0
          for attempt in {1..6}; do
            if kubectl --request-timeout=20s cluster-info >/dev/null 2>&1; then
              cluster_ready=1
              break
            fi
            echo "Kubernetes API connectivity attempt $attempt/6 failed; retrying in 10 seconds."
            sleep 10
          done
          if [ "$cluster_ready" -ne 1 ]; then
            echo 'Kubernetes API did not become reachable after retries.'
            kubectl --request-timeout=20s cluster-info
            exit 1
          fi

          echo 'Kubernetes API connectivity is verified; concrete deployment operations below provide the required authorization checks.'

      - name: Validate rendered Kubernetes source
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize k8s >/dev/null

      - name: Provision Android Cloud GHCR pull secret
        shell: bash
        run: |
          set -euo pipefail
          echo 'Refreshing Android Cloud GHCR pull secret from the current GitHub Actions token.'
          kubectl -n "$PLATFORM_NAMESPACE" create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision domain service PostgreSQL secret
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n "$PLATFORM_NAMESPACE" get secret domain-postgres-secret >/dev/null 2>&1; then
            echo 'Domain PostgreSQL secret already exists; preserving it.'
          else
            kubectl -n shopno-data get secret postgres-secret -o json |
              jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields,.metadata.ownerReferences)' |
              jq --arg namespace "$PLATFORM_NAMESPACE" --arg name domain-postgres-secret '.metadata.namespace=$namespace | .metadata.name=$name' |
              kubectl apply -f -
          fi

      - name: Provision free-domain service PostgreSQL and Keycloak secrets
        shell: bash
        run: |
          set -euo pipefail
          postgres_user="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)"
          postgres_password="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
          keycloak_password="$(kubectl -n shopno-identity get secret keycloak-secret -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' 2>/dev/null | base64 -d || true)"
          if [ -z "$keycloak_password" ]; then
            echo 'Existing keycloak-secret is missing KC_BOOTSTRAP_ADMIN_PASSWORD; refusing to create a partial freedomain secret.'
            exit 1
          fi
          freedomain_password="$(kubectl -n "$PLATFORM_NAMESPACE" get secret freedomain-service-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/dev/null | base64 -d || true)"
          if [ -z "$freedomain_password" ]; then
            freedomain_password="$(openssl rand -hex 32)"
          fi
          if kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'freedomain'" | grep -q 1; then
            kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE freedomain LOGIN PASSWORD '$freedomain_password'"
          else
            kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE freedomain LOGIN PASSWORD '$freedomain_password'"
          fi
          if ! kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname = 'freedomain'" | grep -q 1; then
            kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE freedomain OWNER freedomain"
          else
            kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE freedomain OWNER TO freedomain"
          fi
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d postgres -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE freedomain TO freedomain"
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d freedomain -v ON_ERROR_STOP=1 -c "GRANT USAGE,CREATE ON SCHEMA public TO freedomain"
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d freedomain -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO freedomain"
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d freedomain -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO freedomain"
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" psql -U "$postgres_user" -d freedomain -v ON_ERROR_STOP=1 -c "DO \$\$ DECLARE r record; BEGIN FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP EXECUTE format('ALTER TABLE public.%I OWNER TO freedomain', r.tablename); END LOOP; FOR r IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public' LOOP EXECUTE format('ALTER SEQUENCE public.%I OWNER TO freedomain', r.sequencename); END LOOP; END \$\$;"
          database_url="postgresql+asyncpg://freedomain:$freedomain_password@postgres.shopno-data.svc.cluster.local:5432/freedomain"
          internal_key="$(kubectl -n "$PLATFORM_NAMESPACE" get secret freedomain-service-secret -o jsonpath='{.data.FREEDOMAIN_INTERNAL_KEY}' 2>/dev/null | base64 -d || true)"
          if [ -z "$internal_key" ]; then
            internal_key="$(openssl rand -hex 32)"
          fi
          domain_token="$(kubectl -n "$PLATFORM_NAMESPACE" get secret freedomain-service-secret -o jsonpath='{.data.DOMAIN_SERVICE_TOKEN}' 2>/dev/null | base64 -d || true)"
          kubectl -n "$PLATFORM_NAMESPACE" create secret generic freedomain-service-secret             --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD="$keycloak_password"             --from-literal=POSTGRES_USER=freedomain             --from-literal=POSTGRES_PASSWORD="$freedomain_password"             --from-literal=DATABASE_URL="$database_url"             --from-literal=FREEDOMAIN_INTERNAL_KEY="$internal_key"             --from-literal=DOMAIN_SERVICE_TOKEN="$domain_token"             --dry-run=client -o yaml | kubectl -n "$PLATFORM_NAMESPACE" apply -f -
          echo 'Free-domain service PostgreSQL and Keycloak credentials reconciled without exposing their values.'

      - name: Provision ad-service PostgreSQL secret
        shell: bash
        run: |
          set -euo pipefail
          postgres_user="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)"
          postgres_password="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
          database_url="$(python3 - "$postgres_user" "$postgres_password" <<'PY'
          import sys
          from urllib.parse import quote
          user, password = sys.argv[1], sys.argv[2]
          print(f"postgresql+asyncpg://{quote(user, safe='')}:{quote(password, safe='')}@postgres.shopno-data.svc.cluster.local:5432/ads")
          PY
          )"
          kubectl -n "$PLATFORM_NAMESPACE" create secret generic ad-service-secret \
            --from-literal=database-url="$database_url" \
            --dry-run=client -o yaml | kubectl -n "$PLATFORM_NAMESPACE" apply -f -
          echo 'Ad-service PostgreSQL secret reconciled.'

      - name: Provision shared ad-network payment service key
        shell: bash
        run: |
          set -euo pipefail
          payment_key="$(kubectl -n shopno-payments get secret payment-service-secret -o jsonpath='{.data.INTERNAL_API_KEY}' 2>/dev/null | base64 -d || true)"
          ad_key="$(kubectl -n "$PLATFORM_NAMESPACE" get secret ad-service-secret -o jsonpath='{.data.INTERNAL_API_KEY}' 2>/dev/null | base64 -d || true)"
          if [ -n "$payment_key" ] && [ -n "$ad_key" ] && [ "$payment_key" != "$ad_key" ]; then
            echo 'Existing ad-network payment keys differ; refusing to rotate credentials implicitly.'
            exit 1
          fi
          shared_key="$payment_key"
          if [ -z "$shared_key" ]; then
            shared_key="$ad_key"
          fi
          if [ -z "$shared_key" ]; then
            shared_key="$(openssl rand -hex 32)"
          fi
          patch_secret() {
            local namespace="$1"
            local name="$2"
            local encoded
            encoded="$(printf '%s' "$shared_key" | base64 -w0)"
            kubectl -n "$namespace" get secret "$name" -o json |
              jq --arg encoded "$encoded" '.data.INTERNAL_API_KEY=$encoded' |
              kubectl apply -f -
          }
          patch_secret shopno-payments payment-service-secret
          patch_secret "$PLATFORM_NAMESPACE" ad-service-secret
          echo 'Shared ad-network payment authentication key reconciled without exposing its value.'
          echo 'Both services retain their existing secret fields.'

      - name: Provision mail admin mailbox credential
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n shopno-mail get secret mail-admin-credentials >/dev/null 2>&1; then
            echo 'Mail admin mailbox credential already exists; preserving it.'
          else
            echo 'Provisioning missing mail admin mailbox credential.'
            mailbox_password="$(openssl rand -hex 24)"
            kubectl -n shopno-mail create secret generic mail-admin-credentials \
              --from-literal=MAILBOX_PASSWORD="$mailbox_password" \
              --dry-run=client -o yaml | kubectl -n shopno-mail apply -f -
          fi

      - name: Repair migration prerequisite and terminate stale Argo CD operation
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ARGO CD PRE-SYNC STATE ====='
          kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.sync.status}{" / "}{.status.health.status}{" / "}{.status.operationState.phase}{" / "}{.status.sync.revision}{"\n"}'

          automated="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.syncPolicy.automated}' 2>/dev/null || true)"
          if [ -n "$automated" ]; then
            echo 'Temporarily disabling Argo CD automated sync while repairing the stale hook.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" --type=json -p='[{"op":"remove","path":"/spec/syncPolicy/automated"}]'
          else
            echo 'Argo CD automated sync is already disabled.'
          fi

          phase="$(timeout 30s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          if [ "$phase" = "Running" ]; then
            echo 'Requesting proper Argo CD operation termination through the supported CLI in Kubernetes-core mode.'

            echo 'Clearing the pending Argo CD operation directly through the Kubernetes Application resource.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" --type=merge -p='{"operation":null}'
            echo 'Forcing an Argo CD application refresh so the controller observes the terminated operation immediately.'
            timeout 45s kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" annotate application "$ARGOCD_APP" argocd.argoproj.io/refresh=hard --overwrite
          elif [ "$phase" = "Terminating" ]; then
            echo 'Argo CD operation is already terminating; waiting for the controller.'
          else
            echo "No running Argo CD operation requires termination (phase=${phase:-none})."
          fi

          echo 'Waiting for the Argo CD controller to clear the stale operation.'
          operation_stopped=0
          for _ in {1..24}; do
            app_state="$(timeout 15s kubectl --request-timeout=15s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o json 2>/dev/null || true)"
            phase="$(jq -r '.status.operationState.phase // ""' <<<"$app_state")"
            message="$(jq -r '.status.operationState.message // ""' <<<"$app_state")"
            operation_revision="$(jq -r '.operation.sync.revision // ""' <<<"$app_state")"
            echo "ArgoCD phase=$phase operationRevision=$operation_revision message=$message"

            # Argo CD may retain a stale status.operationState=Running after the live
            # Application operation field has already been cleared. The live operation
            # field is authoritative for whether a new sync can be submitted.
            if [ -z "$operation_revision" ] || [ -z "$phase" ] || { [ "$phase" != "Running" ] && [ "$phase" != "Terminating" ]; }; then
              operation_stopped=1
              break
            fi

            if [[ "$message" == *"waiting for completion of hook"* ]]; then
              hook_complete="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
              if [ "$hook_complete" = "True" ]; then
                echo 'Argo CD is still waiting on a completed migration hook; removing the completed hook so the controller can advance.'
                timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" delete job "$MIGRATION_JOB" --ignore-not-found --wait=false || true

                for _ in {1..6}; do
                  if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                    echo 'Completed migration hook removed.'
                    break
                  fi

                  finalizers="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
                  deletion_timestamp="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
                  if [ -n "$deletion_timestamp" ] && grep -q 'argocd.argoproj.io/hook-finalizer' <<<"$finalizers"; then
                    echo 'Completed migration hook is blocked by its Argo hook finalizer; clearing that finalizer.'
                    timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" patch job "$MIGRATION_JOB" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
                  fi
                  sleep 5
                done
              fi
            fi

            sleep 5
          done

          if [ "$operation_stopped" -ne 1 ]; then
            echo 'Argo CD operation did not leave Running/Terminating after 120 seconds.'
            kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='phase={.status.operationState.phase}{"\n"}message={.status.operationState.message}{"\n"}revision={.status.operationState.operation.sync.revision}{"\n"}'
            exit 1
          fi

          echo 'Reconciling migration ConfigMap from the trusted main checkout.'
          mapfile -t migration_files < <(find k8s/services/postgres/migration -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo 'No migration SQL files were found in the trusted checkout.'
            exit 1
          fi
          configmap_args=()
          for migration_file in "${migration_files[@]}"; do
            configmap_args+=(--from-file="${migration_file}=k8s/services/postgres/migration/${migration_file}")
          done
          kubectl create configmap "$MIGRATION_CONFIGMAP" "${configmap_args[@]}" --dry-run=client -o yaml |
            kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" apply -f -
          kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" annotate configmap "$MIGRATION_CONFIGMAP" argocd.argoproj.io/sync-wave=-11 --overwrite

          if timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
            echo 'Removing the stale migration hook without waiting for Kubernetes pod termination.'
            timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" delete job "$MIGRATION_JOB" --ignore-not-found --wait=false
            echo 'Waiting for the stale migration Job to disappear.'
            removed=0
            for _ in {1..12}; do
              if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                echo 'Stale migration Job removed.'
                removed=1
                break
              fi
              echo 'Migration Job is still terminating; waiting 5 seconds.'
              sleep 5
            done

            if [ "$removed" -ne 1 ]; then
              echo 'Migration Job is still terminating; inspecting finalizers.'
              finalizers="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.finalizers}' 2>/dev/null || true)"
              deletion_timestamp="$(timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
              echo "deletionTimestamp=$deletion_timestamp"
              echo "finalizers=$finalizers"
              if grep -q 'argocd.argoproj.io/hook-finalizer' <<<"$finalizers"; then
                echo 'Removing the stale Argo hook finalizer from the already-deleting migration Job.'
                timeout 30s kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" patch job "$MIGRATION_JOB" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]'
              fi
              for _ in {1..12}; do
                if ! timeout 15s kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" >/dev/null 2>&1; then
                  echo 'Stale migration Job removed after finalizer cleanup.'
                  removed=1
                  break
                fi
                echo 'Migration Job is still terminating after finalizer cleanup; waiting 5 seconds.'
                sleep 5
              done
            fi

            if [ "$removed" -ne 1 ]; then
              echo 'Stale migration Job did not finish deletion after finalizer cleanup.'
              kubectl --request-timeout=15s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o jsonpath='deletionTimestamp={.metadata.deletionTimestamp}{"\n"}finalizers={.metadata.finalizers}{"\n"}'
              exit 1
            fi
          fi

          echo "Requesting full Argo CD sync for revision $GIT_REVISION"
          sync_request_epoch="$(date -u +%s)"
          printf '%s\n' "$sync_request_epoch" > "$RUNNER_TEMP/shopnoltd-argocd-sync-request-epoch"

          timeout 45s kubectl --request-timeout=30s             -n "$ARGOCD_NAMESPACE"             annotate application "$ARGOCD_APP"             argocd.argoproj.io/refresh=hard             --overwrite

          echo 'Requesting the full Argo CD sync through the Kubernetes Application resource.'
          timeout 60s kubectl --request-timeout=30s             -n "$ARGOCD_NAMESPACE"             patch application "$ARGOCD_APP"             --type=merge             -p "$(jq -nc --arg revision "$GIT_REVISION"               '{operation:{sync:{revision:$revision,prune:false}}}')"

          echo 'Argo CD full sync request submitted to the controller.'

      - name: Ensure Kobo and session-manager runtime database secrets
        shell: bash
        run: |
          set -euo pipefail
          postgres_password="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
          postgres_user="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)"
          postgres_db="$(kubectl -n shopno-data get secret postgres-secret -o jsonpath='{.data.POSTGRES_DB}' | base64 -d)"
          kobo_password="$(kubectl -n shopno-apps get secret kobotoolbox-secret -o jsonpath='{.data.KOBOCAT_PASSWORD}' 2>/dev/null | base64 -d || true)"
          if [ -z "$kobo_password" ]; then
            kobo_password="$(openssl rand -hex 32)"
          fi
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" KOBO_PASSWORD="$kobo_password" PGUSER="$postgres_user" PGDB="$postgres_db" /bin/bash -lc 'set -euo pipefail; if psql -d "$PGDB" -Atqc "SELECT 1 FROM pg_roles WHERE rolname = '\''kobotoolbox'\''" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d "$PGDB" -c "ALTER ROLE kobotoolbox LOGIN PASSWORD '\''$KOBO_PASSWORD'\''"; else psql -v ON_ERROR_STOP=1 -d "$PGDB" -c "CREATE ROLE kobotoolbox LOGIN PASSWORD '\''$KOBO_PASSWORD'\''"; fi; if ! psql -d "$PGDB" -Atqc "SELECT 1 FROM pg_database WHERE datname = '\''kpi'\''" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d "$PGDB" -c "CREATE DATABASE kpi OWNER kobotoolbox"; fi; if ! psql -d "$PGDB" -Atqc "SELECT 1 FROM pg_database WHERE datname = '\''kobocat'\''" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d "$PGDB" -c "CREATE DATABASE kobocat OWNER kobotoolbox"; fi'
          kpi_database_url="postgresql://kobotoolbox:$kobo_password@postgres.shopno-data.svc.cluster.local:5432/kpi"
          kobocat_database_url="postgis://kobotoolbox:$kobo_password@postgres.shopno-data.svc.cluster.local:5432/kobocat"
          kubectl -n shopno-apps create secret generic kobotoolbox-database --from-literal=POSTGRES_HOST=postgres.shopno-data.svc.cluster.local --from-literal=POSTGRES_PORT=5432 --from-literal=POSTGRES_DB=kobocat --from-literal=POSTGRES_USER=kobotoolbox --from-literal=POSTGRES_PASSWORD="$kobo_password" --from-literal=DATABASE_URL="$kobocat_database_url" --from-literal=KPI_DATABASE_URL="$kpi_database_url" --from-literal=KC_DATABASE_URL="$kobocat_database_url" --dry-run=client -o yaml | kubectl -n shopno-apps apply -f -
          encryption_key="$(kubectl -n shopno-tools get secret session-manager-secrets -o jsonpath='{.data.ENCRYPTION_KEY}' | base64 -d)"
          database_url="postgresql://${postgres_user}:${postgres_password}@postgres.shopno-data.svc.cluster.local:5432/session_manager"
          kubectl -n shopno-data exec deployment/postgres -- env PGPASSWORD="$postgres_password" PGUSER="$postgres_user" PGDB="$postgres_db" /bin/bash -lc 'if ! psql -d "$PGDB" -Atqc "SELECT 1 FROM pg_database WHERE datname = '\''session_manager'\''" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d "$PGDB" -c "CREATE DATABASE session_manager OWNER \"$PGUSER\""; fi'
          kubectl -n shopno-tools create secret generic session-manager-secrets --from-literal=DATABASE_URL="$database_url" --from-literal=ENCRYPTION_KEY="$encryption_key" --dry-run=client -o yaml | kubectl -n shopno-tools apply -f -
          echo 'Enforcing Kobo database ownership, PostGIS extension, and schema privileges.'
          kubectl -n shopno-data exec deployment/postgres -- psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE kobocat OWNER TO kobotoolbox;"
          kubectl -n shopno-data exec deployment/postgres -- psql -U postgres -d kobocat -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          kubectl -n shopno-data exec deployment/postgres -- psql -U postgres -d kobocat -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO kobotoolbox; GRANT USAGE,CREATE ON SCHEMA public TO kobotoolbox;"
          echo 'Restarting Kobo web, worker, and beat workloads so they consume the reconciled database credentials.'
          for deployment in kobotoolbox kobotoolbox-beat kobotoolbox-worker; do
            kubectl -n shopno-apps rollout restart deployment/"$deployment"
          done
          kubectl -n shopno-apps rollout status deployment/kobotoolbox --timeout=180s
          kubectl -n shopno-apps rollout status deployment/kobotoolbox-worker --timeout=180s
          kubectl -n shopno-apps rollout status deployment/kobotoolbox-beat --timeout=180s
          echo 'Applying Kobo django_celery_beat migrations before Argo rollout.'
          kubectl exec -n shopno-apps deployment/kobotoolbox-worker -- env KPI_DATABASE_URL="$kpi_database_url" KC_DATABASE_URL="$kobocat_database_url" DATABASE_URL="$kobocat_database_url" python /srv/src/kpi/manage.py migrate django_celery_beat --noinput

      - name: Recreate only unbound disabled-service PVCs after storage migration
        shell: bash
        run: |
          set -euo pipefail
          pvc_specs=(
            "shopno-monitoring/grafana-data"
            "shopno-monitoring/loki-data"
            "shopno-monitoring/prometheus-data"
            "shopno-apps/owncast-data"
            "shopno-platform/interior-service-data"
            "shopno-platform/license-service-data"
            "shopno-platform/training-service-data"
          )

          for ref in "${pvc_specs[@]}"; do
            namespace="${ref%%/*}"
            name="${ref#*/}"
            phase="$(kubectl -n "$namespace" get pvc "$name" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            if [ "$phase" = "Pending" ]; then
              echo "Deleting unbound PVC $namespace/$name so the native WaitForFirstConsumer class can be recreated safely."
              kubectl -n "$namespace" delete pvc "$name" --wait=true --timeout=30s
            elif [ -n "$phase" ]; then
              echo "Keeping $namespace/$name because its current phase is $phase."
            else
              echo "$namespace/$name does not currently exist; Argo CD will create it from source."
            fi
          done

      - name: Wait for Argo CD full sync
        shell: bash
        run: |
          set -euo pipefail

          request_epoch="$(cat "$RUNNER_TEMP/shopnoltd-argocd-sync-request-epoch")"
          deadline=$((SECONDS + 900))
          seen_exact_revision=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            state=""
            for attempt in {1..3}; do
              if state="$(timeout 20s kubectl --request-timeout=20s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o json 2>/tmp/shopnoltd-argocd-get-error)"; then
                break
              fi
              echo "Transient Kubernetes API failure while reading Argo CD Application (attempt $attempt/3)."
              cat /tmp/shopnoltd-argocd-get-error || true
              state=""
              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done

            if [ -z "$state" ]; then
              echo 'Argo CD Application could not be read; treating this as transient and retrying.'
              sleep 10
              continue
            fi

            operation_phase="$(jq -r '.status.operationState.phase // ""' <<<"$state")"
            operation_revision="$(jq -r '.operation.sync.revision // ""' <<<"$state")"
            status_operation_revision="$(jq -r '.status.operationState.operation.sync.revision // ""' <<<"$state")"
            sync_revision="$(jq -r '.status.sync.revision // ""' <<<"$state")"
            sync_status="$(jq -r '.status.sync.status // ""' <<<"$state")"
            health_status="$(jq -r '.status.health.status // ""' <<<"$state")"
            started_at="$(jq -r '.status.operationState.startedAt // ""' <<<"$state")"
            started_epoch=0
            if [ -n "$started_at" ]; then
              started_epoch="$(date -d "$started_at" +%s 2>/dev/null || echo 0)"
            fi

            echo "phase=$operation_phase operationRevision=$operation_revision statusOperationRevision=$status_operation_revision syncRevision=$sync_revision sync=$sync_status health=$health_status startedAt=$started_at"

            # Use the live Application operation field for revision identity. Argo CD
            # can retain an older status.operationState operation revision while a
            # newer live operation is already running.
            if [ "$operation_revision" = "$GIT_REVISION" ]; then
              seen_exact_revision=1
            fi

            if [ "$seen_exact_revision" -eq 1 ]               && [ "$operation_phase" = "Succeeded" ]               && [ "$sync_revision" = "$GIT_REVISION" ]               && [ "$sync_status" = "Synced" ]               && [ "$health_status" = "Healthy" ]; then
              echo 'Argo CD full sync verified at the requested revision.'
              exit 0
            fi

            sleep 10
          done

          echo 'Argo CD full sync verification timed out.'
          kubectl -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o yaml
          exit 1

      - name: Restore Argo CD automated sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o jsonpath='{.spec.syncPolicy.automated}' 2>/dev/null | grep -q .; then
            echo 'Restoring Argo CD automated sync policy from source.'
            kubectl --request-timeout=30s -n "$ARGOCD_NAMESPACE" patch application "$ARGOCD_APP" --type=merge -p='{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
          else
            echo 'Argo CD automated sync is already enabled.'
          fi

      - name: Verify Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" rollout status deployment/"$CLOUDFLARED_DEPLOYMENT" --timeout=180s
          test "$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o jsonpath='{.status.availableReplicas}')" = "$(kubectl --request-timeout=30s -n "$CLOUDFLARED_NAMESPACE" get deployment "$CLOUDFLARED_DEPLOYMENT" -o jsonpath='{.spec.replicas}')"

      - name: Verify Cloudflare API secret reference
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$CLOUDFLARE_SECRET_NAMESPACE" get secret "$CLOUDFLARE_SECRET_NAME" >/dev/null

      - name: Verify deployed images are registry-backed
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods --all-namespaces -o json             | jq -r '.items[] | .spec.containers[]? | .image'             | grep -E '(^ghcr.io/|^[^/]+/[^/]+/)'             | sort -u >/dev/null

      - name: Verify platform communications
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=30s -n "$PLATFORM_NAMESPACE" get pods -o wide

      - name: Verify migration hook
        shell: bash
        run: |
          set -euo pipefail
          if kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o wide; then
            kubectl --request-timeout=30s -n "$MIGRATION_NAMESPACE" wait --for=condition=complete job/"$MIGRATION_JOB" --timeout=300s
          else
            echo "Migration hook Job is already absent; accepting successful Argo hook cleanup."
          fi

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== APPLICATION ====='
          kubectl -n "$ARGOCD_NAMESPACE" get application "$ARGOCD_APP" -o yaml
          echo '===== MIGRATION JOB ====='
          kubectl -n "$MIGRATION_NAMESPACE" get job "$MIGRATION_JOB" -o yaml
          echo '===== MIGRATION PODS ====='
          kubectl -n "$MIGRATION_NAMESPACE" get pods -l job-name="$MIGRATION_JOB" -o wide
          kubectl -n "$MIGRATION_NAMESPACE" logs job/"$MIGRATION_JOB" --all-containers=true --tail=300
          echo '===== PLATFORM PODS ====='
          kubectl -n "$PLATFORM_NAMESPACE" get pods -o wide
          echo '===== CLOUDFLARED ====='
          kubectl -n "$CLOUDFLARED_NAMESPACE" get pods -o wide
