name: Software and OS catalogue validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'catalogue/**'
      - 'docs/universal-software-os-center/**'
      - 'scripts/validate-software-os-catalogue.py'
      - 'tests/software-os-catalogue/**'
      - 'frontend/software-os-center.html'
      - 'frontend/index.html'
      - 'frontend/Dockerfile'
      - '.github/workflows/software-os-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'catalogue/**'
      - 'scripts/validate-software-os-catalogue.py'
      - 'tests/software-os-catalogue/**'
      - '.github/workflows/software-os-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate sample catalogue entry
        run: python scripts/validate-software-os-catalogue.py
      - name: Run catalogue policy regression tests
        run: python -m unittest discover -s tests/software-os-catalogue -p 'test_*.py' -v
      - name: Build static frontend image
        run: docker build -f frontend/Dockerfile -t shopnoltd-software-os-center frontend
