name: Codespaces zero-replica service preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'platform/interior-service/**'
      - 'platform/license-service/**'
      - 'platform/training-service/**'
      - 'shared/libraries/python/shopno_core/**'
      - 'k8s/services/interior-service/**'
      - 'k8s/services/license-service/**'
      - 'k8s/services/training-service/**'
      - '.github/workflows/codespaces-zero-replica-preflight.yml'
      - 'docs/codespaces-zero-replica-preflight.md'

permissions:
  contents: read

concurrency:
  group: codespaces-zero-replica-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest-and-build:
    name: Validate ${{ matrix.service }} image and manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: interior-service
            dockerfile: platform/interior-service/Dockerfile
            manifest: k8s/services/interior-service/deployment.yaml
          - service: license-service
            dockerfile: platform/license-service/Dockerfile
            manifest: k8s/services/license-service/deployment.yaml
          - service: training-service
            dockerfile: platform/training-service/Dockerfile
            manifest: k8s/services/training-service/deployment.yaml

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check manifest and dependency-safety invariants
        env:
          SERVICE: ${{ matrix.service }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          test -f "$MANIFEST"
          test -f "platform/$SERVICE/Dockerfile"
          test -f "platform/$SERVICE/requirements.txt"
          test -f "platform/$SERVICE/app/main.py"
          python3 - "$MANIFEST" "$SERVICE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          service = sys.argv[2]
          text = path.read_text()
          if not re.search(r"(?m)^kind:\s*Deployment\s*$", text):
              raise SystemExit(f"FAIL: {path} is not a Deployment manifest")
          if not re.search(r"(?m)^\s*replicas:\s*0\s*(?:#.*)?$", text):
              raise SystemExit(
                  f"BLOCKED: expected source manifest for {service} to remain at replicas: 0; "
                  "do not change production replica counts as part of this preflight"
              )
          if not re.search(r"(?m)^\s*name:\s*" + re.escape(service) + r"\s*$", text):
              raise SystemExit(f"FAIL: {path} does not name {service}")
          print(f"PASS: {service} manifest exists and remains intentionally at replicas: 0")
          print("NOTE: this checks repository source only, not the effective live cluster state.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: shopnoltd-preflight/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Confirm this job did not publish or deploy
        run: |
          echo "PASS: image build requested with push=false."
          echo "No registry push, cluster credentials, deployment, replica change, or production traffic change is performed by this workflow."
