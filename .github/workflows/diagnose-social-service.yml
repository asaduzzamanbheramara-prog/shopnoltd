name: Diagnose Social Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect social service safely
        shell: bash
        run: |
          set +e
          echo '== deployment =='
          kubectl -n shopno-platform get deployment social-service -o wide
          echo '== pods =='
          kubectl -n shopno-platform get pods -l app.kubernetes.io/name=social-service -o wide
          echo '== service endpoints =='
          kubectl -n shopno-platform get endpointslice -l kubernetes.io/service-name=social-service -o wide
          echo '== secret key names only =='
          kubectl -n shopno-platform get secret social-service-secret -o json | python3 -c 'import json,sys; print(sorted(json.load(sys.stdin).get("data",{})))'
          echo '== deployment events =='
          kubectl -n shopno-platform describe deployment social-service | tail -n 120
          echo '== pod diagnostics and recent logs =='
          for pod in $(kubectl -n shopno-platform get pods -l app.kubernetes.io/name=social-service -o name 2>/dev/null); do
            echo "--- $pod"
            kubectl -n shopno-platform describe "$pod" | tail -n 160
            kubectl -n shopno-platform logs "$pod" --tail=240 || true
            kubectl -n shopno-platform logs "$pod" --previous --tail=120 || true
          done
          echo '== internal health probe from runner =='
          kubectl -n shopno-platform run social-health-probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- curl -fsS --max-time 10 http://social-service/healthz || true
          kubectl -n shopno-platform run social-ready-probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- curl -fsS --max-time 10 http://social-service/readyz || true
          echo '== database dependency status =='
          kubectl -n shopno-data get deployment postgres redis -o wide
          kubectl -n shopno-data get endpointslice -l kubernetes.io/service-name=postgres -o wide
          kubectl -n shopno-data get endpointslice -l kubernetes.io/service-name=redis -o wide
          kubectl -n shopno-data run dependency-probe --rm -i --restart=Never --image=busybox:1.36 -- sh -c 'nc -zvw3 postgres 5432; nc -zvw3 redis 6379' || true
          echo '== parsed social dependency targets (credentials omitted) =='
          pod="$(kubectl -n shopno-platform get pods -l app.kubernetes.io/name=social-service -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n shopno-platform exec "$pod" -- python3 -c '
          import os
          from urllib.parse import urlsplit
          for key in ("DATABASE_URL", "REDIS_URL"):
              value=os.environ.get(key, "")
              parsed=urlsplit(value)
              print(key, {"scheme": parsed.scheme, "hostname": parsed.hostname, "port": parsed.port, "path": parsed.path})
          '
          kubectl -n shopno-platform run dependency-probe --rm -i --restart=Never --image=busybox:1.36 -- sh -c 'nc -zvw3 postgres.shopno-data.svc.cluster.local 5432; nc -zvw3 redis.shopno-data.svc.cluster.local 6379' || true
